<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ludo 3D · Biker Society</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0d14; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:#fff; }
  #scene { position:fixed; inset:0; }
  #scene canvas { display:block; }
  .ui { position:fixed; left:0; right:0; z-index:10; pointer-events:none; }
  .ui > * { pointer-events:auto; }
  #topbar { top:0; display:flex; align-items:center; gap:10px; padding:12px 14px; background:linear-gradient(#0a0d14ee,#0a0d1400); }
  #topbar .ttl { font-weight:900; font-size:16px; flex:1; }
  .btn { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:#fff; border-radius:12px; padding:9px 14px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn.cyan { background:linear-gradient(135deg,#00d4ff,#0088cc); color:#06222c; border:none; box-shadow:0 4px 16px rgba(0,212,255,.35); }
  .btn.green { background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; border:none; }
  #bottombar { bottom:0; display:flex; align-items:center; gap:12px; padding:14px; background:linear-gradient(#0a0d1400,#0a0d14ee); }
  #turn { flex:1; font-size:14px; font-weight:800; }
  #dieval { width:46px; height:46px; border-radius:10px; background:#fff; color:#111; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:900; box-shadow:0 2px 8px rgba(0,0,0,.5); }
  #overlay { position:fixed; inset:0; z-index:20; background:rgba(5,7,11,0.92); display:flex; align-items:center; justify-content:center; padding:20px; }
  #overlay .panel { width:100%; max-width:380px; }
  #overlay h1 { font-size:22px; font-weight:900; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  #overlay .sub { color:#9aa4b2; font-size:13px; margin-bottom:16px; }
  .card { background:#121723; border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .muted { color:#9aa4b2; font-size:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .hidden { display:none !important; }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#1b2230; border:1px solid rgba(255,255,255,0.15); padding:10px 18px; border-radius:22px; font-size:13px; z-index:40; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
  <div id="scene"></div>

  <div class="ui hidden" id="game-ui">
    <div id="topbar">
      <button class="btn" onclick="LUDO.exit()">← Salir</button>
      <div class="ttl">Ludo 3D</div>
      <button class="btn" onclick="LUDO.toLobby()">Mesas</button>
    </div>
    <div id="bottombar">
      <div id="dieval">🎲</div>
      <div id="turn">…</div>
      <button class="btn green hidden" id="rollbtn" onclick="LUDO.roll()">🎲 Tirar</button>
    </div>
  </div>

  <div id="overlay">
    <div class="panel" id="overlay-content">
      <h1>🎲 Ludo 3D</h1>
      <div class="sub">Cargando…</div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="lib/three.min.js"></script>
  <script src="lib/OrbitControls.js"></script>
  <script src="ludo3d.js"></script>
</body>
</html>
