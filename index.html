<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <title>Biker Society</title>
  <style>html,body{margin:0;height:100%;background:#07090d;color:#fff;font-family:system-ui,sans-serif}.boot{height:100%;display:grid;place-items:center;text-align:center;gap:12px}.boot i{width:38px;height:38px;border:3px solid #3b4658;border-top-color:#ff5a3d;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
  <div class="boot"><i></i><strong>Cargando Biker Society...</strong></div>
  <script>
    (() => {
      const stable = 'https://biker-society-v2.vercel.app/';
      const absolute = (value) => /^(https?:|data:|#|\/\/)/.test(value) ? value : stable + value.replace(/^\//, '');
      fetch(stable, { cache: 'no-store' })
        .then(response => response.text())
        .then(html => {
          html = html.replace('<script src="google-config.js"></script>', '<script>window.BS_GOOGLE_CLIENT_ID = \'\';</scr' + 'ipt>');
          html = html.replace('<script src="https://accounts.google.com/gsi/client"></script>', '');
          html = html.replace(/\b(src|href)=(['"])([^'"]+)\2/g, (match, attribute, quote, value) => `${attribute}=${quote}${absolute(value)}${quote}`);
          html = html.replace('</body>', '<script src="/bikergram-sociala.js"></scr' + 'ipt></body>');
          document.open();
          document.write(html);
          document.close();
        })
        .catch(() => document.body.innerHTML = '<div class="boot"><strong>No se pudo cargar la aplicación.</strong></div>');
    })();
  </script>
</body>
</html>
