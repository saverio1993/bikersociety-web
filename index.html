function handlePostDrop(e) {
  e.preventDefault();
  e.currentTarget.style.borderColor = 'var(--border)';
  e.currentTarget.style.background = 'var(--card)';
  const file = e.dataTransfer.files[0];
  if (file) processPostFile(file);
}

function handlePostFile(e) {
  const file = e.target.files[0];
  if (file) processPostFile(file);
}

async function processPostFile(file) {
  if (file.size > 25 * 1024 * 1024) { toast('Archivo muy grande (máx 25MB)'); return; }

  // Detect media type
  const isImage = file.type.startsWith('image/');
  const isVideo = file.type.startsWith('video/');
  const isAudio = file.type.startsWith('audio/');

  if (!isImage && !isVideo && !isAudio) { toast('Tipo de archivo no soportado'); return; }

  // For images, compress; for video/audio, just convert to data URL (browsers handle playback)
  let dataUrl;
  if (isImage) {
    dataUrl = await compressImage(file, 1280, 0.85);
    if (!dataUrl) { toast('No se pudo procesar la imagen'); return; }
  } else {
    dataUrl = await fileToDataUrl(file);
  }

  POST_DRAFT = {
    type: isImage ? 'image' : (isVideo ? 'video' : 'audio'),
    dataUrl,
    fileName: file.name,
    fileSize: file.size,
    mimeType: file.type,
  };

  // Render preview
  renderPostPreview();
}

function renderPostPreview() {
  const preview = document.getElementById('post-media-preview');
  const zone = document.getElementById('post-media-zone');
  const typeIndicator = document.getElementById('post-media-type');
  if (!POST_DRAFT || !POST_DRAFT.dataUrl) {
    preview.style.display = 'none';
    preview.innerHTML = '';
    if (zone) zone.style.display = 'block';
    if (typeIndicator) typeIndicator.style.display = 'none';
    return;
  }
  if (zone) zone.style.display = 'none';
  preview.style.display = 'block';
  const sizeKB = Math.round(POST_DRAFT.fileSize / 1024);
  const typeEmoji = POST_DRAFT.type === 'image' ? '📷' : (POST_DRAFT.type === 'video' ? '🎬' : '🎵');
  const typeLabel = POST_DRAFT.type === 'image' ? 'Imagen' : (POST_DRAFT.type === 'video' ? 'Video' : 'Audio');

  if (POST_DRAFT.type === 'image') {
    preview.innerHTML = `
      <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
        <img src="${POST_DRAFT.dataUrl}" style="display:block;width:100%;max-height:480px;object-fit:contain;background:#000" onload="this.dataset.aspect=this.naturalHeight/this.naturalWidth">
        <button type="button" onclick="clearPostMedia()" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;backdrop-filter:blur(8px)">✕</button>
        <div style="position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.7);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;backdrop-filter:blur(8px)">${typeEmoji} ${typeLabel} · ${sizeKB}KB</div>
      </div>
    `;
  } else if (POST_DRAFT.type === 'video') {
    preview.innerHTML = `
      <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
        <video src="${POST_DRAFT.dataUrl}" controls style="display:block;width:100%;max-height:480px;background:#000"></video>
        <button type="button" onclick="clearPostMedia()" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;backdrop-filter:blur(8px);z-index:5">✕</button>
        <div style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.7);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;backdrop-filter:blur(8px)">${typeEmoji} ${typeLabel} · ${(sizeKB/1024).toFixed(1)}MB</div>
      </div>
    `;
  } else {
    // audio
    preview.innerHTML = `
      <div style="position:relative;border-radius:12px;background:linear-gradient(135deg,rgba(255,68,68,0.15),rgba(255,136,0,0.15));border:1px solid var(--border);padding:14px">
        <button type="button" onclick="clearPostMedia()" style="position:absolute;top:8px;right:8px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer">✕</button>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
          <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ff4444,#ff8800);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;animation:audioPulse 2s ease-in-out infinite">🎵</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${POST_DRAFT.fileName}</div>
            <div style="font-size:11px;color:var(--text2)">${typeEmoji} ${typeLabel} · ${sizeKB}KB</div>
          </div>
        </div>
        <audio src="${POST_DRAFT.dataUrl}" controls style="width:100%"></audio>
      </div>
    `;
  }
  if (typeIndicator) {
    typeIndicator.style.display = 'block';
    typeIndicator.textContent = `${typeEmoji} ${typeLabel} detectado — listo para publicar`;
  }
}

function clearPostMedia() {
  POST_DRAFT = { type: null, dataUrl: null, fileName: '', fileSize: 0, mimeType: null };
  ['image','video','audio'].forEach(t => {
    const inp = document.getElementById('post-file-' + t);
    if (inp) inp.value = '';
  });
  renderPostPreview();
}

function doCreatePost() {
  const content = document.getElementById('post-content').value.trim();
  if (!content && (!POST_DRAFT || !POST_DRAFT.dataUrl)) { toast('Escribe algo o sube una foto/video/audio'); return; }
  const post = {
    id: Date.now() % 100000,
    user_id: STATE.user.id,
    content,
    media_type: POST_DRAFT?.type || null,
    media_url: POST_DRAFT?.dataUrl || null,
    image_url: POST_DRAFT?.type === 'image' ? POST_DRAFT.dataUrl : null, // legacy field
    created_at: new Date().toISOString(),
    likes: [],
    comments: []
  };
  STATE.posts.unshift(post);
  saveState();
  POST_DRAFT = null;
  closeModal();
  navigate('bikergram');
}

function deletePost(id) {
  if (!confirm('Eliminar esta publicacion?')) return;
  STATE.posts = STATE.posts.filter(p => p.id !== id);
  saveState();
  renderBikerGram();
  toast('Eliminado');
}

// ============================================================
// EVENTOS PAGE
// ============================================================
function renderEventos() {
  const upcoming = STATE.events.filter(e => e.status === 'activo');
  const past = STATE.events.filter(e => e.status !== 'activo');

  document.getElementById('page-eventos').innerHTML = `
    <div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:18px;font-weight:800">Eventos</div>
      ${STATE.user?.is_admin ? `<button class="btn btn-primary" style="padding:8px 16px;font-size:12px" onclick="createEvent()">+ Crear evento</button>` : ''}
    </div>

    <div class="tab-bar">
      <button class="tab ${past.length === 0 ? 'active' : ''}" onclick="showEventTab('proximos',this)">Proximos (${upcoming.length})</button>
      <button class="tab" onclick="showEventTab('pasados',this)">Pasados (${past.length})</button>
    </div>

    <div id="eventos-list">
      ${upcoming.length === 0 ? `
        <div class="empty-state">
          <div class="empty-icon">📅</div>
          <div>No hay eventos proximos</div>
          ${STATE.user?.is_admin ? `<button class="btn btn-primary" style="margin-top:12px" onclick="createEvent()">Crear evento</button>` : ''}
        </div>
      ` : upcoming.map(ev => renderEventCard(ev)).join('')}
    </div>
  `;
}

function showEventTab(tab, btn) {
  document.querySelectorAll('.tab-bar .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const list = tab === 'proximos' ? STATE.events.filter(e => e.status === 'activo') : STATE.events.filter(e => e.status !== 'activo');
  document.getElementById('eventos-list').innerHTML = list.length === 0
    ? '<div class="empty-state"><div class="empty-icon">📅</div><div>Sin eventos</div></div>'
    : list.map(ev => renderEventCard(ev)).join('');
}

function renderEventCard(ev) {
  const attCount = STATE.attendance.filter(a => a.event_id === ev.id).length;
  const myAtt = STATE.user && STATE.attendance.find(a => a.event_id === ev.id && a.user_id === STATE.user.id);
  return `
    <div class="event-card vanish" onclick="viewEvent(${ev.id})">
      <div style="height:140px;background:linear-gradient(135deg,rgba(255,68,68,0.3),rgba(255,136,0,0.15));display:flex;align-items:center;justify-content:center;font-size:48px">🏍️</div>
      <div class="event-body">
        <div class="event-date">${ev.date} · ${ev.time}</div>
        <div class="event-title">${ev.title}</div>
        <div class="event-meta">
          <span>📍 ${ev.location || 'N/A'}</span>
          <span>⚡ ${ev.difficulty}</span>
          <span>👥 ${attCount} riders</span>
        </div>
        <div style="margin-top:10px">
          ${myAtt
            ? '<span class="badge-green">✅ Confirmado</span>'
            : '<button class="btn btn-primary" style="padding:6px 14px;font-size:12px" onclick="event.stopPropagation();confirmEvent(' + ev.id + ')">Confirmar asistencia</button>'}
        </div>
      </div>
    </div>
  `;
}

function viewEvent(id) {
  const ev = STATE.events.find(x => x.id === id);
  if (!ev) return;
  const attCount = STATE.attendance.filter(a => a.event_id === ev.id).length;
  const attList = STATE.attendance.filter(a => a.event_id === ev.id).map(a => STATE.users.find(u => u.id === a.user_id)).filter(Boolean);
  const myAtt = STATE.user && STATE.attendance.find(a => a.event_id === ev.id && a.user_id === STATE.user.id);

  openModal(ev.title, `
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">
      📅 ${ev.date} · 🕐 ${ev.time}<br>
      📍 ${ev.location || 'N/A'} · ⚡ ${ev.difficulty}
    </div>
    ${ev.description ? `<p style="margin-bottom:16px">${ev.description}</p>` : ''}
    <div style="margin-bottom:16px">
      <div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px">ASISTENTES (${attCount})</div>
      ${attList.length === 0 ? '<div style="font-size:12px;color:var(--text3)">Nadie ha confirmado aun</div>' :
        attList.map(u => `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px">
          <div style="width:28px;height:28px;border-radius:50%;background:${avatarColor(u.id)};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff">${initials(u.username)}</div>
          <span>${u.username}</span>
          ${u.is_injured ? '<span class="badge-red" style="font-size:9px">LESIONADO</span>' : ''}
        </div>`).join('')}
    </div>
    ${myAtt
      ? '<button class="btn btn-secondary" style="width:100%" onclick="cancelEvent(' + ev.id + ')">Cancelar asistencia</button>'
      : '<button class="btn btn-primary" style="width:100%" onclick="confirmEvent(' + ev.id + ')">Confirmar asistencia</button>'}
    ${STATE.user?.is_admin ? `<button class="btn btn-ghost" style="width:100%;margin-top:8px;color:var(--danger)" onclick="deleteEvent(${ev.id})">Eliminar evento</button>` : ''}
  `);
}

function confirmEvent(id) {
  if (!STATE.user) { toast('Inicia sesion'); return; }
  if (STATE.attendance.find(a => a.event_id === id && a.user_id === STATE.user.id)) {
    toast('Ya confirmaste'); return;
  }
  STATE.attendance.push({id:Date.now(), user_id:STATE.user.id, event_id:id, confirmed_at:new Date().toISOString(), notes:'', status:'confirmed', featured:false});
  saveState();
  closeModal();
  navigate('eventos');
  toast('Asistencia confirmada!');
}

function cancelEvent(id) {
  STATE.attendance = STATE.attendance.filter(a => !(a.event_id === id && a.user_id === STATE.user.id));
  saveState();
  closeModal();
  navigate('eventos');
  toast('Asistencia cancelada');
}

function deleteEvent(id) {
  if (!confirm('Eliminar este evento?')) return;
  STATE.events = STATE.events.filter(e => e.id !== id);
  STATE.attendance = STATE.attendance.filter(a => a.event_id !== id);
  saveState();
  closeModal();
  navigate('eventos');
  toast('Evento eliminado');
}

function createEvent() {
  openModal('Crear Evento', `
    <input class="input" id="ev-title" placeholder="Titulo del evento">
    <input class="input" id="ev-desc" placeholder="Descripcion (opcional)">
    <input class="input" id="ev-date" type="date" class="input">
    <input class="input" id="ev-time" type="time" value="08:00" class="input">
    <input class="input" id="ev-location" placeholder="Ubicacion">
    <select class="input" id="ev-diff">
      <option value="facil">Facil</option>
      <option value="intermedia" selected>Intermedia</option>
      <option value="alta">Alta</option>
    </select>
    <button class="btn btn-primary" style="width:100%" onclick="doCreateEvent()">Crear evento</button>
  `);
}

function doCreateEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const desc = document.getElementById('ev-desc').value.trim();
  const date = document.getElementById('ev-date').value;
  const time = document.getElementById('ev-time').value;
  const location = document.getElementById('ev-location').value.trim();
  const diff = document.getElementById('ev-diff').value;
  if (!title || !date) { toast('Titulo y fecha son obligatorios'); return; }
  STATE.events.push({id:Date.now()%100000, title, description:desc, date, time, location, difficulty:diff, status:'activo', max_riders:0, latitude:0, longitude:0, created_by:STATE.user.id});
  saveState();
  closeModal();
  navigate('eventos');
  toast('Evento creado!');
}

// RETOS PAGE
// ============================================================
function renderRetos() {
  const myChallenges = STATE.userChallenges || [];
  const weekly = STATE.challenges.filter(c => c.category === 'weekly');
  const special = STATE.challenges.filter(c => c.category === 'special');

  document.getElementById('page-retos').innerHTML = `
    <div style="margin-bottom:16px">
      <div style="font-size:18px;font-weight:800;margin-bottom:4px">Retos y Desafios</div>
      <div style="font-size:12px;color:var(--text2)">Completa retos para ganar puntos y insignias</div>
    </div>

    <div style="margin-bottom:16px">
      <div class="card" style="padding:14px">
        <div style="font-size:12px;color:var(--text2);margin-bottom:4px">RETOS SEMANALES</div>
        ${weekly.map(c => renderChallengeCard(c, myChallenges)).join('')}
      </div>
    </div>

    <div style="margin-bottom:16px">
      <div class="card" style="padding:14px">
        <div style="font-size:12px;color:var(--text2);margin-bottom:4px">RETOS ESPECIALES</div>
        ${special.map(c => renderChallengeCard(c, myChallenges)).join('')}
      </div>
    </div>
  `;
}

function renderChallengeCard(c, myChallenges) {
  const myProg = myChallenges.find(mc => mc.challenge_id === c.id);
  const progress = myProg ? myProg.progress : 0;
  const pct = Math.min(100, (progress / c.requirement_count) * 100);
  const done = myProg && myProg.completed;
  return `
    <div class="challenge-card ${done ? 'earned' : ''}" style="margin-top:12px">
      <div class="challenge-title">
        <span style="font-size:20px">${c.icon}</span>
        ${c.title}
        ${done ? '<span class="badge-green" style="font-size:10px">COMPLETADO</span>' : ''}
      </div>
      <div class="challenge-desc">${c.description}</div>
      <div class="challenge-progress">
        <div class="challenge-track"><div class="challenge-fill" style="width:${pct}%"></div></div>
        <div class="challenge-points">${progress}/${c.requirement_count}</div>
      </div>
      <div style="margin-top:8px;font-size:12px;color:var(--accent);font-weight:600">+${c.points} pts</div>
    </div>
  `;
}

function renderInsignias() {
  if (!STATE.user) { showLogin(); return; }

  const stats = getUserStats(uid);
  const earned = STATE.userBadges.filter(ub => ub.user_id === uid).map(ub => ub.badge_id);
  const totalEarned = earned.length;

  const catLabels = {rodaje:'Rodaje',eventos:'Eventos',social:'Social',fotos:'Fotos',rutas:'Rutas',distancia:'Distancia',especial:'Especial'};
  const categories = [...new Set(STATE.badges.map(b => b.category))];

  document.getElementById('page-insignias').innerHTML = `
    <div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <div style="font-size:20px;font-weight:900">Insignias</div>
        <div style="font-size:12px;color:var(--accent);font-weight:700;background:rgba(255,68,68,0.15);padding:2px 10px;border-radius:20px">${totalEarned}/${STATE.badges.length}</div>
      </div>
      <div style="font-size:12px;color:var(--text2)">Desbloquea insignias con tu actividad</div>
    </div>

    <!-- Quick stats bar -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px">
      ${[
        {label:'Rodadas',val:stats.rides||0,icon:'🏍'},

        {label:'Racha',val:stats.streak||0,icon:'🔥'},
        {label:'Fotos',val:stats.photos||0,icon:'📸'},
      ].map(s => `
        <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center">
          <div style="font-size:18px;margin-bottom:2px">${s.icon}</div>
          <div style="font-size:16px;font-weight:800">${s.val}</div>
          <div style="font-size:10px;color:var(--text2)">${s.label}</div>
        </div>
      `).join('')}

    ${categories.map(cat => {
      const catBadges = STATE.badges.filter(b => b.category === cat);

      return `
      <div style="margin-bottom:24px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px">${catLabels[cat]||cat}</div>
          <div style="font-size:11px;color:var(--text3)">${catEarned}/${catBadges.length}</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          ${catBadges.map(b => {
            const isEarned = earned.includes(b.id);
            const ub = STATE.userBadges.find(x => x.user_id === uid && x.badge_id === b.id);
            const currentVal = stats[b.stat_type] || 0;
            const pct = Math.min(100, Math.round((currentVal / b.threshold) * 100));
            const rarityColors = {common:'#9e9e9e',rare:'#2196f3',epic:'#9c27b0',legendary:'#ffd700'};
            const rarityColor = rarityColors[b.rarity] || '#9e9e9e';

            return `
              <div style="
                background:var(--card);
                border:1px solid ${isEarned ? rarityColor : 'var(--border)'};
                border-radius:14px;
                padding:14px 8px 12px;
                text-align:center;

                position:relative;
                transition:all 0.25s;
                ${!isEarned ? 'opacity:0.7' : ''}
              " onclick="showBadgeDetail(${b.id})">
                ${isEarned
                  ? `<div style="position:absolute;top:6px;right:6px;width:8px;height:8px;background:#4caf50;border-radius:50%;box-shadow:0 0 6px #4caf50"></div>`
                  : ''
                }
                <div style="margin-bottom:6px;display:flex;justify-content:center">
                  ${getBadgeSvg(b, isEarned)}

                <div style="font-size:11px;font-weight:700;margin-bottom:4px;line-height:1.2">${b.name}</div>

                  <div style="font-size:9px;color:var(--text3);margin-bottom:6px">${currentVal}/${b.threshold}</div>

                  <div style="font-size:9px;color:var(--text3);margin-top:3px">${pct}%</div>

                  <div style="font-size:9px;color:#4caf50">+${b.points_bonus} pts</div>
                `}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `}).join('')}
  `;
}

function showBadgeDetail(id) {
  const b = STATE.badges.find(x => x.id === id);
  if (!b) return;
  if (!STATE.user) { showLogin(); return; }
  const uid = STATE.user.id;
  const earned = STATE.userBadges.find(ub => ub.badge_id === id && ub.user_id === uid);
  const stats = getUserStats(uid);
  const currentVal = stats[b.stat_type] || 0;
  const rarityColors = {common:'#9e9e9e',rare:'#2196f3',epic:'#9c27b0',legendary:'#ffd700'};
  const rarityLabels = {common:'Común',rare:'Rara',epic:'Épica',legendary:'Legendaria'};
  const rarityColor = rarityColors[b.rarity] || '#9e9e9e';
  const rarityLabel = rarityLabels[b.rarity] || b.rarity;
  const pct = Math.min(100, Math.round((currentVal / b.threshold) * 100));

  openModal(`${b.name} <span style="font-size:11px;font-weight:400;color:${rarityColor}">${rarityLabel}</span>`, `
    <div style="text-align:center;margin-bottom:16px">
      <div style="margin-bottom:12px">${getBadgeSvg(b, !!earned)}</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">${b.name}</div>
      <div style="color:var(--text2);font-size:13px;margin-bottom:8px">${b.description}</div>
      <div style="display:inline-block;background:${rarityColor}22;color:${rarityColor};font-size:11px;font-weight:700;padding:2px 12px;border-radius:20px;border:1px solid ${rarityColor}44">${rarityLabel}</div>
    </div>
    ${earned ? `
      <div style="background:rgba(76,175,80,0.1);border:1px solid rgba(76,175,80,0.3);border-radius:10px;padding:12px;text-align:center">
        <div style="color:#4caf50;font-size:13px;font-weight:700">✅ Desbloqueada</div>
        <div style="color:var(--text2);font-size:12px;margin-top:4px">el ${new Date(earned.earned_at).toLocaleDateString()}</div>
        <div style="color:var(--accent);font-size:13px;font-weight:700;margin-top:6px">+${b.points_bonus} puntos</div>
      </div>
    ` : `
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
          <span style="color:var(--text2)">Progreso</span>
          <span style="font-weight:700">${currentVal} / ${b.threshold}</span>
        </div>
        <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,${rarityColor},${rarityColor}aa);border-radius:4px;transition:width 0.5s"></div>
        </div>
        <div style="text-align:center;font-size:12px;color:var(--text3);margin-top:6px">${pct}% completo</div>
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:12px;color:var(--text2);margin-bottom:4px">Recompensa al desbloquear</div>
        <div style="color:var(--accent);font-size:16px;font-weight:800">+${b.points_bonus} puntos</div>
      </div>
    `}
  `);
}

      <div style="color:var(--text2);font-size:13px">${u.email}</div>
      <div style="color:var(--text2);font-size:13px">${u.bike_model || 'Sin moto'}</div>
      ${u.bio ? `<div style="color:var(--text2);font-size:13px;margin-top:6px;font-style:italic">"${u.bio}"</div>` : ''}
    </div>

    <!-- Points / Level -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px">Nivel</div>
          <div style="font-size:22px;font-weight:900;background:linear-gradient(135deg,#ff4444,#ff8800);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${lv.name}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:22px;font-weight:900;color:var(--accent)">${u.points}</div>
          <div style="font-size:11px;color:var(--text2)">puntos</div>
        </div>
      </div>
      <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${progress}%;background:linear-gradient(90deg,#ff4444,#ff8800);border-radius:3px;transition:width 0.5s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:4px">
        <span>${lv.min} pts</span>
        <span>${next ? next.min : 'MAX'} pts</span>
      </div>
    </div>

    <!-- Stats Grid -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px">
      ${[
        {label:'Rodadas',val:stats.rides||0,sub:'completadas',color:'#ff4444'},
        {label:'Racha',val:stats.streak||0,sub:'días seguidos',color:'#ff8800'},
        {label:'Km Totales',val:stats.total_km||0,sub:'kilómetros',color:'#607d8b'},
        {label:'Rutas Creadas',val:stats.routes_created||0,sub:'rutas',color:'#009688'},
        {label:'Fotos',val:stats.photos||0,sub:'compartidas',color:'#ffeb3b'},
        {label:'Mensajes',val:stats.chat_messages||0,sub:'en chat',color:'#2196f3'},
        {label:'Insignias',val:earned.length,sub:'de ${STATE.badges.length}',color:'#9c27b0'},
        {label:'Días Activo',val:stats.days_active||0,sub:'desde unión',color:'#546e7a'},
      ].map(s => `
        <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;position:relative;overflow:hidden">
          <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${s.color}"></div>
          <div style="font-size:20px;font-weight:900;margin-bottom:2px">${s.val}</div>
          <div style="font-size:12px;font-weight:700">${s.label}</div>
          <div style="font-size:10px;color:var(--text3)">${s.sub}</div>
        </div>
      `).join('')}
    </div>

    <!-- Earned Badges -->
    ${earned.length > 0 ? `
    <div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px">Insignias Obtenidas</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
        ${STATE.badges.filter(b => earned.includes(b.id)).map(b => `
          <div style="text-align:center;cursor:pointer" onclick="showBadgeDetail(${b.id})">
            <div style="margin-bottom:4px;display:flex;justify-content:center">${getBadgeSvg(b, true)}</div>
            <div style="font-size:10px;font-weight:600;line-height:1.2">${b.name}</div>
          </div>
        `).join('')}
      </div>
    </div>
    ` : ''}

    <!-- Locked Badges preview -->
    ${earned.length < STATE.badges.length ? `
    <div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Próximas Insignias</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
        ${STATE.badges.filter(b => !earned.includes(b.id)).slice(0,4).map(b => {
          const currentVal = stats[b.stat_type] || 0;
          const pct = Math.min(100, Math.round((currentVal / b.threshold) * 100));
          return `
            <div style="text-align:center;cursor:pointer;opacity:0.5" onclick="showBadgeDetail(${b.id})">
              <div style="margin-bottom:4px;display:flex;justify-content:center">${getBadgeSvg(b, false)}</div>
              <div style="font-size:10px;font-weight:600;line-height:1.2">${b.name}</div>
              <div style="font-size:9px;color:var(--text3)">${pct}%</div>
            </div>
          `;
        }).join('')}
      </div>
      <button class="btn btn-ghost" style="width:100%;margin-top:10px;font-size:12px" onclick="navigate('insignias')">Ver todas las insignias →</button>
    </div>
    ` : ''}

    <div style="margin-top:20px">
      <button class="btn btn-secondary" style="width:100%;margin-bottom:8px" onclick="editRider(${u.id})">Editar perfil</button>
      <button class="btn btn-secondary" style="width:100%;margin-bottom:8px" onclick="closeModal();navigate('rutas');setTimeout(createRoute,300)">Crear ruta</button>
      <button class="btn btn-ghost" style="width:100%;color:var(--danger)" onclick="logout()">Cerrar sesion</button>
    </div>
  `;
}

// ============================================================
// ADMIN PAGE
// ============================================================
function deleteUser(id) {
  const u = STATE.users.find(x => x.id === id);
  if (!u) return;
  if (!confirm(`Eliminar al usuario "${u.username}"? Esta accion no se puede deshacer.`)) return;
  STATE.users = STATE.users.filter(x => x.id !== id);
  STATE.userBadges = STATE.userBadges.filter(ub => ub.user_id !== id);
  STATE.userChallenges = STATE.userChallenges.filter(uc => uc.user_id !== id);
  STATE.attendance = STATE.attendance.filter(a => a.user_id !== id);
  STATE.notifications = STATE.notifications.filter(n => n.user_id !== id && n.actor_id !== id);
  if (STATE.user?.id === id) { logout(); return; }
  saveState();
  renderAdmin();
  toast('Usuario eliminado');
}

function renderAdmin() {
  if (!STATE.user?.is_admin) { navigate('inicio'); return; }

  document.getElementById('page-admin').innerHTML = `
    <div style="font-size:18px;font-weight:800;margin-bottom:16px">Panel de Admin</div>

    <!-- USERS -->
    <div class="admin-section">
      <div class="admin-section-header" onclick="toggleAdmin('users')">👥 Usuarios (${STATE.users.length}) <span id="arrow-users">▼</span></div>
      <div class="admin-list" id="admin-users" style="display:none">
        ${STATE.users.map(u => `
          <div class="admin-list-item">
            <div style="width:32px;height:32px;border-radius:50%;background:${avatarColor(u.id)};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff">${initials(u.username)}</div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600">${u.username}</div>
              <div style="font-size:11px;color:var(--text2)">${u.email}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:12px;color:var(--accent);font-weight:600">${u.points}pts</div>
              ${u.is_admin ? '<span class="badge-gold" style="font-size:9px">ADMIN</span>' : ''}
              ${u.is_injured ? '<span class="badge-red" style="font-size:9px">INJ</span>' : ''}
            </div>
            <button class="btn btn-ghost" style="font-size:11px;padding:4px" onclick="editRider(${u.id})">✏️</button>
            <button class="btn btn-ghost" style="font-size:11px;padding:4px;color:var(--danger)" onclick="deleteUser(${u.id})">🗑️</button>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- EVENTS -->
    <div class="admin-section">
      <div class="admin-section-header" onclick="toggleAdmin('events')">📅 Eventos (${STATE.events.length}) <span id="arrow-events">▼</span></div>
      <div class="admin-list" id="admin-events" style="display:none">
        ${STATE.events.map(ev => `
          <div class="admin-list-item">
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600">${ev.title}</div>
              <div style="font-size:11px;color:var(--text2)">${ev.date} · ${ev.location}</div>
            </div>
            <span class="badge ${ev.status==='activo'?'badge-green':'badge-red'}" style="font-size:10px">${ev.status}</span>
            <button class="btn btn-ghost" style="font-size:11px;padding:4px" onclick="editEvent(${ev.id})">✏️</button>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- NOTIFICATIONS -->
    <div class="admin-section">
      <div class="admin-section-header" onclick="toggleAdmin('notif')">🔔 Notificaciones (${STATE.notifications.length}) <span id="arrow-notif">▼</span></div>
      <div class="admin-list" id="admin-notif" style="display:none">
        ${STATE.notifications.length === 0 ? '<div style="padding:12px;font-size:12px;color:var(--text3)">Sin notificaciones</div>' :
          STATE.notifications.map(n => `
            <div class="admin-list-item" style="flex-direction:column;align-items:flex-start;gap:4px">
              <div style="font-size:12px">${n.message}</div>
              <div style="font-size:10px;color:var(--text3)">${timeAgo(n.created_at)}</div>
            </div>
          `).join('')}
        <button class="btn btn-ghost" style="width:100%;margin-top:8px;color:var(--danger);font-size:12px" onclick="STATE.notifications=[];saveState();renderAdmin();toast('Notificaciones borradas')">Borrar todas</button>
      </div>
    </div>

    <!-- SYNC -->
    <div class="admin-section">
      <div class="admin-section-header" onclick="toggleAdmin('sync')">☁️ HeyValue Sync <span id="arrow-sync">▼</span></div>
      <div class="admin-list" id="admin-sync" style="display:none">
        <div style="padding:12px;font-size:12px">
          <div>Estado: <b>${STATE.syncStatus}</b></div>
          <div style="margin-top:8px">Usuario: <b>${HV.user || 'No configurado'}</b></div>
          <button class="btn btn-primary" style="margin-top:10px;width:100%" onclick="syncToCloud();toast('Sincronizando...')">Forzar sincronizacion</button>
          <button class="btn btn-secondary" style="margin-top:6px;width:100%" onclick="showHVSetup()">Configurar HeyValue</button>
        </div>
      </div>
    </div>

    <!-- DANGER -->
    <div style="margin-top:24px;padding:16px;border:1px solid var(--danger);border-radius:var(--radius)">
      <div style="font-size:13px;font-weight:700;color:var(--danger);margin-bottom:8px">Zona de peligro</div>
      <button class="btn btn-ghost" style="width:100%;color:var(--danger);border:1px solid var(--danger);margin-bottom:8px" onclick="if(confirm('Resetear TODOS los datos?')){localStorage.clear();location.reload()}">Resetear todos los datos</button>
    </div>
  `;
}

function toggleAdmin(section) {
  const el = document.getElementById('admin-' + section);
  if (!el) return;
  const isHidden = el.style.display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  const arrow = document.getElementById('arrow-' + section);
  if (arrow) arrow.textContent = isHidden ? '▲' : '▼';
}

function editEvent(id) {
  const ev = STATE.events.find(x => x.id === id);
  if (!ev) return;
  openModal('Editar Evento', `
    <input class="input" id="ev-title" value="${ev.title}" placeholder="Titulo">
    <input class="input" id="ev-desc" value="${ev.description}" placeholder="Descripcion">
    <input class="input" id="ev-date" type="date" value="${ev.date}" class="input">
    <input class="input" id="ev-time" type="time" value="${ev.time}" class="input">
    <input class="input" id="ev-location" value="${ev.location}" placeholder="Ubicacion">
    <select class="input" id="ev-diff">
      <option value="facil" ${ev.difficulty==='facil'?'selected':''}>Facil</option>
      <option value="intermedia" ${ev.difficulty==='intermedia'?'selected':''}>Intermedia</option>
      <option value="alta" ${ev.difficulty==='alta'?'selected':''}>Alta</option>
    </select>
    <select class="input" id="ev-status">
      <option value="activo" ${ev.status==='activo'?'selected':''}>Activo</option>
      <option value="cancelado" ${ev.status==='cancelado'?'selected':''}>Cancelado</option>
      <option value="completado" ${ev.status==='completado'?'selected':''}>Completado</option>
    </select>
    <button class="btn btn-primary" style="width:100%" onclick="doEditEvent(${id})">Guardar</button>
  `);
}

function doEditEvent(id) {
  const ev = STATE.events.find(x => x.id === id);
  if (!ev) return;
  ev.title = document.getElementById('ev-title').value.trim() || ev.title;
  ev.description = document.getElementById('ev-desc').value.trim();
  ev.date = document.getElementById('ev-date').value || ev.date;
  ev.time = document.getElementById('ev-time').value || ev.time;
  ev.location = document.getElementById('ev-location').value.trim();
  ev.difficulty = document.getElementById('ev-diff').value;
  ev.status = document.getElementById('ev-status').value;
  saveState();
  closeModal();
  navigate('admin');
  toast('Evento actualizado');
}

// ============================================================
// NOTIFICATIONS
// ============================================================
function showNotifications() {
  const myNotifs = STATE.notifications.filter(n => n.user_id === STATE.user?.id).reverse().slice(0,20);
  const unread = myNotifs.filter(n => !n.read).length;
  openModal(`Notificaciones ${unread > 0 ? `(${unread} nuevas)` : ''}`, `
    ${myNotifs.length === 0 ? '<div style="text-align:center;padding:24px;color:var(--text3)">No hay notificaciones</div>' :
      myNotifs.map(n => `
        <div style="padding:10px 0;border-bottom:1px solid var(--border);${!n.read ? 'background:rgba(255,68,68,0.05);padding:10px;border-radius:8px;margin-bottom:4px' : ''}">
          <div style="font-size:13px">${n.message}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${timeAgo(n.created_at)}</div>
        </div>
      `).join('')}
    <button class="btn btn-ghost" style="width:100%;margin-top:8px;font-size:12px" onclick="STATE.notifications=STATE.notifications.map(n=>({...n,read:true}));saveState();closeModal();toast('Notificaciones marcadas como leidas')">Marcar todas como leidas</button>
  `);
  STATE.notifications = STATE.notifications.map(n => ({...n, read: true}));
  saveState();
}

// ============================================================
// MODAL
// ============================================================
function openModal(title, content) {
  document.getElementById('modal-content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:16px;font-weight:700">${title}</div>
      <button class="btn btn-ghost" style="padding:4px 8px;font-size:16px" onclick="closeModal()">✕</button>
    </div>
    ${content}
  `;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', initApp);

</script>
</html>
