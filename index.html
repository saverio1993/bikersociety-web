<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Biker Society</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ===== MODERNIZED BIKER SOCIETY v2.0 ===== */
/* Dark Racing Pro — Negro profundo + Rojo animado */

:root{
  --bg:#000000;
  --surface:#0a0a0a;
  --surface2:#111111;
  --surface3:#1a1a1a;
  --border:#2a0000;
  --border2:#3a0000;
  --accent:#ff2020;
  --accent2:#ff6600;
  --accent3:#ff0033;
  --glow:rgba(255,32,32,0.6);
  --glow2:rgba(255,102,0,0.5);
  --text:#ffffff;
  --text2:#aaaaaa;
  --text3:#666666;
  --success:#00ff44;
  --danger:#ff0000;
  --warning:#ffaa00;
  --radius:12px;
  --radius-sm:8px;
  --transition:0.2s cubic-bezier(0.4,0,0.2,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}
a{color:inherit;text-decoration:none}

/* ANIMATED BACKGROUND */
.bg-gradient{
  position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:var(--bg);
}
.bg-gradient::before{
  content:'';position:absolute;
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(255,32,32,0.12) 0%,transparent 70%);
  top:-200px;right:-200px;
  animation:bgFloat 12s ease-in-out infinite;
}
.bg-gradient::after{
  content:'';position:absolute;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(255,102,0,0.08) 0%,transparent 70%);
  bottom:-150px;left:-150px;
  animation:bgFloat 18s ease-in-out infinite reverse;
}
@keyframes bgFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-20px) scale(1.05)}
  66%{transform:translate(-20px,20px) scale(0.95)}
}

/* PAGE CONTAINER */
.page{display:none;height:100%;overflow-y:auto;overflow-x:hidden;padding:60px 16px 80px}
.page.active{display:block}

/* VANISH ANIMATIONS */
.vanish{opacity:0;transform:translateY(16px);animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) forwards}
.fadein{animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) forwards}
@keyframes fadeUp{
  to{opacity:1;transform:translateY(0)}
}

/* STAGGERED CARD ENTRANCE */
.card,.post-card,.event-card,.rider-card,.challenge-card,.rank-item{
  opacity:0;transform:translateY(20px);
  animation:cardIn 0.5s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes cardIn{
  to{opacity:1;transform:translateY(0)}
}

/* ===== TOPBAR ===== */
.topbar{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:rgba(6,6,6,0.92);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid rgba(0,212,255,0.15);
  box-shadow:0 0 30px rgba(0,212,255,0.05);
}
.topbar-logo{
  display:flex;align-items:center;gap:10px;
  cursor:pointer;
}
@keyframes gradientShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.topbar-logo img{width:36px;height:36px;border-radius:8px;object-fit:cover;box-shadow:0 0 10px rgba(255,32,32,0.4)}
.topbar-actions{display:flex;gap:8px}
.topbar-actions button{
  width:38px;height:38px;border-radius:50%;
  background:var(--surface2);
  color:var(--text);
  font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
  border:1px solid transparent;
}
.topbar-actions button:hover{
  background:var(--surface3);
  border-color:var(--accent);
  box-shadow:0 0 16px var(--glow);
}

/* ===== FLOATING MORE PANEL ===== */
.fpanel-overlay{
  position:fixed;inset:0;z-index:2000;
  background:rgba(0,0,0,0);pointer-events:none;
  transition:background 0.3s;
}
.fpanel-overlay.open{
  background:rgba(0,0,0,0.6);pointer-events:auto;
  backdrop-filter:blur(4px);
}
.fpanel{
  position:fixed;top:0;right:0;bottom:0;
  width:min(320px,88vw);
  background:rgba(8,8,12,0.98);
  border-left:1px solid rgba(0,212,255,0.2);
  z-index:2001;
  transform:translateX(100%);
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
  display:flex;flex-direction:column;
  box-shadow:-8px 0 40px rgba(0,212,255,0.15);
  overflow:hidden;
}
.fpanel.open{transform:translateX(0)}

.fpanel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 16px;
  border-bottom:1px solid rgba(0,212,255,0.1);
  background:linear-gradient(180deg,rgba(0,212,255,0.08),transparent);
}
.fpanel-header-title{
  font-size:17px;font-weight:800;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.fpanel-close{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:all 0.2s;flex-shrink:0;
}
.fpanel-close:hover{background:rgba(255,68,68,0.2);border-color:rgba(255,68,68,0.4);color:#ff4444}

.fpanel-body{flex:1;overflow-y:auto;padding:12px 16px 100px;overscroll-behavior:contain}
.fpanel-body::-webkit-scrollbar{width:4px}
.fpanel-body::-webkit-scrollbar-track{background:transparent}
.fpanel-body::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);border-radius:2px}

.fpanel-section{margin-bottom:8px}
.fpanel-section-label{
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(0,212,255,0.5);padding:8px 8px 4px;margin-top:4px;
}

.fpanel-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 10px;border-radius:12px;
  cursor:pointer;transition:all 0.2s;
  color:var(--text2);font-size:14px;font-weight:500;
  border:none;background:none;width:100%;text-align:left;
}
.fpanel-item:hover{background:rgba(0,212,255,0.08);color:var(--accent)}
.fpanel-item:active{transform:scale(0.98)}
.fpanel-item-icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);
  transition:all 0.2s;
}
.fpanel-item:hover .fpanel-item-icon{
  background:rgba(0,212,255,0.15);
  border-color:rgba(0,212,255,0.3);
  box-shadow:0 0 12px rgba(0,212,255,0.2);
}
.fpanel-item-text{flex:1;min-width:0}
.fpanel-item-label{font-size:14px;font-weight:600;display:block}
.fpanel-item-sub{font-size:11px;color:var(--text3);display:block;margin-top:1px}
.fpanel-item-arrow{font-size:12px;color:var(--text3);margin-left:auto}

.fpanel-divider{height:1px;background:rgba(255,255,255,0.06);margin:8px 0}

/* Submenu in panel */
.fpanel-submenu{
  margin:4px 0 8px;
  background:rgba(0,0,0,0.3);
  border:1px solid rgba(0,212,255,0.08);
  border-radius:14px;
  overflow:hidden;
  padding:6px;
}
.fpanel-subitem{
  display:flex;align-items:center;gap:10px;
  padding:10px 8px;border-radius:10px;
  cursor:pointer;transition:all 0.2s;
  color:var(--text2);font-size:13px;font-weight:500;
  border:none;background:none;width:100%;text-align:left;
}
.fpanel-subitem:hover{background:rgba(255,32,32,0.12);color:#ff2020}
.fpanel-subitem-icon{font-size:16px;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);flex-shrink:0}

/* Danger item */
.fpanel-item.danger:hover{background:rgba(255,68,68,0.08);color:#ff4444}
.fpanel-item.danger .fpanel-item-icon{background:rgba(255,68,68,0.1)}

/* ===== BOTTOM NAV ===== */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;
  height:72px;
  background:rgba(6,6,6,0.95);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  z-index:1000;
  display:flex;
  border-top:1px solid rgba(0,212,255,0.15);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 30px rgba(0,212,255,0.1);
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;color:var(--text3);font-size:10px;font-weight:600;
  transition:var(--transition);
  cursor:pointer;padding:8px 0;
  border:none;background:none;
  position:relative;
}
.bnav-item::before{
  content:'';position:absolute;
  top:0;left:50%;transform:translateX(-50%);
  width:32px;height:3px;
  background:linear-gradient(90deg,#ff2020,#ff6600);
  border-radius:0 0 3px 3px;
  opacity:0;transition:var(--transition);
}
.bnav-item.active{color:var(--accent)}
.bnav-item.active::before{opacity:1;box-shadow:0 0 12px var(--glow)}
.bnav-item:active{transform:scale(0.95)}
.bnav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:var(--transition)}
.bnav-item.active svg{filter:drop-shadow(0 0 8px var(--glow))}
.bnav-item img{transition:var(--transition);filter:brightness(0.6) drop-shadow(0 0 0px transparent)}
.bnav-item.active img{filter:brightness(1.3) drop-shadow(0 0 10px var(--glow));transform:scale(1.1)}
.bnav-item span{display:block}

/* ===== CARDS ===== */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;
  inset:0;opacity:0;
  background:linear-gradient(135deg,rgba(0,212,255,0.05),rgba(168,85,247,0.03));
  transition:var(--transition);
}
.card:hover{
  border-color:rgba(255,32,32,0.6);
  box-shadow:0 4px 24px rgba(255,32,32,0.2),0 0 0 1px rgba(255,32,32,0.15) inset;
  transform:translateY(-2px);
}
.card:hover::before{opacity:1}
.card-title{font-weight:700;font-size:15px;margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text2)}

/* ===== BADGES ===== */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
  background:var(--surface2);border:1px solid var(--border);
  transition:var(--transition);
}
.badge-gold{
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#000;border:none;
  box-shadow:0 0 12px rgba(251,191,36,0.3);
}
.badge-red{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border:none;
  box-shadow:0 0 12px var(--glow);
}
.badge-green{
  background:linear-gradient(135deg,#00e676,#00c853);
  color:#000;border:none;
  box-shadow:0 0 12px rgba(0,230,118,0.3);
}
.badge-blue{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border:none;
  box-shadow:0 0 12px var(--glow);
}

/* ===== MAP ===== */
.map-container{position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
#map{height:350px;width:100%;background:var(--surface2)}
.map-label{
  position:absolute;top:12px;left:12px;z-index:500;
  background:rgba(6,6,6,0.9);
  backdrop-filter:blur(12px);
  padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;
  color:var(--text);border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,0.5);
}

/* ===== POI MARKERS ===== */
.poi-pill{
  background:var(--accent);color:#050810;
  padding:7px 16px;border-radius:20px;font-size:12px;font-weight:800;
  white-space:nowrap;
  box-shadow:0 4px 20px var(--glow),0 0 40px rgba(0,212,255,0.2);
  animation:poiPulse 2s ease-in-out infinite;
  position:relative;
}
.poi-pill::before{
  content:'';position:absolute;inset:-4px;
  border-radius:inherit;
  border:2px solid var(--accent);
  animation:poiRing 2s ease-in-out infinite;
}
@keyframes poiPulse{
  0%,100%{transform:scale(1);box-shadow:0 4px 20px var(--glow)}
  50%{transform:scale(1.05);box-shadow:0 6px 30px var(--glow2)}
}
@keyframes poiRing{
  0%{transform:scale(1);opacity:0.8}
  100%{transform:scale(1.8);opacity:0}
}

/* ===== ROUTE ANIMATION ===== */
.route-animated{
  stroke-dasharray:20,12;
  stroke-dashoffset:0;
  animation:dash 1.5s linear infinite;
}
@keyframes dash{to{stroke-dashoffset:-32}}

/* ===== LIKES HEART ===== */
.like-btn{
  background:none;border:none;color:var(--text3);font-size:18px;
  transition:0.2s;cursor:pointer;display:flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:20px;
}
.like-btn:hover{color:var(--danger);background:rgba(255,59,59,0.1)}
.like-btn.liked{
  color:var(--danger);
  animation:heartBeat 0.4s ease;
  filter:drop-shadow(0 0 8px var(--glow));
}
@keyframes heartBeat{
  0%{transform:scale(1)}
  25%{transform:scale(1.3)}
  50%{transform:scale(1)}
  75%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

/* ===== INPUTS ===== */
.input{
  width:100%;padding:13px 16px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);font-size:14px;
  transition:var(--transition);
  margin-bottom:12px;
}
.input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,59,59,0.15),0 0 20px rgba(255,59,59,0.1);
  background:var(--surface3);
}
.input::placeholder{color:var(--text3)}

/* ===== BUTTONS ===== */
.btn{
  padding:13px 26px;border-radius:var(--radius-sm);
  font-weight:700;font-size:14px;
  transition:var(--transition);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  position:relative;overflow:hidden;
}
.btn-primary{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;
  box-shadow:0 4px 16px var(--glow);
}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent);
  opacity:0;transition:var(--transition);
}
.btn-primary:hover::before{opacity:1}
.btn-primary:hover{
  box-shadow:0 6px 24px var(--glow2),0 0 40px rgba(255,59,59,0.2);
  transform:translateY(-1px);
}
.btn-primary:active{transform:scale(0.97) translateY(0)}
.btn-secondary{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover{
  border-color:var(--accent);
  background:var(--surface3);
  box-shadow:0 0 12px rgba(255,59,59,0.1);
}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{color:var(--text);background:var(--surface2)}

/* ===== MODAL ===== */
.modal{
  position:fixed;inset:0;z-index:2000;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(12px);
  animation:modalFadeIn 0.2s ease;
}
@keyframes modalFadeIn{from{opacity:0}}
.modal.open{display:flex}
.modal-content{
  max-width:440px;width:calc(100% - 32px);
  max-height:90vh;overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  animation:modalSlideIn 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 24px 80px rgba(0,0,0,0.8),0 0 60px rgba(255,59,59,0.1);
}
@keyframes modalSlideIn{from{transform:translateY(20px);opacity:0}}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;background:linear-gradient(135deg,#ff2020,#ff6600);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* ===== POST CARD ===== */
.post-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
  transition:var(--transition);
}
.post-card:hover{
  border-color:rgba(255,59,59,0.3);
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.racing-card:hover{
  border-color:rgba(255,68,68,0.2);
  box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 0 1px rgba(255,68,68,0.08);
  transform:translateY(-1px);
  transition:all 0.3s;
}
@keyframes audioPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}
.post-header{padding:12px 16px;display:flex;align-items:center;gap:10px}
.post-avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:#fff;flex-shrink:0;
  box-shadow:0 0 16px var(--glow);
}
.post-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.post-name{font-weight:700;font-size:14px}
.post-time{font-size:11px;color:var(--text2)}
.post-content{padding:0 16px 12px;font-size:14px;line-height:1.5}
.post-image{width:100%;max-height:400px;object-fit:cover;display:block}
.post-actions{padding:8px 16px;display:flex;gap:16px;border-top:1px solid var(--border)}

/* ===== EVENT CARD ===== */
.event-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:16px;
  transition:var(--transition);
}
.event-card:hover{
  border-color:rgba(255,59,59,0.4);
  box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 20px rgba(255,59,59,0.1);
  transform:translateY(-2px);
}
.event-img{width:100%;height:160px;object-fit:cover}
.event-body{padding:16px}
.event-date{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px}
.event-title{font-size:16px;font-weight:800;margin:6px 0 10px}
.event-meta{display:flex;gap:16px;font-size:12px;color:var(--text2)}

/* ===== RIDER CARD ===== */
.rider-card{
  display:flex;align-items:center;gap:12px;
  padding:14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:8px;
  cursor:pointer;
  transition:var(--transition);
}
.rider-card:hover{
  border-color:var(--accent);
  box-shadow:0 0 16px rgba(255,59,59,0.15);
  transform:translateX(4px);
}
.rider-avatar{
  width:50px;height:50px;border-radius:50%;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;color:#fff;flex-shrink:0;
  box-shadow:0 0 20px var(--glow);
  position:relative;
}
.rider-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.rider-avatar::after{
  content:'';position:absolute;inset:-2px;
  border-radius:50%;
  border:2px solid transparent;
  background:linear-gradient(135deg,#ff3b3b,#ff6b35) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite: destination-out;
  mask-composite:exclude;
  animation:avatarRing 3s linear infinite;
}
@keyframes avatarRing{to{transform:rotate(360deg)}}
.rider-info{flex:1;min-width:0}
.rider-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.rider-bike{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rider-points{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--accent)}

/* ===== POINTS BAR ===== */
.points-bar{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;
}
.points-level{flex:1}
.points-label{font-size:11px;color:var(--text2);margin-bottom:6px}
.points-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.points-fill{
  height:100%;
  background:linear-gradient(90deg,#00d4ff,#a855f7,#00e676);
  background-size:200% 100%;
  border-radius:3px;
  transition:width 1.5s cubic-bezier(0.4,0,0.2,1);
  animation:pointsShimmer 3s ease infinite;
}
@keyframes pointsShimmer{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.points-value{font-weight:900;font-size:18px;color:var(--accent);text-shadow:0 0 16px var(--glow)}

/* ===== CHALLENGE CARD ===== */
.challenge-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:10px;
  position:relative;overflow:hidden;
  transition:var(--transition);
}
.challenge-card::before{
  content:'';position:absolute;top:0;left:0;
  width:4px;height:100%;
  background:linear-gradient(180deg,#00d4ff,#a855f7,#00e676);
}
.challenge-card:hover{
  border-color:rgba(255,59,59,0.3);
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.challenge-title{font-weight:800;font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.challenge-desc{font-size:12px;color:var(--text2);margin-bottom:12px}
.challenge-progress{display:flex;align-items:center;gap:10px}
.challenge-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.challenge-fill{
  height:100%;
  background:linear-gradient(90deg,#00d4ff,#a855f7);
  border-radius:3px;
  transition:width 0.6s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 0 8px var(--glow);
}
.challenge-points{font-size:12px;font-weight:800;color:var(--accent)}

/* ===== BADGE DISPLAY ===== */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 10px;
  text-align:center;
  transition:var(--transition);
}
.badge-item.earned{
  border-color:var(--accent);
  background:linear-gradient(135deg,rgba(255,59,59,0.1),rgba(255,107,53,0.05));
  box-shadow:0 0 20px rgba(255,59,59,0.1);
  animation:badgeEarned 0.5s ease;
}
@keyframes badgeEarned{
  0%{transform:scale(0.8);opacity:0}
  50%{transform:scale(1.1)}
  100%{transform:scale(1);opacity:1}
}
@keyframes audioPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,68,68,0.4)}50%{transform:scale(1.05);box-shadow:0 0 0 10px rgba(255,68,68,0)}}
@keyframes mediaFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes likeBurst{0%{transform:scale(1)}30%{transform:scale(1.08)}60%{transform:scale(0.96)}100%{transform:scale(1)}}
@keyframes heartFloat{
  0%{opacity:1;transform:scale(0.5) translateY(0)}
  20%{opacity:1;transform:scale(1.2) translateY(-20px)}
  100%{opacity:0;transform:scale(1) translateY(-160px) rotate(20deg)}
}
.like-burst{animation:likeBurst 0.5s ease-out}
.badge-icon{font-size:32px;margin-bottom:8px}
.badge-name{font-size:11px;font-weight:700;line-height:1.3}

/* ===== RANKING ===== */
.rank-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:6px;
  transition:var(--transition);
}
.rank-item:hover{
  border-color:rgba(255,59,59,0.3);
  transform:translateX(4px);
}

/* ===== NEWS ===== */
.news-card{
  background:linear-gradient(135deg,rgba(255,59,59,0.08),rgba(255,107,53,0.05));
  border:1px solid rgba(255,68,68,0.25);
  border-radius:var(--radius);
  cursor:pointer;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  display:flex;
  gap:12px;
  padding:12px;
  text-decoration:none;
  color:inherit;
  align-items:flex-start;
  position:relative;
  overflow:hidden;
}
.news-card::before{
  content:'';
  position:absolute;
  top:0;left:0;
  width:3px;
  height:100%;
  background:linear-gradient(180deg,#ff4444,#ff8800,#ffaa00);
  border-radius:3px 0 0 3px;
}
.news-card::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,59,59,0.06),rgba(255,107,53,0.04));
  opacity:0;
  transition:opacity 0.3s;
  pointer-events:none;
}
.news-card:hover{
  border-color:rgba(255,68,68,0.5);
  transform:translateY(-3px) scale(1.01);
  box-shadow:0 8px 32px rgba(255,59,59,0.25),0 0 20px rgba(255,107,53,0.15);
}
.news-card:hover::after{opacity:1}
.news-card-img{
  width:70px;
  height:56px;
  object-fit:cover;
  border-radius:8px;
  flex-shrink:0;
  display:block;
  border:1px solid rgba(255,255,255,0.1);
  transition:transform 0.3s, box-shadow 0.3s;
}
.news-card:hover .news-card-img{
  transform:scale(1.05);
  box-shadow:0 4px 16px rgba(255,59,59,0.3);
}
.news-card-body{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.news-card-title{
  font-size:13px;
  font-weight:700;
  color:var(--text);
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  transition:color 0.2s;
}
.news-card:hover .news-card-title{color:#fff}
.news-card-desc{
  font-size:12px;
  color:var(--text2);
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.news-card-meta{
  font-size:11px;
  color:var(--text2);
  margin-top:auto;
  display:flex;
  align-items:center;
  gap:6px;
}
.news-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 8px;
  border-radius:20px;
  font-size:9px;
  font-weight:700;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;
  box-shadow:0 0 8px rgba(255,59,59,0.3);
  animation:pulseBadge 2s ease-in-out infinite;
}
@keyframes pulseBadge{
  0%,100%{box-shadow:0 0 8px rgba(255,59,59,0.3)}
  50%{box-shadow:0 0 16px rgba(255,59,59,0.5)}
}
.news-loading,.news-error{
  text-align:center;
  padding:20px;
  font-size:13px;
  color:var(--text2);
}
.news-section .news-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.rank-num{
  width:30px;height:30px;border-radius:50%;
  background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;color:var(--text2);
}
.rank-num.gold{
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#000;
  box-shadow:0 0 16px rgba(251,191,36,0.4);
}
.rank-num.silver{
  background:linear-gradient(135deg,#e5e7eb,#9ca3af);
  color:#000;
  box-shadow:0 0 12px rgba(229,231,235,0.3);
}
.rank-num.bronze{
  background:linear-gradient(135deg,#b45309,#92400e);
  color:#fff;
  box-shadow:0 0 12px rgba(180,83,9,0.3);
}

/* ===== CHAT ===== */
.chat-message{margin-bottom:10px;display:flex;gap:8px;animation:msgIn 0.3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}}
.chat-message.mine{flex-direction:row-reverse}
.chat-bubble{
  max-width:75%;padding:10px 14px;
  border-radius:18px;font-size:13px;line-height:1.4;
  word-break:break-word;
}
.chat-message:not(.mine) .chat-bubble{
  background:var(--surface2);
  border-bottom-left-radius:4px;
}
.chat-message.mine .chat-bubble{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border-bottom-right-radius:4px;
  box-shadow:0 4px 16px var(--glow);
}
.chat-input-bar{
  position:fixed;bottom:72px;left:0;right:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:10px 12px;
  display:flex;gap:10px;align-items:center;
}
.chat-input-bar input{
  flex:1;padding:10px 16px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);font-size:13px;
  transition:var(--transition);
}
.chat-input-bar input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,59,59,0.1);
}
.chat-input-bar button{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border:none;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px var(--glow);
  transition:var(--transition);
}
.chat-input-bar button:hover{
  transform:scale(1.05);
  box-shadow:0 6px 24px var(--glow2);
}
.chat-input-bar button:active{transform:scale(0.95)}

/* ===== SPLASH ===== */
.splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
}
.splash-logo{
  width:90px;height:90px;border-radius:50%;
  animation:splashPulse 1.8s ease-in-out infinite;
  box-shadow:0 0 60px rgba(255,32,32,0.4),0 0 100px rgba(255,59,59,0.2);
}
@keyframes splashPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 60px var(--glow)}
  50%{transform:scale(1.08);box-shadow:0 0 80px var(--glow2)}
}
.splash-text{
  font-size:22px;font-weight:900;
  background:linear-gradient(135deg,#ff2020,#ff6600,#ff0033);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradientShift 3s ease infinite;
}
.splash-bar{
  width:140px;height:4px;
  background:var(--surface2);
  border-radius:2px;overflow:hidden;
}
.splash-bar::after{
  content:'';display:block;
  width:50%;height:100%;
  background:linear-gradient(90deg,#00d4ff,#a855f7,#00e676);
  background-size:200% 100%;
  border-radius:2px;
  animation:loadingBar 1.5s ease-in-out infinite;
}
@keyframes loadingBar{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(300%)}
}

/* ===== ADMIN PANEL ===== */
.admin-section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:16px;overflow:hidden;
}
.admin-section-header{
  padding:14px 16px;
  font-weight:700;font-size:14px;
  background:var(--surface2);
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;
  transition:var(--transition);
}
.admin-section-header:hover{color:var(--accent)}
.admin-list{padding:8px}
.admin-list-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 8px;border-radius:8px;
  transition:var(--transition);
}
.admin-list-item:hover{background:var(--surface2)}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* ===== TAB BAR ===== */
.tab-bar{
  display:flex;gap:4px;margin-bottom:16px;
  background:var(--surface);
  padding:4px;border-radius:var(--radius);
  border:1px solid var(--border);
}
.tab{
  flex:1;padding:9px;text-align:center;font-size:12px;font-weight:700;
  border-radius:var(--radius-sm);color:var(--text2);
  cursor:pointer;transition:var(--transition);
  border:none;background:none;
}
.tab.active{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;
  box-shadow:0 2px 12px var(--glow);
}

/* ===== STAT ROW ===== */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;text-align:center;
  transition:var(--transition);
}
.stat-box:hover{
  border-color:rgba(255,59,59,0.3);
  box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
.stat-val{
  font-size:24px;font-weight:900;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradientShift 4s ease infinite;
}
.stat-lbl{font-size:10px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:60px 24px;color:var(--text2)}
.empty-icon{font-size:56px;margin-bottom:14px;opacity:0.25}
.empty-title{font-size:16px;font-weight:700;color:var(--text2);margin-bottom:6px}

/* ===== LOGIN ===== */
.login-page{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
}
.login-logo{
  width:90px;height:90px;border-radius:16px;
  object-fit:cover;
  margin-bottom:20px;
  box-shadow:0 0 30px rgba(255,32,32,0.4);
}
.login-title{font-size:24px;font-weight:900;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:32px}
.login-form{width:100%;max-width:380px}

/* ===== ROUTE CREATOR ===== */
.route-stop{display:flex;align-items:center;gap:10px;padding:8px 0}
.stop-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);flex-shrink:0;transition:var(--transition)}
.stop-dot.start{border-color:var(--success);background:var(--success);box-shadow:0 0 10px rgba(0,230,118,0.4)}
.stop-dot.end{border-color:var(--danger);background:var(--danger);box-shadow:0 0 10px var(--glow)}
.stop-input{
  flex:1;padding:10px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:13px;
  transition:var(--transition);
}
.stop-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,59,59,0.1);
}

/* ===== PAGE TABS ===== */
.page-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.page-tab{
  padding:8px 16px;border-radius:20px;
  font-size:12px;font-weight:700;
  white-space:nowrap;
  border:1px solid var(--border);
  background:var(--surface);color:var(--text2);
  cursor:pointer;transition:var(--transition);
}
.page-tab.active{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border-color:transparent;
  box-shadow:0 2px 12px var(--glow);
}

/* ===== NOTIFICATION TOAST ===== */
.toast{
  position:fixed;bottom:88px;left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px 24px;font-size:13px;font-weight:600;
  z-index:3000;opacity:0;transition:0.4s cubic-bezier(0.4,0,0.2,1);
  pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}
.toast.warning{border-color:var(--warning);color:var(--warning)}

/* ===== FLOATING ACTION ===== */
.fab{
  position:fixed;bottom:88px;right:16px;
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border:none;
  font-size:24px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px var(--glow);
  transition:var(--transition);
  z-index:900;
}
.fab:hover{
  transform:scale(1.1);
  box-shadow:0 8px 32px var(--glow2);
}
.fab:active{transform:scale(0.95)}

/* ===== PROGRESS CIRCULAR ===== */
.progress-ring{
  transform:rotate(-90deg);
}
.progress-ring-circle{
  transition:stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1);
  stroke-linecap:round;
}

/* ===== SHIMMER LOADING ===== */
.shimmer{
  background:linear-gradient(90deg,
    var(--surface) 0%,
    var(--surface2) 50%,
    var(--surface) 100%);
  background-size:200% 100%;
  animation:shimmer 1.5s ease infinite;
}
@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

/* ===== GLOW TEXT ===== */
.glow-text{
  text-shadow:0 0 20px var(--glow),0 0 40px rgba(255,59,59,0.2);
}

/* ===== PULSE DOT ===== */
.pulse-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px var(--glow);
  animation:pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.5);opacity:0.5}
}

/* ===== RESPONSIVE ===== */
@media(max-width:380px){
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .badge-grid{grid-template-columns:repeat(2,1fr)}
}

</style>
</head>

// Get badge image (metal-bronze medal from /badges.js)
// Locked = B&W, desaturated, no glow
// Earned = full color with glow effect
function getBadgeSvg(badge, earned) {
  const img = BADGE_IMAGES[badge.id];
  if (!img) return '';
  if (earned) {
    const [c1, c2] = (badge.svgGradient||'#ff4444|#ff8800').split('|');
    return `<div style="
      width:64px;height:64px;display:flex;align-items:center;justify-content:center;
      border-radius:50%;
      background:radial-gradient(circle, ${c1}33 0%, transparent 70%);
      box-shadow:0 0 12px ${c1}aa, 0 0 4px ${c2}aa, inset 0 0 6px rgba(255,255,255,0.1);
      animation:badgeEarned 0.5s ease-out;
    "><img src="${img.color}" style="width:56px;height:56px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4))" alt="${badge.name}"></div>`;
  } else {
    return `<div style="
      width:64px;height:64px;display:flex;align-items:center;justify-content:center;
      border-radius:50%;
      background:radial-gradient(circle, #1a1a1a 0%, transparent 70%);
      opacity:0.45;
    "><img src="${img.bw}" style="width:56px;height:56px;display:block;filter:grayscale(100%) brightness(0.7);" alt="${badge.name}"></div>`;
  }
}

let _placeSearchTimeout = null;

// Promise-based: returns { local, online } directly — no callback needed
async function searchPlaces(query) {
  if (!query || query.length < 2) return { local: [], online: [] };
  const q = query.toLowerCase();

  // 1. Search local DB first (instant)
  const local = STATE.places.filter(p =>
    p.name.toLowerCase().includes(q) ||
    (p.address && p.address.toLowerCase().includes(q)) ||
    p.category.toLowerCase().includes(q)
  ).slice(0, 5);

  // 2. Nominatim API (online search)
  let online = [];
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Panama')}&limit=5&addressdetails=1`,
      { headers: { 'Accept-Language': 'es' } }
    );
    const data = await res.json();
    online = (data || []).map(item => ({

// ============================================================
// BADGE SYSTEM — stats-based evaluation
// ============================================================
function getUserStats(userId) {
  if (!userId) return {};
  if (STATE.userStats[userId]) return STATE.userStats[userId];

  const u = STATE.users.find(x => x.id === userId);
  const rides = STATE.attendance.filter(a => a.user_id === userId).length;
  const routes_created = STATE.routes.filter(r => r.created_by === userId).length;
  const photos = STATE.posts.filter(p => p.user_id === userId && p.image_url).length;
  const chat_messages = STATE.chatMessages.filter(m => m.user_id === userId).length;
  const posts = STATE.posts.filter(p => p.user_id === userId).length;
  const photos_total = photos + posts; // approximation
  const total_km = STATE.routes.filter(r => r.created_by === userId).reduce((acc, r) => {
    // Estimate km: Haversine distance start-end
    if (!r.start_lat || !r.end_lat) return acc;
    const R = 6371;
    const dLat = (r.end_lat - r.start_lat) * Math.PI / 180;
    const dLng = (r.end_lng - r.start_lng) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(r.start_lat*Math.PI/180)*Math.cos(r.end_lat*Math.PI/180)*Math.sin(dLng/2)**2;
    const c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    return acc + R * c;
  }, 0);

  // Streak: consecutive days with any activity
  const allDates = new Set();
  STATE.attendance.filter(a => a.user_id === userId).forEach(a => allDates.add(a.date));
  STATE.chatMessages.filter(m => m.user_id === userId).forEach(m => allDates.add(m.created_at ? m.created_at.split(' ')[0] : null));
  STATE.posts.filter(p => p.user_id === userId).forEach(p => allDates.add(p.created_at ? p.created_at.split(' ')[0] : null));
  allDates.delete(null);
  const sortedDates = [...allDates].sort();
  let streak = 0, streakCount = 0;
  const today = new Date().toISOString().split('T')[0];
  if (sortedDates.length > 0) {
    const lastDate = new Date(sortedDates[sortedDates.length - 1]);
    const diff = (new Date(today) - lastDate) / 86400000;
    if (diff <= 1) {
      streakCount = 1;
      for (let i = sortedDates.length - 2; i >= 0; i--) {
        const d = new Date(sortedDates[i]);
        const diff2 = (new Date(sortedDates[i+1]) - d) / 86400000;
        if (diff2 === 1) streakCount++;
        else break;
      }
      streak = streakCount;
    }
  }

  const joinDate = u?.created_at ? new Date(u.created_at) : new Date();
  const daysActive = Math.floor((new Date() - joinDate) / 86400000);

  const stats = {
    rides, routes_created, photos: photos_total, chat_messages,
    total_km: Math.round(total_km),
    days_active: daysActive,
    streak,
    events: rides,
    posts: STATE.posts.filter(p => p.user_id === userId).length,
    // New stats — track via user record (admin can set), default 0
    early_bird: u?.stats?.early_bird || 0,
    night_owl: u?.stats?.night_owl || 0,
    founding: u?.stats?.founding || 0,
    mentor: u?.stats?.mentor || 0,
  };
  STATE.userStats[userId] = stats;
  return stats;
}

// ============================================================
// WEEKLY WALL OF FAME
// ============================================================
function getWeekStart() {
  const now = new Date();
  const day = now.getDay(); // 0=Sun, 1=Mon, ...
  const diff = day === 0 ? 6 : day - 1; // Monday = start of week
  const mon = new Date(now);
  mon.setDate(now.getDate() - diff);
  mon.setHours(0,0,0,0);
  return mon;
}

function getWeeklyRankings() {
  const weekStart = getWeekStart();
  const weekStartStr = weekStart.toISOString().slice(0,10);

  // Accumulators: userId -> { km, likes, photos }
  const acc = {};

  // Posts likes received this week
  STATE.posts.forEach(p => {
    if (!p.created_at) return;
    const postDate = p.created_at.slice(0,10);
    if (postDate < weekStartStr) return;
    const likeCount = (p.likes || []).length;
    if (likeCount === 0) return;
    if (!acc[p.user_id]) acc[p.user_id] = { km:0, likes:0, photos:0 };
    acc[p.user_id].likes += likeCount;
  });

  // Posts with photos this week
  STATE.posts.forEach(p => {
    if (!p.created_at) return;
    const postDate = p.created_at.slice(0,10);
    if (postDate < weekStartStr) return;
    if (!p.image_url) return;
    if (!acc[p.user_id]) acc[p.user_id] = { km:0, likes:0, photos:0 };
    acc[p.user_id].photos++;
  });

  // Build rankings
  const kmRanking = Object.entries(acc)
    .map(([uid, data]) => ({ user_id: parseInt(uid), km: data.km }))
    .sort((a,b) => b.km - a.km);
  const likesRanking = Object.entries(acc)
    .map(([uid, data]) => ({ user_id: parseInt(uid), likes: data.likes }))
    .sort((a,b) => b.likes - a.likes);
  const photosRanking = Object.entries(acc)
    .map(([uid, data]) => ({ user_id: parseInt(uid), photos: data.photos }))
    .sort((a,b) => b.photos - a.photos);

  return {
    km: kmRanking[0] || null,
    likes: likesRanking[0] || null,
    photos: photosRanking[0] || null
  };
}

function evaluateUserBadges(userId) {
  if (!userId) return;
  const stats = getUserStats(userId);
  const newBadges = [];

  STATE.badges.forEach(badge => {
    const current = STATE.userBadges.find(ub => ub.user_id === userId && ub.badge_id === badge.id);
    let value = stats[badge.stat_type] || 0;

    if (badge.stat_type === 'admin_award') {
      value = STATE.users.find(u => u.id === userId)?.is_distinguished ? 1 : 0;
    }

    const earned = value >= badge.threshold;

    if (earned && !current) {
      STATE.userBadges.push({
        user_id: userId,
        badge_id: badge.id,
        earned_at: new Date().toISOString(),
        stat_value: value
      });
      newBadges.push(badge);
    } else if (earned && current) {
      // Update stat value
      current.stat_value = value;
    } else if (!earned && current) {
      // Remove if no longer qualifies
      STATE.userBadges = STATE.userBadges.filter(ub => !(ub.user_id === userId && ub.badge_id === badge.id));
    }
  });

  if (newBadges.length > 0) {
    const totalBonus = newBadges.reduce((acc, b) => acc + b.points_bonus, 0);
    const u = STATE.users.find(u => u.id === userId);
    if (u) {
      u.points = (u.points || 0) + totalBonus;
      saveState();
    }
    if (userId === STATE.user?.id) {
      toast(`🏅 +${newBadges.length} insignia(s)! +${totalBonus} pts`);
    }
  }
}

function evaluateAllBadges() {

}

function recalculateUserStats(userId) {

// Read a File object and return data URL via Promise
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// Read a Blob/File and return data URL via Promise
function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function dataURLtoBlob(dataUrl) {
  const [header, data] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bytes = atob(data);
  const buf = new ArrayBuffer(bytes.length);
  const arr = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([buf], { type: mime });
}

// Compress image to fit a max dimension (keeps localStorage manageable)
// Returns data URL or null if not an image
async function compressImage(file, maxDim = 800, quality = 0.82) {
  if (!file.type.startsWith('image/')) return null;
  const dataUrl = await fileToDataUrl(file);
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        const scale = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // Re-encode to JPEG to shrink further (unless PNG with transparency)
      const isPng = file.type === 'image/png';
      const out = canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', quality);
      resolve(out);
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts.includes(' ') ? ts.replace(' ','T') : ts);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'ahora';
  if (diff < 3600) return Math.floor(diff/60)+'m';
  if (diff < 86400) return Math.floor(diff/3600)+'h';
  return Math.floor(diff/86400)+'d';
}

function levelOf(points) {
  if (points >= 100000) return {name:'Maestro',min:100000,color:'#a855f7'};
  if (points >= 30000) return {name:'Leyenda',min:30000,color:'#f59e0b'};
  if (points >= 10000) return {name:'Avanzado',min:10000,color:'#3b82f6'};
  if (points >= 2000) return {name:'Intermedio',min:2000,color:'#22c55e'};
  return {name:'Novato',min:0,color:'#888'};
}

function nextLevel(points) {
  const lv = levelOf(points);
  const next = [2000,10000,30000,100000,Infinity].find(n => n > points) || Infinity;
  return next;
}

function levelProgress(points) {
  const lv = levelOf(points);
  const next = nextLevel(points);
  if (next === Infinity) return 100;
  return ((points - lv.min) / (next - lv.min)) * 100;
}

function initials(name) {
  return (name || '').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
}

function timeAgo(ts) {
  if (!ts) return '';
  const d = new Date(ts.replace(' ','T'));
  const now = new Date();
  const s = Math.floor((now - d) / 1000);
  if (s < 60) return 'hace ' + s + 's';
  if (s < 3600) return 'hace ' + Math.floor(s/60) + 'm';
  if (s < 86400) return 'hace ' + Math.floor(s/3600) + 'h';
  return 'hace ' + Math.floor(s/86400) + 'd';
}

// ============================================================
// HEYVALUE SYNC
// ============================================================
async function hvRequest(method, path, body) {
  if (!HV.user || !HV.pass) return null;
  const opts = {
    method,
    headers: { Authorization: 'Basic ' + btoa(HV.user + ':' + HV.pass) }
  };
  if (body && typeof body === 'string') {
    opts.headers['Content-Type'] = 'application/octet-stream';
  } else if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  try {
    const r = await fetch(HV.url + '/nc' + path, opts);
    if (r.status === 207) return {ok:true, data: await r.json()};
    if (r.status === 204 || r.status === 201) return {ok:true};
    const t = await r.text();
    return {ok:false, error: t.substring(0,200), status: r.status};
  } catch(e) { return {ok:false, error: e.message}; }
}

async function syncFromCloud() {
  if (!HV.user) return;
  const tables = ['users','routes','events','posts','badges','challenges','userChallenges','userBadges','chatChannels','chatMessages','notifications','attendance'];
  let loaded = false;
  for (const t of tables) {
    const data = await loadFromHV(t);
    if (data && Array.isArray(data)) { STATE[t] = data; loaded = true; }
  }
  if (loaded) {
    STATE.users = STATE.users.length ? STATE.users : [...SEED_USERS];
    STATE.badges = STATE.badges.length ? STATE.badges : [...SEED_BADGES];
    STATE.challenges = STATE.challenges.length ? STATE.challenges : [...SEED_CHALLENGES];
    STATE.events = STATE.events.length ? STATE.events : [...SEED_EVENTS];
    STATE.routes = STATE.routes.length ? STATE.routes : [...SEED_ROUTES];
    STATE.posts = STATE.posts.length ? STATE.posts : [...SEED_POSTS];
    STATE.chatChannels = STATE.chatChannels.length ? STATE.chatChannels : [...SEED_CHANNELS];
    STATE.chatMessages = STATE.chatMessages.length ? STATE.chatMessages : [...SEED_MESSAGES];
    STATE.userChallenges = STATE.userChallenges || [];
    STATE.userBadges = STATE.userBadges || [];
    STATE.notifications = STATE.notifications || [];
    STATE.attendance = STATE.attendance || [];
  }
}

function initApp() {
  try {
  // Load from localStorage first - USE SEED AS ABSOLUTE FALLBACK
  STATE.users = ls('bs_users') || [...SEED_USERS];
  STATE.routes = ls('bs_routes') || [...SEED_ROUTES];
  STATE.events = ls('bs_events') || [...SEED_EVENTS];
  STATE.posts = ls('bs_posts') || [...SEED_POSTS];
  STATE.badges = [...SEED_BADGES]; // Always use fresh badge definitions
  STATE.challenges = ls('bs_challenges') || [...SEED_CHALLENGES];
  STATE.userChallenges = ls('bs_uc') || [];
  STATE.userBadges = ls('bs_ub') || [];
  STATE.chatChannels = ls('bs_cc') || [...SEED_CHANNELS];
  STATE.chatMessages = ls('bs_cm') || [...SEED_MESSAGES];
  STATE.notifications = ls('bs_notif') || [];
  STATE.attendance = ls('bs_att') || [];
  STATE.user = ls('bs_session');
  loadPlaces();

  // ALWAYS show UI immediately - no waiting for HeyValue
  document.getElementById('splash').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('bottomnav').style.display = 'flex';

  if (STATE.user) {
    navigate('inicio');
  } else {
    showLogin();
  }
  } catch(err) {
    console.error('[BS] initApp crashed:', err);
    // Force show login as last resort
    try {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('topbar').style.display = 'flex';
      document.getElementById('bottomnav').style.display = 'flex';
      if (typeof showLogin === 'function') showLogin();
    } catch(_) {}
  }

  // Auto-connect HeyValue in background — non-blocking
  autoConnectHeyValue();

  // Evaluate badges for all users on load
  evaluateAllBadges();
}

async function autoConnectHeyValue() {
  if (!HV.user || !HV.pass) return;
  try {
    // Ensure Gram folders exist
    await hvRequest('MKCOL', '/' + HV.gramFolder);
    await hvRequest('MKCOL', '/' + HV.gramFolder + '/photos');
    await hvRequest('MKCOL', '/' + HV.gramFolder + '/videos');
    await hvRequest('MKCOL', '/' + HV.gramFolder + '/audio');
    // Ensure profile photos folder
    await hvRequest('MKCOL', '/BikerApp');
    await hvRequest('MKCOL', '/BikerApp/profiles');
    HV.connected = true;
    // Sync data from cloud
    await syncFromCloud();
    saveState();
  } catch(e) {
    console.warn('HeyValue auto-connect failed:', e.message);
  }
}

function saveState() {
  ls('bs_users', STATE.users);
  ls('bs_routes', STATE.routes);
  ls('bs_events', STATE.events);
  ls('bs_posts', STATE.posts);
  ls('bs_badges', STATE.badges);
  ls('bs_challenges', STATE.challenges);
  ls('bs_uc', STATE.userChallenges);
  ls('bs_ub', STATE.userBadges);
  ls('bs_cc', STATE.chatChannels);
  ls('bs_cm', STATE.chatMessages);
  ls('bs_notif', STATE.notifications);
  ls('bs_att', STATE.attendance);
  ls('bs_places', STATE.places);
  if (HV.connected) syncToCloud();
}

function navigate(page) {
  // Update bottom nav
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.bnav-item[data-page="${page}"]`);
  if (btn) btn.classList.add('active');

  // Hide all pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  STATE.currentPage = page;
  renderPage(page);
}

function renderPage(page) {
  const el = document.getElementById('page-' + page);
  if (!el) return;
  el.classList.add('active');

  switch(page) {
    case 'inicio': renderInicio(); break;
    case 'rutas': renderRutas(); break;
    case 'bikers': renderBikers(); break;
    case 'rider-detail': renderRiderDetail(); break;
    case 'bikergram': renderBikerGram(); break;
    case 'eventos': RUTAS_TAB = 'eventos'; renderRutas(); break;
    case 'retos': renderRetos(); break;
    case 'insignias': renderInsignias(); break;
    case 'profile': renderProfile(); break;
    case 'admin': renderAdmin(); break;
    case 'chat': renderChat(); break;
    case 'ranking': renderRanking(); break;
  }

  // Scroll to top
  el.scrollTop = 0;
}

    <button class="btn btn-primary" style="width:100%" onclick="saveHVSetup()">Guardar y sincronizar</button>
  `);

async function saveHVSetup() {
  const u = document.getElementById('hv-user').value.trim();
  const p = document.getElementById('hv-pass').value;
  if (!u || !p) { toast('Completa ambos campos'); return; }

  // Discover WebDAV path via OCS API
  toast('Conectando a HeyValue...');
  try {
    const r = await fetch(HV.url + '/ocs/v1.php/cloud/user', {
      headers: { Authorization: 'Basic ' + btoa(u + ':' + p), 'OCS-APIREQUEST': 'true' }
    });
    const xml = await r.text();
    const idMatch = xml.match(/<id>([^<]+)<\/id>/);
    const displayName = xml.match(/<display-name>([^<]+)<\/display-name>/)?.[1] || u;
    if (idMatch) {
      HV.hvPath = idMatch[1];
      localStorage.setItem('hv_path', HV.hvPath);
      toast('HeyValue conectado! Descubriendo carpeta...');
    } else {
      toast('Error descubriendo usuario — usando email como path');
      HV.hvPath = '';
    }
  } catch(e) {
    toast('Error conectando: ' + e.message);
    return;
  }

  localStorage.setItem('hv_user', u);
  localStorage.setItem('hv_pass', p);
  HV.user = u; HV.pass = p;
  closeModal();

  // Ensure RuedeGram folder exists
  toast('Creando carpeta BikerGram...');
  await hvRequest('MKCOL', '/' + HV.gramFolder);
  await hvRequest('MKCOL', '/' + HV.gramFolder + '/photos');
  await hvRequest('MKCOL', '/' + HV.gramFolder + '/videos');
  await hvRequest('MKCOL', '/' + HV.gramFolder + '/audio');

  syncFromCloud().then(() => { saveState(); navigate('inicio'); toast('HeyValue listo! Sincronizado.'); });
}

async function loadNews() {
  const container = document.getElementById('news-container');
  if (!container) return;
  container.innerHTML = '<div class="news-loading">Cargando noticias...</div>';
  try {
    const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://feeds.bbci.co.uk/mundo/rss.xml')}`);
    const data = await res.json();
    if (data.status !== 'ok' || !data.items) throw new Error('Invalid response');
    const items = data.items.slice(0, 5);
    container.innerHTML = '<div class="news-grid">' + items.map(item => `
      <a class="news-card" href="${item.link}" target="_blank" rel="noopener">
        ${item.thumbnail ? `<img class="news-card-img" src="${item.thumbnail}" alt="${item.title}" onerror="this.style.display='none'">` : ''}
        <div class="news-card-body">
          <div class="news-card-title">${item.title}</div>
          <div class="news-card-desc">${item.description ? item.description.replace(/<[^>]+>/g, '').substring(0, 100) + '...' : ''}</div>
          <div class="news-card-meta">
            <span class="news-badge">🔴 BBC</span>
            ${new Date(item.pubDate).toLocaleDateString('es-PA', {day:'numeric',month:'short'})}
          </div>
        </div>
      </a>
    `).join('') + '</div>';
  } catch (e) {
    container.innerHTML = '<div class="news-error">No se pudieron cargar las noticias</div>';
  }
}

function initHomeMap() {
  if (STATE.map) { STATE.map.remove(); STATE.map = null; }
  const mapEl = document.getElementById('map-home');
  if (!mapEl) return;

  const map = L.map('map-home', {zoomControl:false, attributionControl:false}).setView([8.9824, -79.5199], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {subdomains:'abcd', maxZoom:19}).addTo(map);

  // My location marker
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const {latitude:lat, longitude:lng} = pos.coords;
      map.setView([lat, lng], 13);
      L.circle([lat, lng], {color:'#ff4444', fillColor:'#ff4444', fillOpacity:0.3, radius:200}).addTo(map);
      L.marker([lat, lng]).addTo(map).bindPopup('Tu ubicacion');
    }, () => {}, {timeout:5000});
  }

  // Event markers
  STATE.events.filter(e => e.latitude && e.longitude).forEach(ev => {
    L.circle([ev.latitude, ev.longitude], {
      color:'#ff8800', fillColor:'#ff8800', fillOpacity:0.4, radius:300
    }).addTo(map).bindPopup(`<b>${ev.title}</b><br>${ev.date}`);
  });

  // Route lines with real-road routing via OSRM
  STATE.routes.forEach(rt => {
    if (!rt.start_lat || !rt.end_lat) return;
    const pts = [[rt.start_lat, rt.start_lng]];
    let stops = [];
    try { stops = JSON.parse(rt.stops || '[]'); } catch(e) {}
    stops.forEach(s => { if (s.lat && s.lng) pts.push([parseFloat(s.lat), parseFloat(s.lng)]); });
    pts.push([rt.end_lat, rt.end_lng]);

    // SALIDA pill
    const startDiv = L.divIcon({className:'', html:`<div style="background:#22c55e;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">SALIDA</div>`});
    L.marker([rt.start_lat, rt.start_lng], {icon:startDiv}).addTo(map);

    // PARADA pills
    stops.forEach(s => {
      if (!s.lat || !s.lng) return;
      const stopDiv = L.divIcon({className:'', html:`<div style="background:#ff8800;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">PARADA</div>`});
      L.marker([parseFloat(s.lat), parseFloat(s.lng)], {icon:stopDiv}).addTo(map);
    });

    // DESTINO pill
    const endDiv = L.divIcon({className:'', html:`<div style="background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">DESTINO</div>`});
    L.marker([rt.end_lat, rt.end_lng], {icon:endDiv}).addTo(map);

    // Dashed placeholder while OSRM loads
    const placeholder = L.polyline(pts, {color:'#ff4444', weight:4, opacity:0.4, dashArray:'10,10'}).addTo(map);

    // Real road route via OSRM
    const coords = pts.map(p => `${p[1]},${p[0]}`).join(';');
    fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`)
      .then(r => r.json())
      .then(data => {
        if (data.code !== 'Ok' || !data.routes || !data.routes[0]) return;
        placeholder.remove();
        L.geoJSON(data.routes[0].geometry, {style: {color:'#ff4444', weight:5, opacity:1, className:'route-animated'}}).addTo(map);
      }).catch(() => {});
  });

  STATE.map = map;
}

// Haversine distance in km
function routeDistanceKm(r) {
  if (!r.start_lat || !r.end_lat) return 0;
  const R = 6371;
  const dLat = (parseFloat(r.end_lat) - parseFloat(r.start_lat)) * Math.PI / 180;
  const dLng = (parseFloat(r.end_lng) - parseFloat(r.start_lng)) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(parseFloat(r.start_lat)*Math.PI/180)*Math.cos(parseFloat(r.end_lat)*Math.PI/180)*Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// Export route as GPX file
function exportRouteGPX(routeId) {
  const r = STATE.routes.find(x => x.id === routeId);
  if (!r) return;
  const creator = STATE.users.find(u => u.id === r.created_by);
  let stops = [];
  try { stops = JSON.parse(r.stops || '[]'); } catch(e) {}
  const allPoints = [
    { name: r.start_name || 'Salida', lat: r.start_lat, lng: r.start_lng },
    ...stops.map(s => ({ name: s.name, lat: s.lat, lng: s.lng })),
    { name: r.end_name || 'Destino', lat: r.end_lat, lng: r.end_lng },
  ].filter(p => p.lat && p.lng);

  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Biker Society" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata>
    <name>${escHtml(r.name)}</name>
    <desc>${escHtml(r.description || '')}</desc>
    <author><name>${escHtml(creator?.username || 'Biker Society')}</name></author>
    <time>${new Date().toISOString()}</time>
  </metadata>
  <rte>
    <name>${escHtml(r.name)}</name>
    ${allPoints.map(p => `<rtept lat="${p.lat}" lon="${p.lng}"><name>${escHtml(p.name)}</name></rtept>`).join('\n    ')}
  </rte>
</gpx>`;
  const blob = new Blob([gpx], { type: 'application/gpx+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${r.name.replace(/[^a-z0-9]/gi, '-')}.gpx`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 500);
  toast('GPX exportado');
}

function escHtml(s) {

function deselectRoute() {

function initRutasMap() {
  const mapEl = document.getElementById('map-rutas');
  if (!mapEl) return;
  if (STATE.map) { STATE.map.remove(); STATE.map = null; }
  if (STATE.rutaWatchId !== null) { navigator.geolocation.clearWatch(STATE.rutaWatchId); STATE.rutaWatchId = null; }

  const map = L.map('map-rutas', {zoomControl:false, attributionControl:false}).setView([8.9824, -79.5199], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {subdomains:'abcd', maxZoom:19}).addTo(map);
  STATE.map = map;

  const sel = STATE.selectedRoute;

  if (sel) {
    // === MODO RUTA SELECCIONADA ===
    const pts = [[sel.start_lat, sel.start_lng]];
    let stops = [];
    try { stops = JSON.parse(sel.stops || '[]'); } catch(e) {}
    stops.forEach(s => { if (s.lat && s.lng) pts.push([parseFloat(s.lat), parseFloat(s.lng)]); });
    pts.push([sel.end_lat, sel.end_lng]);

    // SALIDA pill
    const startDiv = L.divIcon({className:'', html:`<div style="background:#22c55e;color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">SALIDA</div>`});
    L.marker([sel.start_lat, sel.start_lng], {icon:startDiv}).addTo(map);

    // PARADA pills
    stops.forEach((s, i) => {
      if (!s.lat || !s.lng) return;
      const stopDiv = L.divIcon({className:'', html:`<div style="background:#ff8800;color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">P${i+1}</div>`});
      L.marker([parseFloat(s.lat), parseFloat(s.lng)], {icon:stopDiv}).addTo(map);
    });

    // DESTINO pill
    const endDiv = L.divIcon({className:'', html:`<div style="background:#ef4444;color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">DESTINO</div>`});
    L.marker([sel.end_lat, sel.end_lng], {icon:endDiv}).addTo(map);

    // Placeholder line
    const placeholder = L.polyline(pts, {color:'#ff4444', weight:5, opacity:0.35, dashArray:'12,8'}).addTo(map);

    // Real road route via OSRM
    const coords = pts.map(p => `${p[1]},${p[0]}`).join(';');
    fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`)
      .then(res => res.json())
      .then(data => {
        if (data.code !== 'Ok' || !data.routes || !data.routes[0]) return;
        placeholder.remove();
        L.geoJSON(data.routes[0].geometry, {style: {color:'#ff4444', weight:5, opacity:1, className:'route-animated'}}).addTo(map);
      }).catch(() => {});

    // Fit to route
    if (sel.start_lat && sel.end_lat) map.fitBounds(pts, {padding: [40, 40], maxZoom: 14});

    // === UBICACION EN TIEMPO REAL ===
    if (navigator.geolocation) {
      // My location
      navigator.geolocation.getCurrentPosition(pos => {
        const {latitude:lat, longitude:lng} = pos.coords;
        if (STATE.myLocationMarker) { STATE.myLocationMarker.remove(); }
        const myIcon = L.divIcon({className:'', html:`<div style="width:16px;height:16px;background:#3b82f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px rgba(59,130,246,0.8)"></div>`});
        STATE.myLocationMarker = L.marker([lat, lng], {icon:myIcon}).addTo(map).bindPopup('Mi ubicación');
      }, () => {}, {timeout:5000});

      // Watch position for live tracking
      STATE.rutaWatchId = navigator.geolocation.watchPosition(pos => {
        const {latitude:lat, longitude:lng} = pos.coords;
        if (STATE.myLocationMarker) { STATE.myLocationMarker.remove(); }
        const myIcon = L.divIcon({className:'', html:`<div style="width:16px;height:16px;background:#3b82f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px rgba(59,130,246,0.8)"></div>`});
        STATE.myLocationMarker = L.marker([lat, lng], {icon:myIcon}).addTo(map).bindPopup('Mi ubicación (en vivo)');
      }, () => {}, {enableHighAccuracy:true, maximumAge:5000});
    }

    // Bikers en tiempo real
    renderBikerLiveLocations(map);

  } else {
    // === MODO VISTA GENERAL (todas las rutas) ===
    STATE.routes.forEach(r => {
      if (r.start_lat && r.start_lng) {
        L.circleMarker([r.start_lat, r.start_lng], {
          radius: 8, fillColor: '#00d4ff', color: '#a855f7', weight: 2, opacity: 1, fillOpacity: 0.8
        }).addTo(map).on('click', () => selectRoute(r.id));
      }
      try {
        const stops = JSON.parse(r.stops || '[]');
        stops.forEach((s, i) => {
          if (s.lat && s.lng) {
            L.circleMarker([s.lat, s.lng], {
              radius: 7, fillColor: '#ffaa00', color: '#ff8800', weight: 2, opacity: 1, fillOpacity: 0.8
            }).addTo(map);
          }
        });
      } catch(e) {}
      if (r.end_lat && r.end_lng) {
        L.circleMarker([r.end_lat, r.end_lng], {
          radius: 8, fillColor: '#00e676', color: '#00c853', weight: 2, opacity: 1, fillOpacity: 0.8
        }).addTo(map).on('click', () => selectRoute(r.id));
      }
    });

    // Ubicación del usuario en vista general
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        const {latitude:lat, longitude:lng} = pos.coords;
        map.setView([lat, lng], 12);
        const myIcon = L.divIcon({className:'', html:`<div style="width:14px;height:14px;background:#3b82f6;border:2px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(59,130,246,0.7)"></div>`});
        L.marker([lat, lng], {icon:myIcon}).addTo(map).bindPopup('Mi ubicación');
      }, () => {}, {timeout:5000});
    }

    const points = [];
    STATE.routes.forEach(r => {
      if (r.start_lat && r.start_lng) points.push([r.start_lat, r.start_lng]);
      if (r.end_lat && r.end_lng) points.push([r.end_lat, r.end_lng]);
    });
    if (points.length > 0) map.fitBounds(points, {padding: [30, 30]});
  }
}

function renderBikerLiveLocations(map) {
  // Muestra todos los bikers activos con ubicación en tiempo real

      STATE.bikerMarkers[u.id] = L.marker([u.latitude, u.longitude], {icon}).addTo(map).bindPopup(`🏍️ ${u.username}`);

function setupEditStopPlaceSearch(idx) {
  const nameInput = document.getElementById('es-name-' + idx);
  const dropdown = document.getElementById('es-name-' + idx + '-dropdown');
  const latInput = document.getElementById('es-lat-' + idx);
  const lngInput = document.getElementById('es-lng-' + idx);
  if (!nameInput || !dropdown) return;

  let timeout = null;
  nameInput.addEventListener('input', function() {
    clearTimeout(timeout);
    const val = this.value.trim();
    if (val.length < 2) { dropdown.style.display = 'none'; return; }
    timeout = setTimeout(async () => {
      const { local, online } = await searchPlaces(val);
      const seen = new Set();
      const merged = [...local, ...online].filter(p => {
        const key = p.lat.toFixed(4) + ',' + p.lng.toFixed(4);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).slice(0, 6);
      showPlaceResults(dropdown, merged, { nameInput, latInput, lngInput, onSelect: () => toast('Guardado en EVA Lube 📍') });
    }, 300);
  });
  nameInput.addEventListener('blur', () => setTimeout(() => dropdown.style.display = 'none', 200));
}

function clearPlace(prefix) {

function setupModalPlaceSearch(prefix) {
  const nameInput = document.getElementById(prefix + '-name');
  const dropdown = document.getElementById(prefix + '-name-dropdown');
  const latInput = document.getElementById(prefix + '-lat');
  const lngInput = document.getElementById(prefix + '-lng');
  if (!nameInput || !dropdown) return;

  let timeout = null;
  nameInput.addEventListener('input', function() {
    clearTimeout(timeout);
    const val = this.value.trim();
    if (val.length < 2) { dropdown.style.display = 'none'; return; }
    timeout = setTimeout(async () => {
      const { local, online } = await searchPlaces(val);

function parseGmapsUrl(url) {
  // Handle various Google Maps URL formats
  // Format 1: @lat,lng,z - direct coordinates
  // Format 2: /place/Name/@lat,lng - place with coordinates
  // Format 3: ?query=lat,lng - search query
  // Format 4: !3dlocation=lat,lng!4d - data coordinates
  const patterns = [
    /@(-?\d+\.?\d*),(-?\d+\.?\d*)/,
    /!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/,
    /query=(-?\d+\.?\d*)%2C(-?\d+\.?\d*)/,
    /\?q=(-?\d+\.?\d*),(-?\d+\.?\d*)/,
    /\/place\/[^\/]+\/(-?\d+\.?\d*),(-?\d+\.?\d*)/
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  }
  return null;
}

// Auto-parse on paste into coord fields (create & edit)
document.addEventListener('paste', function(e) {
  setTimeout(function() {
    ['rt-start', 'rt-end', 'ert-start', 'ert-end'].forEach(function(prefix) {
      const latEl = document.getElementById(prefix + '-lat');
      const lngEl = document.getElementById(prefix + '-lng');
      if (!latEl || !lngEl) return;
      const latVal = latEl.value.trim();
      if (latVal.includes('google.com') || latVal.includes('maps')) {
        const coords = parseGmapsUrl(latVal);
        if (coords) {
          latEl.value = coords.lat;
          lngEl.value = coords.lng;
          toast('Coordenadas extraídas: ' + coords.lat.toFixed(5) + ', ' + coords.lng.toFixed(5));
        }
      }
    });

    document.querySelectorAll('[id^="editstop-"][id$="-lat"]').forEach(function(latEl) {
      const val = latEl.value.trim();
      if (val.includes('google.com') || val.includes('maps')) {
        const coords = parseGmapsUrl(val);
        if (coords) {
          latEl.value = coords.lat;
          const lngEl = document.getElementById(latEl.id.replace('-lat', '-lng'));
          if (lngEl) lngEl.value = coords.lng;

function doCreateRoute() {
  const name = document.getElementById('rt-name').value.trim();
  const desc = document.getElementById('rt-desc').value.trim();
  const startName = document.getElementById('rt-start-name').value.trim();
  const startLat = parseFloat(document.getElementById('rt-start-lat').value) || 0;
  const startLng = parseFloat(document.getElementById('rt-start-lng').value) || 0;
  const endName = document.getElementById('rt-end-name').value.trim();
  const endLat = parseFloat(document.getElementById('rt-end-lat').value) || 0;
  const endLng = parseFloat(document.getElementById('rt-end-lng').value) || 0;
  const diff = document.getElementById('rt-diff').value;

  // Collect stops
  const stops = [];
  document.querySelectorAll('[id^="stop-"][id$="-name"]').forEach(function(el) {
    var stopId = el.id.replace('-name', '');
    var stopLat = parseFloat(document.getElementById(stopId + '-lat').value) || 0;
    var stopLng = parseFloat(document.getElementById(stopId + '-lng').value) || 0;
    if (el.value.trim() && stopLat && stopLng) {
      stops.push({name: el.value.trim(), lat: stopLat, lng: stopLng});
    }
  });

  if (!name) { toast('El nombre es obligatorio'); return; }
  if (!startLat || !startLng) { toast('Busca y selecciona un punto de SALIDA'); return; }
  if (!endLat || !endLng) { toast('Busca y selecciona un punto de DESTINO'); return; }
  const route = {
    id: Date.now() % 100000,
    name,
    description: desc,
    start_lat: startLat,
    start_lng: startLng,
    start_name: startName,
    end_lat: endLat,
    end_lng: endLng,
    end_name: endName,
    difficulty: diff,
    stops: JSON.stringify(stops),
    created_by: STATE.user.id,
    created_at: new Date().toISOString().slice(0,19).replace('T',' ')
  };
  STATE.routes.push(route);
  saveState();
  closeModal();
  STATE.selectedRoute = route;
  renderRutas();
  toast('Ruta creada!');
}

function deleteRoute(id) {
  if (!confirm('¿Eliminar esta ruta?')) return;
  STATE.routes = STATE.routes.filter(r => r.id !== id);
  STATE.selectedRoute = null;
  saveState();
  renderRutas();
  toast('Ruta eliminada');
}

// Live preview when user selects a new avatar
async function previewAvatarUpload(event, userId) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast('Imagen muy grande (máx 8MB)'); return; }
  const compressed = await compressImage(file, 800, 0.82);
  if (!compressed) { toast('No se pudo procesar la imagen'); return; }
  // Store on user record (saved on submit)
  const r = STATE.users.find(u => u.id === userId);
  if (!r) return;
  r.avatar = compressed;
  // Live preview in modal
  const prev = document.getElementById('ed-avatar-preview');
  if (prev) prev.innerHTML = renderAvatar(r, 96);
  // Show "Quitar" button
  event.target.insertAdjacentHTML('afterend',
    `<button type="button" id="ed-avatar-clear" style="display:inline-block;margin-left:8px;padding:8px 14px;background:transparent;border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--danger);cursor:pointer" onclick="clearAvatar(${userId})">Quitar</button>`);
  toast('Foto cargada — guarda para aplicar');
}

function clearAvatar(userId) {
  const r = STATE.users.find(u => u.id === userId);
  if (!r) return;
  r.avatar = null;
  const prev = document.getElementById('ed-avatar-preview');
  if (prev) prev.innerHTML = renderAvatar(r, 96);
  const clr = document.getElementById('ed-avatar-clear');
  if (clr) clr.remove();
  const fileIn = document.getElementById('ed-avatar');
  if (fileIn) fileIn.value = '';
  toast('Foto quitada — guarda para confirmar');
}

function doEditRider(id) {
  const r = STATE.users.find(u => u.id === id);
  if (!r) return;
  const isAdmin = STATE.user?.is_admin;
  r.username = document.getElementById('ed-username').value.trim() || r.username;
  r.email = document.getElementById('ed-email').value.trim() || r.email;
  r.bike_model = document.getElementById('ed-bike').value.trim();
  r.city = document.getElementById('ed-city').value.trim();
  r.bio = document.getElementById('ed-bio').value.trim();
  const newPass = document.getElementById('ed-pass')?.value;
  if (newPass) r.password = newPass;
  // Avatar is already set on r.avatar by previewAvatarUpload / clearAvatar

  if (isAdmin) {
    const edIsAdmin = document.getElementById('ed-isadmin');
    const edIsInjured = document.getElementById('ed-isinjured');
    const edPoints = document.getElementById('ed-points');
    if (edIsAdmin) r.is_admin = edIsAdmin.checked;
    if (edIsInjured) r.is_injured = edIsInjured.checked;
    if (edPoints) r.points = parseInt(edPoints.value) || r.points;
  }

  if (STATE.user?.id === id) STATE.user = r;
  ls('bs_session', STATE.user);
  saveState();
  recalculateUserStats(id);
  closeModal();
  navigate(id === STATE.user?.id ? 'profile' : 'rider-detail');
  toast('Perfil actualizado!');
}

function giveAdminAward(id) {
  const r = STATE.users.find(u => u.id === id);
  if (!r) return;
  r.is_distinguished = true;
  const badge20 = STATE.badges.find(b => b.id === 20);
  const existing = STATE.userBadges.find(ub => ub.user_id === id && ub.badge_id === 20);
  if (!existing && badge20) {
    r.points = (r.points || 0) + badge20.points_bonus;
    STATE.userBadges.push({
      user_id: id, badge_id: 20, earned_at: new Date().toISOString(), stat_value: 1
    });
  }
  saveState();
  toast(`${r.username} получил статус Destacado! ⭐`);
  closeModal();
  if (id === STATE.user?.id) renderProfile();
  else renderAdmin();
}

function removeAdminAward(id) {
  const r = STATE.users.find(u => u.id === id);
  if (!r) return;
  r.is_distinguished = false;
  STATE.userBadges = STATE.userBadges.filter(ub => !(ub.user_id === id && ub.badge_id === 20));
  saveState();
  delete STATE.userStats[id];
  toast(`Destacado removido de ${r.username}`);
  closeModal();
  renderAdmin();
}

function resolveHvMedia() {
  if (!HV.user || !HV.pass) return;
  document.querySelectorAll('video[src], audio[src]').forEach(el => {
    const src = el.src;
    // Skip data URLs, blob URLs, and already-resolved URLs
    if (!src || src.startsWith('data:') || src.startsWith('blob:')) return;
    // Only handle HeyValue WebDAV URLs
    if (!src.includes('/dav/files/')) return;
    // Already resolved?
    if (el.dataset.hvResolved === '1') return;
    el.dataset.hvResolved = '1';
    resolveMediaUrl(src).then(blobUrl => {
      if (blobUrl !== src) {
        el.src = blobUrl;
        el.load();
      }
    }).catch(() => {});
  });
}

// Resolve media URL: blob/data URLs pass through, HeyValue WebDAV URLs get fetched with auth
const _mediaCache = {};
async function resolveMediaUrl(url, type) {
  if (!url) return url;
  if (url.startsWith('data:') || url.startsWith('blob:') || url.startsWith('http') && !url.includes('dav/files')) return url;
  if (_mediaCache[url]) return _mediaCache[url];
  if (!url.includes('/dav/files/')) return url;
  try {
    const res = await fetch(url, { headers: { Authorization: 'Basic ' + btoa(HV.user + ':' + HV.pass) } });
    if (!res.ok) return url;
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    _mediaCache[url] = blobUrl;
    return blobUrl;
  } catch { return url; }
}
function resolveMediaUrlSync(url) { return url; }
