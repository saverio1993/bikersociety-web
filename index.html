<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Biker Society</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BikerApp">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ===== MODERNIZED BIKER SOCIETY v2.0 ===== */
/* Dark Racing Pro — Negro profundo + Rojo animado */

:root{
  --bg:#000000;
  --surface:#0a0a0a;
  --surface2:#111111;
  --surface3:#1a1a1a;
  --border:#2a0000;
  --border2:#3a0000;
  --accent:#ff2020;
  --accent2:#ff6600;
  --accent3:#ff0033;
  --glow:rgba(255,32,32,0.6);
  --glow2:rgba(255,102,0,0.5);
  --text:#ffffff;
  --text2:#aaaaaa;
  --text3:#666666;
  --success:#00ff44;
  --danger:#ff0000;
  --warning:#ffaa00;
  --radius:12px;
  --radius-sm:8px;
  --transition:0.2s cubic-bezier(0.4,0,0.2,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}
a{color:inherit;text-decoration:none}

/* ANIMATED BACKGROUND */
.bg-gradient{
  position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:var(--bg);
}
.bg-gradient::before{
  content:'';position:absolute;
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(255,32,32,0.12) 0%,transparent 70%);
  top:-200px;right:-200px;
  animation:bgFloat 12s ease-in-out infinite;
}
.bg-gradient::after{
  content:'';position:absolute;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(255,102,0,0.08) 0%,transparent 70%);
  bottom:-150px;left:-150px;
  animation:bgFloat 18s ease-in-out infinite reverse;
}
@keyframes bgFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-20px) scale(1.05)}
  66%{transform:translate(-20px,20px) scale(0.95)}
}

/* PAGE CONTAINER */
.page{display:none;height:100%;overflow-y:auto;overflow-x:hidden;padding:60px 16px 80px}
.page.active{display:block}

/* VANISH ANIMATIONS */
.vanish{opacity:0;transform:translateY(16px);animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) forwards}
.fadein{animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) forwards}
@keyframes fadeUp{
  to{opacity:1;transform:translateY(0)}
}

/* STAGGERED CARD ENTRANCE */
.card,.post-card,.event-card,.rider-card,.challenge-card,.rank-item{
  opacity:0;transform:translateY(20px);
  animation:cardIn 0.5s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes cardIn{
  to{opacity:1;transform:translateY(0)}
}

/* ===== TOPBAR ===== */
.topbar{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:rgba(6,6,6,0.92);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid rgba(0,212,255,0.15);
  box-shadow:0 0 30px rgba(0,212,255,0.05);
}
.topbar-logo{
  display:flex;align-items:center;gap:10px;
  cursor:pointer;
}
@keyframes gradientShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.topbar-logo img{width:36px;height:36px;border-radius:8px;object-fit:cover;box-shadow:0 0 10px rgba(255,32,32,0.4)}
.topbar-actions{display:flex;gap:8px}
.topbar-actions button{
  width:38px;height:38px;border-radius:50%;
  background:var(--surface2);
  color:var(--text);
  font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
  border:1px solid transparent;
}
.topbar-actions button:hover{
  background:var(--surface3);
  border-color:var(--accent);
  box-shadow:0 0 16px var(--glow);
}
#online-count-btn{
  width:auto;height:30px;border-radius:16px;
  display:flex;align-items:center;gap:6px;
  padding:0 12px;
  background:rgba(0,255,68,0.08);
  border:1px solid rgba(0,255,68,0.22);
  font-family:'Courier New',monospace;
  font-size:11px;font-weight:700;letter-spacing:0.5px;
  color:var(--success);text-transform:uppercase;
}
#online-count-btn:empty{display:none}
#online-count-btn:hover{
  background:rgba(0,255,68,0.15);
  border-color:var(--success);
  box-shadow:0 0 14px rgba(0,255,68,0.35);
}
.online-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:var(--success);
  box-shadow:0 0 6px var(--success),0 0 12px rgba(0,255,68,0.6);
  animation:onlinePulse 2s ease-in-out infinite;
}
@keyframes onlinePulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.5;transform:scale(.8)}
}

/* ===== BREADCRUMB BAR ===== */
.breadcrumb-seg{
  display:flex;align-items:center;gap:4px;flex-shrink:0;
}
.breadcrumb-link{
  font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;
  padding:4px 6px;border-radius:6px;transition:all 0.15s;
  white-space:nowrap;
}
.breadcrumb-link:hover{background:rgba(0,212,255,0.1)}
.breadcrumb-current{
  font-size:12px;font-weight:700;color:var(--text);cursor:default;
  padding:4px 0;white-space:nowrap;
}
.breadcrumb-sep{
  color:var(--text3);font-size:11px;user-select:none;flex-shrink:0;
}
/* ===== BOTÓN ATRÁS NEÓN ===== */
@keyframes neonBackPulse{
  0%,100%{box-shadow:0 0 6px rgba(0,212,255,.7),0 0 16px rgba(0,212,255,.35);border-color:#00d4ff}
  50%{box-shadow:0 0 16px rgba(0,212,255,1),0 0 32px rgba(0,212,255,.7);border-color:#7df9ff}
}
.neon-back-btn{
  display:flex;align-items:center;gap:6px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(0,212,255,.20),rgba(0,212,255,.05));
  border:2px solid #00d4ff;color:#aef2ff;
  font-size:14px;font-weight:800;letter-spacing:.5px;
  padding:8px 16px;border-radius:22px;cursor:pointer;margin-right:8px;
  white-space:nowrap;animation:neonBackPulse 1.1s ease-in-out infinite;
  text-shadow:0 0 8px rgba(0,212,255,.9);
}
.neon-back-btn:active{transform:scale(.93)}
.neon-back-btn .bk-arrow{font-size:20px;line-height:1;margin-top:-1px}

/* ===== FLOATING MORE PANEL ===== */
.fpanel-overlay{
  position:fixed;inset:0;z-index:2000;
  background:rgba(0,0,0,0);pointer-events:none;
  transition:background 0.3s;
}
.fpanel-overlay.open{
  background:rgba(0,0,0,0.6);pointer-events:auto;
  backdrop-filter:blur(4px);
}
.fpanel{
  position:fixed;top:0;right:0;bottom:0;
  width:min(320px,88vw);
  background:rgba(8,8,12,0.98);
  border-left:1px solid rgba(0,212,255,0.2);
  z-index:2001;
  transform:translateX(100%);
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
  display:flex;flex-direction:column;
  box-shadow:-8px 0 40px rgba(0,212,255,0.15);
  overflow:hidden;
}
.fpanel.open{transform:translateX(0)}

.fpanel-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 16px;
  border-bottom:1px solid rgba(0,212,255,0.1);
  background:linear-gradient(180deg,rgba(0,212,255,0.08),transparent);
}
.fpanel-header-title{
  font-size:17px;font-weight:800;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.fpanel-close{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:all 0.2s;flex-shrink:0;
}
.fpanel-close:hover{background:rgba(255,68,68,0.2);border-color:rgba(255,68,68,0.4);color:#ff4444}

.fpanel-body{flex:1;overflow-y:auto;padding:12px 16px 100px;overscroll-behavior:contain}
.fpanel-body::-webkit-scrollbar{width:4px}
.fpanel-body::-webkit-scrollbar-track{background:transparent}
.fpanel-body::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);border-radius:2px}

.fpanel-section{margin-bottom:8px}
.fpanel-section-label{
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(0,212,255,0.5);padding:8px 8px 4px;margin-top:4px;
}

.fpanel-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 10px;border-radius:12px;
  cursor:pointer;transition:all 0.2s;
  color:var(--text2);font-size:14px;font-weight:500;
  border:none;background:none;width:100%;text-align:left;
}
.fpanel-item:hover{background:rgba(0,212,255,0.08);color:var(--accent)}
.fpanel-item:active{transform:scale(0.98)}
.fpanel-item-icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);
  transition:all 0.2s;
}
.fpanel-item:hover .fpanel-item-icon{
  background:rgba(0,212,255,0.15);
  border-color:rgba(0,212,255,0.3);
  box-shadow:0 0 12px rgba(0,212,255,0.2);
}
.fpanel-item-text{flex:1;min-width:0}
.fpanel-item-label{font-size:14px;font-weight:600;display:block}
.fpanel-item-sub{font-size:11px;color:var(--text3);display:block;margin-top:1px}
.fpanel-item-arrow{font-size:12px;color:var(--text3);margin-left:auto}

.fpanel-divider{height:1px;background:rgba(255,255,255,0.06);margin:8px 0}

/* Submenu in panel */
.fpanel-submenu{
  margin:4px 0 8px;
  background:rgba(0,0,0,0.3);
  border:1px solid rgba(0,212,255,0.08);
  border-radius:14px;
  overflow:hidden;
  padding:6px;
}
.fpanel-subitem{
  display:flex;align-items:center;gap:10px;
  padding:10px 8px;border-radius:10px;
  cursor:pointer;transition:all 0.2s;
  color:var(--text2);font-size:13px;font-weight:500;
  border:none;background:none;width:100%;text-align:left;
}
.fpanel-subitem:hover{background:rgba(255,32,32,0.12);color:#ff2020}
.fpanel-subitem-icon{font-size:16px;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);flex-shrink:0}

/* Danger item */
.fpanel-item.danger:hover{background:rgba(255,68,68,0.08);color:#ff4444}
.fpanel-item.danger .fpanel-item-icon{background:rgba(255,68,68,0.1)}

/* ===== BOTTOM NAV ===== */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;
  height:72px;
  background:rgba(6,6,6,0.95);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  z-index:1000;
  display:flex;
  border-top:1px solid rgba(0,212,255,0.15);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 30px rgba(0,212,255,0.1);
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;color:var(--text3);font-size:10px;font-weight:600;
  transition:var(--transition);
  cursor:pointer;padding:8px 0;
  border:none;background:none;
  position:relative;
}
.bnav-item::before{
  content:'';position:absolute;
  top:0;left:50%;transform:translateX(-50%);
  width:32px;height:3px;
  background:linear-gradient(90deg,#ff2020,#ff6600);
  border-radius:0 0 3px 3px;
  opacity:0;transition:var(--transition);
}
.bnav-item.active{color:var(--accent)}
.bnav-item.active::before{opacity:1;box-shadow:0 0 12px var(--glow)}
.bnav-item:active{transform:scale(0.95)}
.bnav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:var(--transition)}
.bnav-item.active svg{filter:drop-shadow(0 0 8px var(--glow))}
.bnav-item img{transition:var(--transition);filter:brightness(0.6) drop-shadow(0 0 0px transparent)}
.bnav-item.active img{filter:brightness(1.3) drop-shadow(0 0 10px var(--glow));transform:scale(1.1)}
.bnav-item span{display:block}

/* ===== CARDS ===== */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;
  inset:0;opacity:0;
  background:linear-gradient(135deg,rgba(0,212,255,0.05),rgba(168,85,247,0.03));
  transition:var(--transition);
}
.card:hover{
  border-color:rgba(255,32,32,0.6);
  box-shadow:0 4px 24px rgba(255,32,32,0.2),0 0 0 1px rgba(255,32,32,0.15) inset;
  transform:translateY(-2px);
}
.card:hover::before{opacity:1}
.card-title{font-weight:700;font-size:15px;margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text2)}

/* ===== BADGES ===== */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
  background:var(--surface2);border:1px solid var(--border);
  transition:var(--transition);
}
.badge-gold{
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#000;border:none;
  box-shadow:0 0 12px rgba(251,191,36,0.3);
}
.badge-red{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border:none;
  box-shadow:0 0 12px var(--glow);
}
.badge-green{
  background:linear-gradient(135deg,#00e676,#00c853);
  color:#000;border:none;
  box-shadow:0 0 12px rgba(0,230,118,0.3);
}
.badge-blue{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border:none;
  box-shadow:0 0 12px var(--glow);
}

/* ===== MAP ===== */
.map-container{position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
#map{height:350px;width:100%;background:var(--surface2)}
.map-label{
  position:absolute;top:12px;left:12px;z-index:500;
  background:rgba(6,6,6,0.9);
  backdrop-filter:blur(12px);
  padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;
  color:var(--text);border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,0.5);
}

/* ===== POI MARKERS ===== */
.poi-pill{
  background:var(--accent);color:#050810;
  padding:7px 16px;border-radius:20px;font-size:12px;font-weight:800;
  white-space:nowrap;
  box-shadow:0 4px 20px var(--glow),0 0 40px rgba(0,212,255,0.2);
  animation:poiPulse 2s ease-in-out infinite;
  position:relative;
}
.poi-tooltip{
  background:var(--surface)!important;
  border:1px solid var(--border)!important;
  border-radius:8px!important;
  padding:6px 12px!important;
  font-size:13px!important;
  font-weight:600!important;
  color:var(--text)!important;
  box-shadow:0 4px 20px rgba(0,0,0,0.3)!important;
  white-space:nowrap!important;
}
.poi-tooltip::before{border-top-color:var(--border)!important}
.poi-pill::before{
  content:'';position:absolute;inset:-4px;
  border-radius:inherit;
  border:2px solid var(--accent);
  animation:poiRing 2s ease-in-out infinite;
}
@keyframes poiPulse{
  0%,100%{transform:scale(1);box-shadow:0 4px 20px var(--glow)}
  50%{transform:scale(1.05);box-shadow:0 6px 30px var(--glow2)}
}
@keyframes poiRing{
  0%{transform:scale(1);opacity:0.8}
  100%{transform:scale(1.8);opacity:0}
}

/* ===== ROUTE ANIMATION ===== */
.route-animated{
  stroke-dasharray:20,12;
  stroke-dashoffset:0;
  animation:dash 1.5s linear infinite;
}
@keyframes dash{to{stroke-dashoffset:-32}}

/* ===== LIKES HEART ===== */
.like-btn{
  background:rgba(255,255,255,0.04);border:none;color:var(--text3);font-size:12px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:8px 6px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);
  transition:all 0.2s;flex:1;letter-spacing:0.3px;text-transform:uppercase;
}
.like-btn:hover{background:rgba(255,68,68,0.12);border-color:rgba(255,68,68,0.35);color:#ff4466;
  box-shadow:0 0 12px rgba(255,68,68,0.2),inset 0 0 8px rgba(255,68,68,0.06)}
.like-btn.liked{
  color:#ff4466;border-color:rgba(255,68,68,0.5);
  box-shadow:0 0 16px rgba(255,68,68,0.25),inset 0 0 10px rgba(255,68,68,0.1);
  animation:heartBeat 0.4s ease;
}
@keyframes heartBeat{
  0%{transform:scale(1)}
  25%{transform:scale(1.3)}
  50%{transform:scale(1)}
  75%{transform:scale(1.15)}
  100%{transform:scale(1)}
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.6;transform:scale(1.15)}
}
.like-btn:hover{color:var(--danger);background:rgba(255,59,59,0.1)}
.like-btn.liked{
  color:var(--danger);
  animation:heartBeat 0.4s ease;
  filter:drop-shadow(0 0 8px var(--glow));
}
@keyframes heartBeat{
  0%{transform:scale(1)}
  25%{transform:scale(1.3)}
  50%{transform:scale(1)}
  75%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

/* ===== INPUTS ===== */
.input{
  width:100%;padding:13px 16px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);font-size:14px;
  transition:var(--transition);
  margin-bottom:12px;
}
.input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,59,59,0.15),0 0 20px rgba(255,59,59,0.1);
  background:var(--surface3);
}
.input::placeholder{color:var(--text3)}

/* ===== BUTTONS ===== */
.btn{
  padding:13px 26px;border-radius:var(--radius-sm);
  font-weight:700;font-size:14px;
  transition:var(--transition);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  position:relative;overflow:hidden;
}
.btn-primary{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;
  box-shadow:0 4px 16px var(--glow);
}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent);
  opacity:0;transition:var(--transition);
}
.btn-primary:hover::before{opacity:1}
.btn-primary:hover{
  box-shadow:0 6px 24px var(--glow2),0 0 40px rgba(255,59,59,0.2);
  transform:translateY(-1px);
}
.btn-primary:active{transform:scale(0.97) translateY(0)}
.btn-secondary{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover{
  border-color:var(--accent);
  background:var(--surface3);
  box-shadow:0 0 12px rgba(255,59,59,0.1);
}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{color:var(--text);background:var(--surface2)}

/* ===== MODAL ===== */
.modal{
  position:fixed;inset:0;z-index:2000;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(12px);
  animation:modalFadeIn 0.2s ease;
}
@keyframes modalFadeIn{from{opacity:0}}
.modal.open{display:flex}
.modal-content{
  max-width:440px;width:calc(100% - 32px);
  max-height:90vh;overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  animation:modalSlideIn 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 24px 80px rgba(0,0,0,0.8),0 0 60px rgba(255,59,59,0.1);
}
@keyframes modalSlideIn{from{transform:translateY(20px);opacity:0}}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;background:linear-gradient(135deg,#ff2020,#ff6600);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* ===== POST CARD ===== */
.post-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
  transition:var(--transition);
}
.post-card:hover{
  border-color:rgba(255,59,59,0.3);
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.racing-card:hover{
  border-color:rgba(255,68,68,0.2);
  box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 0 1px rgba(255,68,68,0.08);
  transform:translateY(-1px);
  transition:all 0.3s;
}
@keyframes audioPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}
.post-header{padding:12px 16px;display:flex;align-items:center;gap:10px}
.post-avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:#fff;flex-shrink:0;
  box-shadow:0 0 16px var(--glow);
}
.post-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.post-name{font-weight:700;font-size:14px}
.post-time{font-size:11px;color:var(--text2)}
.post-content{padding:0 16px 12px;font-size:14px;line-height:1.5}
.post-image{width:100%;max-height:400px;object-fit:contain;display:block;background:#000}
.post-actions{padding:6px 12px;display:flex;gap:4px;border-top:1px solid var(--border);align-items:center}
.post-action-btn{
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;padding:8px 6px;font-size:11px;font-weight:700;
  color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:5px;transition:all 0.2s;flex:1;letter-spacing:0.3px;text-transform:uppercase;
}
.post-action-btn:hover{color:#fff}
.post-action-btn:active{transform:scale(0.96)}
.post-action-btn.liked-neon{color:#ff4466;border-color:rgba(255,68,68,0.5);
  box-shadow:0 0 14px rgba(255,68,68,0.22),inset 0 0 8px rgba(255,68,68,0.08)}
/* Individual neon glows per action */
.btn-like:hover{box-shadow:0 0 14px rgba(255,68,102,0.3);border-color:rgba(255,68,102,0.5);color:#ff4466}
.btn-react:hover{box-shadow:0 0 14px rgba(255,200,0,0.3);border-color:rgba(255,200,0,0.5);color:#ffc800}
.btn-comment:hover{box-shadow:0 0 14px rgba(0,212,255,0.3);border-color:rgba(0,212,255,0.5);color:#00d4ff}
.btn-share:hover{box-shadow:0 0 14px rgba(100,130,255,0.3);border-color:rgba(100,130,255,0.5);color:#6482ff}

/* ===== EVENT CARD ===== */
.event-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:16px;
  transition:var(--transition);
}
.event-card:hover{
  border-color:rgba(255,59,59,0.4);
  box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 20px rgba(255,59,59,0.1);
  transform:translateY(-2px);
}
.event-img{width:100%;height:160px;object-fit:cover}
.event-body{padding:16px}
.event-date{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px}
.event-title{font-size:16px;font-weight:800;margin:6px 0 10px}
.event-meta{display:flex;gap:16px;font-size:12px;color:var(--text2)}

/* ===== RIDER CARD ===== */
.rider-card{
  display:flex;align-items:center;gap:12px;
  padding:14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:8px;
  cursor:pointer;
  transition:var(--transition);
}
.rider-card:hover{
  border-color:var(--accent);
  box-shadow:0 0 16px rgba(255,59,59,0.15);
  transform:translateX(4px);
}
.rider-avatar{
  width:50px;height:50px;border-radius:50%;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;color:#fff;flex-shrink:0;
  box-shadow:0 0 20px var(--glow);
  position:relative;
}
.rider-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.rider-avatar::after{
  content:'';position:absolute;inset:-2px;
  border-radius:50%;
  border:2px solid transparent;
  background:linear-gradient(135deg,#ff3b3b,#ff6b35) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite: destination-out;
  mask-composite:exclude;
  animation:avatarRing 3s linear infinite;
}
@keyframes avatarRing{to{transform:rotate(360deg)}}
.rider-info{flex:1;min-width:0}
.rider-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.rider-bike{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rider-points{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--accent)}

/* ===== POINTS BAR ===== */
.points-bar{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;
}
.points-level{flex:1}
.points-label{font-size:11px;color:var(--text2);margin-bottom:6px}
.points-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.points-fill{
  height:100%;
  background:linear-gradient(90deg,#00d4ff,#a855f7,#00e676);
  background-size:200% 100%;
  border-radius:3px;
  transition:width 1.5s cubic-bezier(0.4,0,0.2,1);
  animation:pointsShimmer 3s ease infinite;
}
@keyframes pointsShimmer{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.points-value{font-weight:900;font-size:18px;color:var(--accent);text-shadow:0 0 16px var(--glow)}

/* ===== CHALLENGE CARD ===== */
.challenge-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:10px;
  position:relative;overflow:hidden;
  transition:var(--transition);
}
.challenge-card::before{
  content:'';position:absolute;top:0;left:0;
  width:4px;height:100%;
  background:linear-gradient(180deg,#00d4ff,#a855f7,#00e676);
}
.challenge-card:hover{
  border-color:rgba(255,59,59,0.3);
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.challenge-title{font-weight:800;font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.challenge-desc{font-size:12px;color:var(--text2);margin-bottom:12px}
.challenge-progress{display:flex;align-items:center;gap:10px}
.challenge-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.challenge-fill{
  height:100%;
  background:linear-gradient(90deg,#00d4ff,#a855f7);
  border-radius:3px;
  transition:width 0.6s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 0 8px var(--glow);
}
.challenge-points{font-size:12px;font-weight:800;color:var(--accent)}

/* ===== BADGE DISPLAY ===== */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 10px;
  text-align:center;
  transition:var(--transition);
}
.badge-item.earned{
  border-color:var(--accent);
  background:linear-gradient(135deg,rgba(255,59,59,0.1),rgba(255,107,53,0.05));
  box-shadow:0 0 20px rgba(255,59,59,0.1);
  animation:badgeEarned 0.5s ease;
}
@keyframes badgeEarned{
  0%{transform:scale(0.8);opacity:0}
  50%{transform:scale(1.1)}
  100%{transform:scale(1);opacity:1}
}
@keyframes audioPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,68,68,0.4)}50%{transform:scale(1.05);box-shadow:0 0 0 10px rgba(255,68,68,0)}}
@keyframes mediaFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes likeBurst{0%{transform:scale(1)}30%{transform:scale(1.08)}60%{transform:scale(0.96)}100%{transform:scale(1)}}
.like-burst{animation:likeBurst 0.5s ease-out}
.badge-icon{font-size:32px;margin-bottom:8px}
.badge-name{font-size:11px;font-weight:700;line-height:1.3}

/* ===== RANKING ===== */
.rank-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:6px;
  transition:var(--transition);
}
.rank-item:hover{
  border-color:rgba(255,59,59,0.3);
  transform:translateX(4px);
}

/* ===== NEWS ===== */
.news-card{
  background:linear-gradient(135deg,rgba(255,59,59,0.08),rgba(255,107,53,0.05));
  border:1px solid rgba(255,68,68,0.25);
  border-radius:var(--radius);
  cursor:pointer;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  display:flex;
  gap:12px;
  padding:12px;
  text-decoration:none;
  color:inherit;
  align-items:flex-start;
  position:relative;
  overflow:hidden;
}
.news-card::before{
  content:'';
  position:absolute;
  top:0;left:0;
  width:3px;
  height:100%;
  background:linear-gradient(180deg,#ff4444,#ff8800,#ffaa00);
  border-radius:3px 0 0 3px;
}
.news-card::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,59,59,0.06),rgba(255,107,53,0.04));
  opacity:0;
  transition:opacity 0.3s;
  pointer-events:none;
}
.news-card:hover{
  border-color:rgba(255,68,68,0.5);
  transform:translateY(-3px) scale(1.01);
  box-shadow:0 8px 32px rgba(255,59,59,0.25),0 0 20px rgba(255,107,53,0.15);
}
.news-card:hover::after{opacity:1}
.news-card-img{
  width:70px;
  height:56px;
  object-fit:cover;
  border-radius:8px;
  flex-shrink:0;
  display:block;
  border:1px solid rgba(255,255,255,0.1);
  transition:transform 0.3s, box-shadow 0.3s;
}
.news-card:hover .news-card-img{
  transform:scale(1.05);
  box-shadow:0 4px 16px rgba(255,59,59,0.3);
}
.news-card-body{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.news-card-title{
  font-size:13px;
  font-weight:700;
  color:var(--text);
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  transition:color 0.2s;
}
.news-card:hover .news-card-title{color:#fff}
.news-card-desc{
  font-size:12px;
  color:var(--text2);
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.news-card-meta{
  font-size:11px;
  color:var(--text2);
  margin-top:auto;
  display:flex;
  align-items:center;
  gap:6px;
}
.news-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 8px;
  border-radius:20px;
  font-size:9px;
  font-weight:700;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;
  box-shadow:0 0 8px rgba(255,59,59,0.3);
  animation:pulseBadge 2s ease-in-out infinite;
}
@keyframes pulseBadge{
  0%,100%{box-shadow:0 0 8px rgba(255,59,59,0.3)}
  50%{box-shadow:0 0 16px rgba(255,59,59,0.5)}
}
.news-loading,.news-error{
  text-align:center;
  padding:20px;
  font-size:13px;
  color:var(--text2);
}
.news-section .news-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.rank-num{
  width:30px;height:30px;border-radius:50%;
  background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;color:var(--text2);
}
.rank-num.gold{
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#000;
  box-shadow:0 0 16px rgba(251,191,36,0.4);
}
.rank-num.silver{
  background:linear-gradient(135deg,#e5e7eb,#9ca3af);
  color:#000;
  box-shadow:0 0 12px rgba(229,231,235,0.3);
}
.rank-num.bronze{
  background:linear-gradient(135deg,#b45309,#92400e);
  color:#fff;
  box-shadow:0 0 12px rgba(180,83,9,0.3);
}

/* ===== CHAT ===== */
.chat-message{margin-bottom:10px;display:flex;gap:8px;animation:msgIn 0.3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}}
.chat-message.mine{flex-direction:row-reverse}
.chat-bubble{
  max-width:75%;padding:10px 14px;
  border-radius:18px;font-size:13px;line-height:1.4;
  word-break:break-word;
}
.chat-message:not(.mine) .chat-bubble{
  background:var(--surface2);
  border-bottom-left-radius:4px;
}
.chat-message.mine .chat-bubble{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border-bottom-right-radius:4px;
  box-shadow:0 4px 16px var(--glow);
}
.chat-input-bar{
  position:fixed;bottom:72px;left:0;right:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:10px 12px;
  display:flex;gap:10px;align-items:center;
}
.chat-input-bar input{
  flex:1;padding:10px 16px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);font-size:13px;
  transition:var(--transition);
}
.chat-input-bar input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,59,59,0.1);
}
.chat-input-bar button{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border:none;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px var(--glow);
  transition:var(--transition);
}
.chat-input-bar button:hover{
  transform:scale(1.05);
  box-shadow:0 6px 24px var(--glow2);
}
.chat-input-bar button:active{transform:scale(0.95)}

/* ===== SPLASH ===== */
.splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
}
.splash-logo{
  width:90px;height:90px;border-radius:50%;
  animation:splashPulse 1.8s ease-in-out infinite;
  box-shadow:0 0 60px rgba(255,32,32,0.4),0 0 100px rgba(255,59,59,0.2);
}
@keyframes splashPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 60px var(--glow)}
  50%{transform:scale(1.08);box-shadow:0 0 80px var(--glow2)}
}
.splash-text{
  font-size:22px;font-weight:900;
  background:linear-gradient(135deg,#ff2020,#ff6600,#ff0033);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradientShift 3s ease infinite;
}
.splash-bar{
  width:140px;height:4px;
  background:var(--surface2);
  border-radius:2px;overflow:hidden;
}
.splash-bar::after{
  content:'';display:block;
  width:50%;height:100%;
  background:linear-gradient(90deg,#00d4ff,#a855f7,#00e676);
  background-size:200% 100%;
  border-radius:2px;
  animation:loadingBar 1.5s ease-in-out infinite;
}
@keyframes loadingBar{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(300%)}
}

/* ===== ADMIN PANEL ===== */
.admin-section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:16px;overflow:hidden;
}
.admin-section-header{
  padding:14px 16px;
  font-weight:700;font-size:14px;
  background:var(--surface2);
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;
  transition:var(--transition);
}
.admin-section-header:hover{color:var(--accent)}
.admin-list{padding:8px}
.admin-list-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 8px;border-radius:8px;
  transition:var(--transition);
}
.admin-list-item:hover{background:var(--surface2)}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* ===== TAB BAR ===== */
.tab-bar{
  display:flex;gap:4px;margin-bottom:16px;
  background:var(--surface);
  padding:4px;border-radius:var(--radius);
  border:1px solid var(--border);
}
.tab{
  flex:1;padding:9px;text-align:center;font-size:12px;font-weight:700;
  border-radius:var(--radius-sm);color:var(--text2);
  cursor:pointer;transition:var(--transition);
  border:none;background:none;
}
.tab.active{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;
  box-shadow:0 2px 12px var(--glow);
}

/* ===== STAT ROW ===== */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;text-align:center;
  transition:var(--transition);
}
.stat-box:hover{
  border-color:rgba(255,59,59,0.3);
  box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
.stat-val{
  font-size:24px;font-weight:900;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradientShift 4s ease infinite;
}
.stat-lbl{font-size:10px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:60px 24px;color:var(--text2)}
.empty-icon{font-size:56px;margin-bottom:14px;opacity:0.25}
.empty-title{font-size:16px;font-weight:700;color:var(--text2);margin-bottom:6px}

/* ===== LOGIN ===== */
.login-page{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
}
.login-logo{
  width:90px;height:90px;border-radius:16px;
  object-fit:cover;
  margin-bottom:20px;
  box-shadow:0 0 30px rgba(255,32,32,0.4);
}
.login-title{font-size:24px;font-weight:900;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:32px}
.login-form{width:100%;max-width:380px}

/* ===== ROUTE CREATOR ===== */
.route-stop{display:flex;align-items:center;gap:10px;padding:8px 0}
.stop-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);flex-shrink:0;transition:var(--transition)}
.stop-dot.start{border-color:var(--success);background:var(--success);box-shadow:0 0 10px rgba(0,230,118,0.4)}
.stop-dot.end{border-color:var(--danger);background:var(--danger);box-shadow:0 0 10px var(--glow)}
.stop-input{
  flex:1;padding:10px 14px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:13px;
  transition:var(--transition);
}
.stop-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,59,59,0.1);
}

/* ===== PAGE TABS ===== */
.page-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.page-tab{
  padding:8px 16px;border-radius:20px;
  font-size:12px;font-weight:700;
  white-space:nowrap;
  border:1px solid var(--border);
  background:var(--surface);color:var(--text2);
  cursor:pointer;transition:var(--transition);
}
.page-tab.active{
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border-color:transparent;
  box-shadow:0 2px 12px var(--glow);
}

/* ===== NOTIFICATION TOAST ===== */
.toast{
  position:fixed;bottom:88px;left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px 24px;font-size:13px;font-weight:600;
  z-index:3000;opacity:0;transition:0.4s cubic-bezier(0.4,0,0.2,1);
  pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}
.toast.warning{border-color:var(--warning);color:var(--warning)}

/* ===== FLOATING ACTION ===== */
.fab{
  position:fixed;bottom:88px;right:16px;
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,#ff2020,#ff6600);
  color:#fff;border:none;
  font-size:24px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px var(--glow);
  transition:var(--transition);
  z-index:900;
}
.fab:hover{
  transform:scale(1.1);
  box-shadow:0 8px 32px var(--glow2);
}
.fab:active{transform:scale(0.95)}

/* ===== PROGRESS CIRCULAR ===== */
.progress-ring{
  transform:rotate(-90deg);
}
.progress-ring-circle{
  transition:stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1);
  stroke-linecap:round;
}

/* ===== SHIMMER LOADING ===== */
.shimmer{
  background:linear-gradient(90deg,
    var(--surface) 0%,
    var(--surface2) 50%,
    var(--surface) 100%);
  background-size:200% 100%;
  animation:shimmer 1.5s ease infinite;
}
@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ===== GLOW TEXT ===== */
.glow-text{
  text-shadow:0 0 20px var(--glow),0 0 40px rgba(255,59,59,0.2);
}

/* ===== PULSE DOT ===== */
.pulse-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px var(--glow);
  animation:pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.5);opacity:0.5}
}

/* ===== RESPONSIVE ===== */
@media(max-width:380px){

// Locked = B&W, desaturated, no glow
// Earned = full color with glow effect
function getBadgeSvg(badge, earned) {
  const img = BADGE_IMAGES[badge.id];
  if (!img) return '';
  if (earned) {
    const [c1, c2] = (badge.svgGradient||'#ff4444|#ff8800').split('|');
    return `<div style="
      width:64px;height:64px;display:flex;align-items:center;justify-content:center;
      border-radius:50%;
      background:radial-gradient(circle, ${c1}33 0%, transparent 70%);
      box-shadow:0 0 12px ${c1}aa, 0 0 4px ${c2}aa, inset 0 0 6px rgba(255,255,255,0.1);
      animation:badgeEarned 0.5s ease-out;
    "><img src="${img.color}" loading="lazy" style="width:56px;height:56px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4))" alt="${badge.name}"></div>`;
  } else {
    return `<div style="
      width:64px;height:64px;display:flex;align-items:center;justify-content:center;
      border-radius:50%;
      background:radial-gradient(circle, #1a1a1a 0%, transparent 70%);

let _placeSearchTimeout = null;

// Promise-based: returns { local, online } directly — no callback needed
async function searchPlaces(query) {
  if (!query || query.length < 2) return { local: [], online: [] };
  const q = query.toLowerCase();

  // 1. Search local saved places first (instant)
  const local = STATE.places.filter(p =>
    p.name.toLowerCase().includes(q) ||
    (p.address && p.address.toLowerCase().includes(q)) ||
    p.category.toLowerCase().includes(q)
  ).slice(0, 5);

  // 2. Search Panama POIs database (local JSON, instant)
  let panamaPOIs = [];
  if (PANAMA_POIS.length) {
    panamaPOIs = PANAMA_POIS.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.address && p.address.toLowerCase().includes(q)) ||
      p.category.toLowerCase().includes(q) ||
      (p.subcategory && p.subcategory.toLowerCase().includes(q))
    ).slice(0, 8);
  }

  // 3. Nominatim API (online search)
  let online = [];
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Panama')}&limit=5&addressdetails=1`,
      { headers: { 'Accept-Language': 'es' } }
    );
    const data = await res.json();
    online = (data || []).map(item => ({
      id: 'online_' + item.place_id,
      name: item.display_name.split(',')[0],
      fullName: item.display_name,
      category: item.type || 'lugar',
      lat: parseFloat(item.lat),
      lng: parseFloat(item.lon),
      address: item.display_name,
      icon: _categoryIcon(item.type || 'lugar'),
      isOnline: true
    }));
  } catch(e) {}
  return { local, panamaPOIs, online };
}

function savePlace(place) {
  // Avoid duplicates by lat/lng proximity
  const exists = STATE.places.find(p =>
    Math.abs(p.lat - place.lat) < 0.0005 &&
    Math.abs(p.lng - place.lng) < 0.0005
  );
  if (!exists) {
    place.id = Date.now() % 1000000;
    STATE.places.push(place);
    ls('bs_places', STATE.places);
  }
}

// ============================================================
// BADGE SYSTEM — stats-based evaluation
// ============================================================
function getUserStats(userId) {
  if (!userId) return {};
  if (STATE.userStats[userId]) return STATE.userStats[userId];

  const u = STATE.users.find(x => x.id === userId);
  const rides = STATE.attendance.filter(a => a.user_id === userId).length;
  const routes_created = STATE.routes.filter(r => r.created_by === userId).length;
  const photos = STATE.posts.filter(p => p.user_id === userId && p.image_url).length;
  const chat_messages = STATE.chatMessages.filter(m => m.user_id === userId).length;
  const posts = STATE.posts.filter(p => p.user_id === userId).length;
  const photos_total = photos + posts; // approximation
  const total_km = STATE.routes.filter(r => r.created_by === userId).reduce((acc, r) => {
    // Estimate km: Haversine distance start-end
    if (!r.start_lat || !r.end_lat) return acc;
    const R = 6371;
    const dLat = (r.end_lat - r.start_lat) * Math.PI / 180;
    const dLng = (r.end_lng - r.start_lng) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(r.start_lat*Math.PI/180)*Math.cos(r.end_lat*Math.PI/180)*Math.sin(dLng/2)**2;
    const c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    return acc + R * c;
  }, 0);

  // Streak: consecutive days with any activity
  const allDates = new Set();
  STATE.attendance.filter(a => a.user_id === userId).forEach(a => allDates.add(a.date));
  STATE.chatMessages.filter(m => m.user_id === userId).forEach(m => allDates.add(m.created_at ? m.created_at.split(' ')[0] : null));
  STATE.posts.filter(p => p.user_id === userId).forEach(p => allDates.add(p.created_at ? p.created_at.split(' ')[0] : null));
  allDates.delete(null);
  const sortedDates = [...allDates].sort();
  let streak = 0, streakCount = 0;
  const today = new Date().toISOString().split('T')[0];
  if (sortedDates.length > 0) {
    const lastDate = new Date(sortedDates[sortedDates.length - 1]);
    const diff = (new Date(today) - lastDate) / 86400000;
    if (diff <= 1) {
      streakCount = 1;
      for (let i = sortedDates.length - 2; i >= 0; i--) {
        const d = new Date(sortedDates[i]);
        const diff2 = (new Date(sortedDates[i+1]) - d) / 86400000;
        if (diff2 === 1) streakCount++;
        else break;
      }
      streak = streakCount;
    }
  }

  const joinDate = u?.created_at ? new Date(u.created_at) : new Date();
  const daysActive = Math.floor((new Date() - joinDate) / 86400000);

  const stats = {
    rides, routes_created, photos: photos_total, chat_messages,
    total_km: Math.round(total_km),
    days_active: daysActive,
    streak,
    events: rides,
    posts: STATE.posts.filter(p => p.user_id === userId).length,
    // New stats — track via user record (admin can set), default 0
    early_bird: u?.stats?.early_bird || 0,
    night_owl: u?.stats?.night_owl || 0,
    founding: u?.stats?.founding || 0,
    mentor: u?.stats?.mentor || 0,
  };
  STATE.userStats[userId] = stats;
  return stats;
}

// ============================================================
// WEEKLY WALL OF FAME
// ============================================================
function getWeekStart() {
  const now = new Date();
  const day = now.getDay(); // 0=Sun, 1=Mon, ...
  const diff = day === 0 ? 6 : day - 1; // Monday = start of week
  const mon = new Date(now);
  mon.setDate(now.getDate() - diff);
  mon.setHours(0,0,0,0);
  return mon;
}

function getWeeklyRankings() {
  const weekStart = getWeekStart();
  const weekStartStr = weekStart.toISOString().slice(0,10);

  // Accumulators: userId -> { km, likes, photos }
  const acc = {};

  // Posts likes received this week
  STATE.posts.forEach(p => {
    if (!p.created_at) return;
    const postDate = p.created_at.slice(0,10);
    if (postDate < weekStartStr) return;
    const likeCount = (p.likes || []).length;
    if (likeCount === 0) return;
    if (!acc[p.user_id]) acc[p.user_id] = { km:0, likes:0, photos:0 };
    acc[p.user_id].likes += likeCount;
  });

  // Posts with photos this week
  STATE.posts.forEach(p => {
    if (!p.created_at) return;
    const postDate = p.created_at.slice(0,10);
    if (postDate < weekStartStr) return;
    if (!p.image_url) return;
    if (!acc[p.user_id]) acc[p.user_id] = { km:0, likes:0, photos:0 };
    acc[p.user_id].photos++;
  });

  // Build rankings
  const kmRanking = Object.entries(acc)
    .map(([uid, data]) => ({ user_id: parseInt(uid), km: data.km }))
    .sort((a,b) => b.km - a.km);
  const likesRanking = Object.entries(acc)
    .map(([uid, data]) => ({ user_id: parseInt(uid), likes: data.likes }))
    .sort((a,b) => b.likes - a.likes);
  const photosRanking = Object.entries(acc)
    .map(([uid, data]) => ({ user_id: parseInt(uid), photos: data.photos }))
    .sort((a,b) => b.photos - a.photos);

  return {
    km: kmRanking[0] || null,
    likes: likesRanking[0] || null,
    photos: photosRanking[0] || null
  };
}

function evaluateUserBadges(userId) {
  if (!userId) return;
  const stats = getUserStats(userId);
  const newBadges = [];

  STATE.badges.forEach(badge => {
    const current = STATE.userBadges.find(ub => ub.user_id === userId && ub.badge_id === badge.id);
    let value = stats[badge.stat_type] || 0;

    if (badge.stat_type === 'admin_award') {
      value = STATE.users.find(u => u.id === userId)?.is_distinguished ? 1 : 0;
    }

    const earned = value >= badge.threshold;

    if (earned && !current) {
      STATE.userBadges.push({
        user_id: userId,
        badge_id: badge.id,
        earned_at: new Date().toISOString(),
        stat_value: value
      });
      newBadges.push(badge);
    } else if (earned && current) {
      // Update stat value
      current.stat_value = value;
    } else if (!earned && current) {
      // Remove if no longer qualifies
      STATE.userBadges = STATE.userBadges.filter(ub => !(ub.user_id === userId && ub.badge_id === badge.id));
    }
  });

  if (newBadges.length > 0) {
    const totalBonus = newBadges.reduce((acc, b) => acc + b.points_bonus, 0);
    const u = STATE.users.find(u => u.id === userId);
    if (u) {
      const oldLevel = levelNum(u.points || 0);
      u.points = (u.points || 0) + totalBonus;
      const newLevel = levelNum(u.points);
      saveState();
      if (userId === STATE.user?.id) {
        toast(`🏅 +${newBadges.length} insignia(s)! +${totalBonus} pts`);
        newBadges.forEach(b => bsNotifyMe('🏅 ¡Insignia ganada!', b.name + ' · +' + b.points_bonus + ' pts'));
        if (newLevel > oldLevel) {
          bsNotifyMe('⬆️ ¡Subiste de nivel!', '¡Ahora eres ' + levelOf(u.points).name + '! 🎉');
        }
      }
    }
  }
}

function evaluateAllBadges() {
  STATE.users.forEach(u => evaluateUserBadges(u.id));
}

function recalculateUserStats(userId) {
  delete STATE.userStats[userId];
  getUserStats(userId);
  evaluateUserBadges(userId);
}

function renderPlaceDropdown(results, containerId, onSelect) {
  const container = document.getElementById(containerId);
  if (!container) return;

    container.style.display = 'none';

function hidePlaceDropdown(containerId) {
  const container = document.getElementById(containerId);

}

function setupPlaceSearch(inputId, containerId, onSelect) {
  const input = document.getElementById(inputId);
  if (!input) return;
  input.addEventListener('input', function() {
    clearTimeout(_placeSearchTimeout);
    const val = this.value.trim();
    if (val.length < 2) { hidePlaceDropdown(containerId); return; }
    _placeSearchTimeout = setTimeout(async () => {
      const { local, panamaPOIs, online } = await searchPlaces(val);
      const all = [...local, ...panamaPOIs, ...online.filter(o => !local.find(l => Math.abs(l.lat - o.lat) < 0.001 && Math.abs(l.lng - o.lng) < 0.001))];
      renderPlaceDropdown(all.slice(0, 8), containerId, p => {
        input.value = p.name;
        onSelect(p);
      });
    }, 100);
  });
  input.addEventListener('blur', () => setTimeout(() => hidePlaceDropdown(containerId), 200));
  input.addEventListener('focus', () => { if (input.value.trim().length >= 2) input.dispatchEvent(new Event('input')); });
}

function setupPlaceSearchOnModal(container) {
  container.querySelectorAll('[data-place-search]').forEach(function(input) {
    const id = input.id;
    const containerId = id + '-dropdown';
    // Create dropdown on body so it's never clipped by modal overflow
    const dropdown = document.createElement('div');
    dropdown.id = containerId;
    dropdown.style.cssText = 'position:fixed;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);z-index:99999;max-height:200px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.4);display:none;width:300px';
    document.body.appendChild(dropdown);

    // Position dropdown below input on input/focus/scroll
    function positionDropdown() {
      const rect = input.getBoundingClientRect();
      dropdown.style.left = rect.left + 'px';
      dropdown.style.top = rect.bottom + 2 + 'px';
      dropdown.style.width = Math.max(rect.width, 250) + 'px';
    }
    input.addEventListener('focus', positionDropdown);
    input.addEventListener('input', positionDropdown);
    window.addEventListener('scroll', positionDropdown, true);
    window.addEventListener('resize', positionDropdown);

    const stopPrefix = id.replace('ps-', '');
    setupPlaceSearch(id, containerId, function(place) {
      // Fill coords
      const latInput = document.getElementById(stopPrefix + '-lat');
      const lngInput = document.getElementById(stopPrefix + '-lng');
      if (latInput) latInput.value = place.lat;
      if (lngInput) lngInput.value = place.lng;
      // Save to local DB
      savePlace(place);
      toast(place.isOnline ? 'Lugar guardado en EVA Lube 📍' : 'Lugar seleccionado');
    });
  });
}

function ls(key, val) {

    console.warn('[BS] localStorage error for key:', key, e.message);
  }
  return val;
}

function avatarText(name) {

// Render user avatar HTML — checks dedicated bs_avatar key first, then user object
function renderAvatar(user, size, style) {
  const c1 = avatarColor(user.id);
  const c2 = avatarColor((user.id || 0) + 1);
  style = style || '';
  // Priority: HV cache > localStorage (current user) > user object > initials
  const hvPic = _hvAvatarCache[user.id];
  const savedAvatar = (user.id === STATE.user?.id) ? getAvatar() : null;
  const pic = hvPic || savedAvatar || user.avatar || user.profile_pic;
  if (pic) {
    const src = pic.startsWith('data:') ? pic : (pic + '?t=' + Date.now());
    const fallback = `<div style="width:${size}px;height:${size}px;border-radius:50%;background:linear-gradient(135deg,${c1},${c2});display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:${Math.round(size*0.38)}px;overflow:hidden;flex-shrink:0">${avatarText(user.username)}</div>`;
    return `<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;flex-shrink:0;${style}"><img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.parentElement.innerHTML='${fallback}'"></div>`;
  }
  // Kick off async HeyValue fetch for next render (non-blocking)
  if (user.id && HV.user && HV.pass && !_hvAvatarCache[user.id]) {
    loadAvatarFromHV(user.id).then(url => {
      if (url) applyAvatarToUI(url, user.id);
    }).catch(() => {});
  }
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:linear-gradient(135deg,${c1},${c2});display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:${Math.round(size*0.38)}px;overflow:hidden;flex-shrink:0;${style}">${avatarText(user.username)}</div>`;
}

// Read a File object and return data URL via Promise
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// Read a Blob/File and return data URL via Promise
function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

// Dedicated avatar storage — separate from STATE to avoid localStorage quota issues
function saveAvatar(dataUrl) {

function getAvatar() {

// ── Avatar cloud sync — load profile photos from HeyValue (like Gram feed) ──────
const _hvAvatarCache = {};
async function loadAvatarFromHV(userId) {
  if (_hvAvatarCache[userId]) return _hvAvatarCache[userId];
  if (!HV.user || !HV.pass) return null;
  const path = '/BikerApp/profiles/' + userId + '/avatar.jpg';
  const url = HV.url + '/nc' + path;
  try {
    const res = await fetch(url, { headers: { Authorization: 'Basic ' + btoa(HV.user + ':' + HV.pass) } });
    if (!res.ok) return null;
    const blob = await res.blob();
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => { _hvAvatarCache[userId] = e.target.result; resolve(e.target.result); };
      reader.readAsDataURL(blob);
    });
  } catch(e) { return null; }
}

// Sube el avatar a la nube CREANDO antes las carpetas. WebDAV exige que el
// directorio exista; sin el MKCOL de la carpeta del usuario, el PUT daba 404 y
// por eso la foto no se guardaba en la nube ni la veían los demás miembros.
async function uploadAvatarToHV(userId, dataUrl) {
  if (!HV.user || !HV.pass || !userId || !dataUrl) return false;
  try {
    await hvRequest('MKCOL', '/BikerApp');
    await hvRequest('MKCOL', '/BikerApp/profiles');
    await hvRequest('MKCOL', '/BikerApp/profiles/' + userId);
    const blob = dataURLtoBlob(dataUrl);
    const res = await fetch(HV.url + '/nc/BikerApp/profiles/' + userId + '/avatar.jpg', {
      method: 'PUT',
      headers: { Authorization: 'Basic ' + btoa(HV.user + ':' + HV.pass), 'Content-Type': blob.type || 'image/jpeg' },
      body: blob
    });
    const ok = res.ok || res.status === 201 || res.status === 204;
    if (ok) _hvAvatarCache[userId] = dataUrl;
    return ok;
  } catch (e) { console.warn('[BS] subida de avatar falló:', e); return false; }
}

// Auto-reparación: si tengo avatar guardado localmente pero en la nube falta
// (subida previa fallida por el bug de la carpeta), lo sube ahora.

}

// Stash the picked file in a module-level var; only persists when user taps "Guardar sí"
var _pendingProfilePic = null; // { dataUrl, rawFile }

async function previewProfilePic(e) {
  const file = e.target.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  e.target.value = '';
  const sizeMB = (file.size / 1024 / 1024).toFixed(1);
  toast(`Procesando foto (${sizeMB}MB)...`);
  try {
    let dataUrl = await compressImage(file, 256, 0.7);
    if (!dataUrl) dataUrl = await fileToDataUrl(file);
    if (dataUrl.length > 800 * 1024) dataUrl = await compressImage(file, 200, 0.6) || dataUrl;
    if (dataUrl.length > 800 * 1024) dataUrl = await compressImage(file, 150, 0.5) || dataUrl;

    _pendingProfilePic = { dataUrl, rawFile: file };

    // Show preview + reveal Save/Cancel buttons
    const display = document.getElementById('profile-pic-display');
    if (display) {
      display.innerHTML = `<img src="${dataUrl}" style="width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;border:3px solid #ff4444">`;
    }
    const actions = document.getElementById('profile-pic-actions');
    if (actions) actions.style.display = 'flex';
    toast('Foto lista — toca Guardar sí para confirmar');
  } catch(err) {
    console.error('[BS] Preview failed:', err);
    toast('❌ Error al procesar foto: ' + err.message);
  }
}

async function confirmSaveProfilePic() {
  if (!_pendingProfilePic) {
    toast('No hay foto pendiente');
    return;
  }
  const { dataUrl } = _pendingProfilePic;
  toast('💾 Guardando foto...');
  try {
    // 1. Save to dedicated localStorage key (the source of truth)
    saveAvatar(dataUrl);
    // 2. Update STATE so any current renders show it
    applyAvatarToUI(dataUrl);
    // 3. Persist the session so the avatar survives a refresh
    try {
      const session = ls('bs_session');
      if (session && session.id === STATE.user.id) {
        session.avatar = dataUrl;
        session.profile_pic = dataUrl;
        ls('bs_session', session);
      }
    } catch(e) { /* ignore */ }
    // 4. Save user data (avatar) to localStorage so it loads on next visit
    try {
      const idx = STATE.users.findIndex(u => u.id === STATE.user.id);
      if (idx >= 0) {
        STATE.users[idx].avatar = dataUrl;
        STATE.users[idx].profile_pic = dataUrl;
        STATE.user.avatar = dataUrl;
        STATE.user.profile_pic = dataUrl;
        ls('bs_users', STATE.users);
      }
    } catch(e) { console.warn('[BS] Could not save users list:', e); }
    // 5. Subir a la nube creando la carpeta del usuario (antes fallaba con 404
    //    porque no se creaba /BikerApp/profiles/<id>/ antes del PUT).
    let cloudOk = false;
    if (HV.user && HV.pass) {
      cloudOk = await uploadAvatarToHV(STATE.user.id, dataUrl);
      if (!cloudOk) console.warn('[BS] avatar no subió a la nube; queda local y se reintenta luego');
    }
    _pendingProfilePic = null;
    // Hide buttons, restore normal display
    const actions = document.getElementById('profile-pic-actions');
    if (actions) actions.style.display = 'none';
    const display = document.getElementById('profile-pic-display');
    if (display) {
      const u = STATE.user;
      display.innerHTML = renderAvatar(u, 96);
    }
    toast(cloudOk ? '✅ Foto de perfil actualizada' : '✅ Guardada (se sincronizará al reconectar)');
    // Re-render profile to make sure all references are fresh
    if (typeof renderProfile === 'function') renderProfile();
  } catch(err) {
    console.error('[BS] Save failed:', err);
    toast('❌ Error al guardar: ' + err.message);
  }
}
