// Apply avatar URL to all visible avatar elements without re-rendering the whole page
function applyAvatarToUI(avatarUrl, forUserId) {
  const uid = forUserId || STATE.user?.id;
  if (!uid) return;
  // Update STATE so any future renderProfile() etc. pick it up
  if (uid === STATE.user?.id) {
    STATE.user.avatar = avatarUrl;
    STATE.user.profile_pic = avatarUrl;
  }
  const idx = STATE.users.findIndex(u => u.id === uid);
  if (idx >= 0) { STATE.users[idx].avatar = avatarUrl; STATE.users[idx].profile_pic = avatarUrl; }

  // Patch every avatar img on screen immediately (no re-render needed)
  // We try multiple selectors to cover all possible avatar containers
  const updateSrc = (img) => {
    const src = avatarUrl.startsWith('data:') ? avatarUrl : (avatarUrl + '?t=' + Date.now());
    img.src = src;
    img.onerror = null; // clear old error handler
  };
  document.querySelectorAll('img').forEach(img => {
    // Heuristic: small square images with no alt or with "avatar" context
    const isAvatar = (
      img.closest('[class*="avatar"]') ||
      img.closest('[data-avatar-user]') ||
      (img.style.borderRadius === '50%') ||
      (img.width && img.width <= 80 && img.height && img.height <= 80) ||
      img.parentElement?.style?.borderRadius === '50%' ||
      (img.className && img.className.includes('avatar'))
    );
    if (isAvatar) updateSrc(img);
  });

  // If profile page is visible, re-render it
  const profilePage = document.getElementById('page-profile');
  if (profilePage && profilePage.style.display !== 'none') {
    renderProfile();
  }
}

function dataURLtoBlob(dataUrl) {
  const [header, data] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bytes = atob(data);
  const buf = new ArrayBuffer(bytes.length);
  const arr = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([buf], { type: mime });
}

// ¿El navegador puede codificar WebP? (Android WebView y Chrome modernos sí).
// WebP pesa ~25-35% menos que JPEG a igual calidad => las fotos cargan más
// rápido. Se detecta una sola vez y se cachea.
let _webpSupported = null;
function supportsWebp() {
  if (_webpSupported !== null) return _webpSupported;
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 1;
    _webpSupported = c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  } catch (e) { _webpSupported = false; }
  return _webpSupported;
}

// Comprime una imagen a una dimensión máxima y la recodifica en el formato más
// ligero disponible (WebP > JPEG). Devuelve un data URL, o null si no es imagen.
async function compressImage(file, maxDim = 800, quality = 0.82) {
  if (!file.type.startsWith('image/')) return null;
  const dataUrl = await fileToDataUrl(file);
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        const scale = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // WebP cuando se pueda (más ligero y conserva transparencia); si no,
      // PNG para imágenes con transparencia y JPEG para el resto.
      const fmt = supportsWebp()
        ? 'image/webp'
        : (file.type === 'image/png' ? 'image/png' : 'image/jpeg');
      const out = canvas.toDataURL(fmt, quality);
      resolve(out);
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts.includes(' ') ? ts.replace(' ','T') : ts);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'ahora';
  if (diff < 3600) return Math.floor(diff/60)+'m';
  if (diff < 86400) return Math.floor(diff/3600)+'h';
  return Math.floor(diff/86400)+'d';
}

function levelOf(points) {
  if (points >= 100000) return {name:'Maestro',min:100000,color:'#a855f7',n:5};
  if (points >= 30000) return {name:'Leyenda',min:30000,color:'#f59e0b',n:4};
  if (points >= 10000) return {name:'Avanzado',min:10000,color:'#3b82f6',n:3};
  if (points >= 2000) return {name:'Intermedio',min:2000,color:'#22c55e',n:2};
  return {name:'Novato',min:0,color:'#888',n:1};
}

function levelNum(points) {
  if (points >= 100000) return 5;
  if (points >= 30000) return 4;
  if (points >= 10000) return 3;
  if (points >= 2000) return 2;
  return 1;
}

function nextLevel(points) {
  const lv = levelOf(points);
  const next = [2000,10000,30000,100000,Infinity].find(n => n > points) || Infinity;
  return next;
}

function levelProgress(points) {
  const lv = levelOf(points);
  const next = nextLevel(points);
  if (next === Infinity) return 100;
  return ((points - lv.min) / (next - lv.min)) * 100;
}

function initials(name) {
  return (name || '').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
}

function timeAgo(ts) {
  if (!ts) return '';
  const d = new Date(ts.replace(' ','T'));
  const now = new Date();
  const s = Math.floor((now - d) / 1000);
  if (s < 60) return 'hace ' + s + 's';
  if (s < 3600) return 'hace ' + Math.floor(s/60) + 'm';
  if (s < 86400) return 'hace ' + Math.floor(s/3600) + 'h';
  return 'hace ' + Math.floor(s/86400) + 'd';
}

// ============================================================
// HEYVALUE SYNC
// ============================================================
async function hvRequest(method, path, body) {
  if (!HV.user || !HV.pass) return null;
  const opts = {
    method,
    // 'no-store': el navegador cacheaba posts.json/users.json y servía datos
    // viejos, por eso en otro navegador no aparecían los posts nuevos. Así
    // cada lectura va siempre fresca al servidor.
    cache: 'no-store',
    headers: { Authorization: 'Basic ' + btoa(HV.user + ':' + HV.pass) }
  };
  if (body && typeof body === 'string') {
    opts.headers['Content-Type'] = 'application/octet-stream';
  } else if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  try {
    const r = await fetch(HV.url + '/nc' + path, opts);
    if (r.status === 207) return {ok:true, data: await r.json()};
    if (r.status === 200) {
      const t = await r.text();
      try { return {ok:true, data: JSON.parse(t)}; } 
      catch(_) { return {ok:true, data: t}; }
    }
    if (r.status === 204 || r.status === 201) return {ok:true};
    const t = await r.text();
    return {ok:false, error: t.substring(0,200), status: r.status};
  } catch(e) { return {ok:false, error: e.message}; }
}

async function ensureHVDir(path) {
  await hvRequest('MKCOL', path);
}

async function saveToHV(key, data) {
  const path = '/' + HV.syncKey + '/' + key + '.json';
  await ensureHVDir('/' + HV.syncKey);
  const parts = path.split('/').filter(Boolean);
  let p = '';
  for (const part of parts.slice(0,-1)) {
    p += '/' + part;
    await ensureHVDir(p);
  }
  return hvRequest('PUT', path, data);
}

async function loadFromHV(key) {
  const r = await hvRequest('GET', '/' + HV.syncKey + '/' + key + '.json');
  if (r && r.ok && r.data) return r.data;
  return null;
}

// Versión de los posts segura para la nube: a los que aún tienen la imagen/
// video como dato local (data:/blob:) se les quita la media para NO subir
// archivos pesados ni URLs locales inválidas para otros. La media real se
// completa con su URL https cuando termina la subida en segundo plano.
function cloudSafePosts() {
  return (STATE.posts || []).map(p => {
    const url = p.media_url || p.image_url || '';
    if (url.startsWith('data:') || url.startsWith('blob:')) {
      const { media_url, image_url, ...rest } = p;
      return { ...rest, _pendingMedia: true };
    }
    return p;
  });
}

// Sube SOLO los posts a la nube — rápido y fiable, para publicar al instante.
async function pushPostsToCloud() {
  if (!HV.connected || !HV.user || STATE._cloudSynced === false) return;
  try { await saveToHV('posts', cloudSafePosts()); }
  catch (e) { console.warn('pushPostsToCloud falló:', e && e.message); }
}

async function syncToCloud() {
  if (!HV.user) return;
  STATE.syncStatus = 'syncing';
  const tables = ['users','routes','events','posts','badges','challenges','userChallenges','userBadges','chatChannels','chatMessages','notifications','attendance','comments','follows'];
  await Promise.all(tables.map(t => saveToHV(t, t === 'posts' ? cloudSafePosts() : (STATE[t] || []))));
  await saveToHV('meta', {lastSync: new Date().toISOString(), version: 1});
  STATE.syncStatus = 'synced';
}

async function syncFromCloud(silent) {
  if (!HV.user) return;
  const tables = ['users','routes','events','posts','badges','challenges','userChallenges','userBadges','chatChannels','chatMessages','notifications','attendance','comments','follows'];
  const results = await Promise.all(tables.map(t => loadFromHV(t)));
  let loaded = false;
  tables.forEach((t, i) => {
    const data = results[i];
    if (data && Array.isArray(data)) {
      // Block deleted IDs from being restored (routes + posts + users)
      const deletedRouteIds = STATE._deletedRouteIds || [];
      const deletedPostIds = STATE._deletedIds || [];
      const deletedUserIds = ls('_deletedUsers') || [];
      const blockedIds = new Set([...deletedRouteIds, ...deletedPostIds, ...deletedUserIds]);
      const filtered = data.filter(item => !blockedIds.has(item.id));

      // For users table: block local users not in cloud (deleted from cloud = authoritative)
      if (t === 'users') {
        const cloudIds = new Set(filtered.map(u => u.id));
        const localUsers = (STATE.users || []).filter(u => {
          // Keep: in cloud OR in SEED_USERS (always allow seed users)
          if (cloudIds.has(u.id)) return false; // in cloud, don't add separately
          const inSeed = SEED_USERS.some(s => s.id === u.id);
          return !inSeed; // keep only if not in seed (seed will be added below)
        });
        STATE[t] = [...localUsers, ...filtered];
      } else {
        // Merge by ID: cloud wins for same IDs, keep local-only items
        const cloudMap = new Map(filtered.map(item => [item.id, item]));
        const localOnly = (STATE[t] || []).filter(item => !cloudMap.has(item.id));
        STATE[t] = [...localOnly, ...filtered];
      }
      loaded = true;
    }
  });
  if (loaded) {
    // Clean related data for deleted users
    const deletedUserIds = ls('_deletedUsers') || [];
    if (deletedUserIds.length > 0) {
      const dSet = new Set(deletedUserIds);
      const cleanRelated = (arr, uidField) => arr.filter(item => !dSet.has(item[uidField]));
      STATE.userChallenges = cleanRelated(STATE.userChallenges || [], 'user_id');
      STATE.userBadges = cleanRelated(STATE.userBadges || [], 'user_id');
      STATE.notifications = cleanRelated(STATE.notifications || [], 'user_id').filter(n => !dSet.has(n.actor_id));
      STATE.attendance = cleanRelated(STATE.attendance || [], 'user_id');
      STATE.comments = cleanRelated(STATE.comments || [], 'user_id');
      STATE.follows = STATE.follows || [];
    }
    STATE.users = STATE.users.length ? STATE.users : [...SEED_USERS];
    STATE.badges = STATE.badges.length ? STATE.badges : [...SEED_BADGES];
    STATE.challenges = STATE.challenges.length ? STATE.challenges : [...SEED_CHALLENGES];
    STATE.events = STATE.events.length ? STATE.events : [...SEED_EVENTS];
    // Never restore SEED_ROUTES if routes were deleted (preserve deleted state)
    const hasDeletedRoutes = (STATE._deletedRouteIds || []).length > 0;
    STATE.routes = (!hasDeletedRoutes && STATE.routes.length) ? STATE.routes : (hasDeletedRoutes ? [] : [...SEED_ROUTES]);
    STATE.posts = STATE.posts.length ? STATE.posts : [...SEED_POSTS];
    STATE.chatChannels = STATE.chatChannels.length ? STATE.chatChannels : [...SEED_CHANNELS];
    STATE.chatMessages = STATE.chatMessages.length ? STATE.chatMessages : [...SEED_MESSAGES];
    STATE.userChallenges = STATE.userChallenges || [];
    STATE.userBadges = STATE.userBadges || [];
    STATE.notifications = STATE.notifications || [];
    STATE.attendance = STATE.attendance || [];
    STATE.comments = STATE.comments || [];
    STATE.follows = STATE.follows || [];
    saveLocal();
    if (!silent && STATE.currentPage) renderPage(STATE.currentPage);
  }
}

// ============================================================
// ONLINE PRESENCE — miembros en linea via HeyValue
// ============================================================
let _presenceInterval = null;
const PRESENCE_TIMEOUT_MS = 180000; // 3 min para considerarse "en linea"

async function updatePresence() {
  if (!STATE.user || !HV.user) return;
  try {
    const r = await hvRequest('GET', '/' + HV.syncKey + '/presence.json');
    let list = (r && r.ok && Array.isArray(r.data)) ? r.data : [];
    // Limpiar ids de usuarios que ya no existen
    const validIds = new Set(STATE.users.map(u => u.id));
    list = list.filter(p => validIds.has(p.id));
    // Actualizar o agregar este usuario
    list = list.filter(p => p.id !== STATE.user.id);
    list.push({ id: STATE.user.id, username: STATE.user.username, lastSeen: Date.now() });
    await hvRequest('PUT', '/' + HV.syncKey + '/presence.json', list);
  } catch(e) {}
}

async function loadOnlineCount() {
  const btn = document.getElementById('online-count-btn');
  if (!btn || !STATE.user) { if (btn) btn.innerHTML = ''; return; }
  try {
    const r = await hvRequest('GET', '/' + HV.syncKey + '/presence.json');
    const list = (r && r.ok && Array.isArray(r.data)) ? r.data : [];
    const cutoff = Date.now() - PRESENCE_TIMEOUT_MS;
    const online = list.filter(p => p.lastSeen > cutoff);
    if (online.length > 0) {
      btn.innerHTML = '<span class="online-dot"></span><span>' + online.length + ' en línea</span>';
      btn.title = online.map(p => p.username).join(', ');
    } else {
      btn.innerHTML = '';
    }
  } catch(e) {
    const btn = document.getElementById('online-count-btn');
    if (btn) btn.innerHTML = '';
  }
}

function startPresence() {
  if (_presenceInterval) clearInterval(_presenceInterval);
  updatePresence();
  loadOnlineCount();
  _presenceInterval = setInterval(() => { updatePresence(); loadOnlineCount(); }, 30000);
}

function showOnlineMembers() {
  const list = document.querySelector('#online-members-list');
  if (!list) return;
  // Ya se cargo arriba, solo abre el modal
  openModal('🟢 Miembros en línea', `
    <div id="online-members-list"></div>
  `);
  // Recargar para modal
  (async () => {
    try {
      const r = await hvRequest('GET', '/' + HV.syncKey + '/presence.json');
      const all = (r && r.ok && Array.isArray(r.data)) ? r.data : [];
      const cutoff = Date.now() - PRESENCE_TIMEOUT_MS;
      const online = all.filter(p => p.lastSeen > cutoff).map(p => {
        const u = STATE.users.find(x => x.id === p.id);
        return { ...p, avatar: u ? renderAvatar(u, 28) : '' };
      });
      const el = document.getElementById('online-members-list');
      if (!el) return;
      if (!online.length) {
        el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text3)">No hay nadie en línea</div>';
        return;
      }
      el.innerHTML = online.map(p => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
          ${p.avatar}
          <span style="font-size:14px;font-weight:600">${escHtml(p.username)}</span>
          <span style="margin-left:auto;width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0"></span>
        </div>
      `).join('');
    } catch(e) {
      const el = document.getElementById('online-members-list');
      if (el) el.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text3)">No se pudo cargar</div>';
    }
  })();
}

// ============================================================
// FULL-SCREEN ROUTE MAP PICKER
// ============================================================
var _pickerPoints = []; // {lat, lng, name, type: 'start'|'stop'|'end'}
var _pickerMode = 'start'; // 'start' | 'stop' | 'end'
var _pickerMap = null;
var _pickerMarkers = [];

function openRouteMapPicker(existing) {
  // existing: optional {start, end, stops} to pre-fill
  _pickerPoints = [];
  if (existing) {
    if (existing.start) _pickerPoints.push({ lat: existing.start.lat, lng: existing.start.lng, name: existing.start.name || '', type: 'start' });
    if (existing.stops) existing.stops.forEach(s => _pickerPoints.push({ lat: s.lat, lng: s.lng, name: s.name || '', type: 'stop' }));
    if (existing.end) _pickerPoints.push({ lat: existing.end.lat, lng: existing.end.lng, name: existing.end.name || '', type: 'end' });
  }
  _pickerMode = _pickerPoints.length === 0 ? 'start' : 'stop';

  // Build overlay
  var overlay = document.createElement('div');
  overlay.id = 'route-picker-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:99998;background:var(--bg,#0d0d1a);display:flex;flex-direction:column';
  document.body.appendChild(overlay);

  // Top bar
  var topBar = document.createElement('div');
  topBar.style.cssText = 'flex-shrink:0;display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--surface,#1a1a2e);border-bottom:1px solid var(--border,rgba(255,255,255,0.1))';
  topBar.innerHTML = `
    <button onclick="closeRouteMapPicker()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:18px;padding:4px;line-height:1">✕</button>
    <span style="font-size:15px;font-weight:700;flex:1;text-align:center">Elegir puntos de ruta</span>
    <div style="width:32px"></div>
  `;
  overlay.appendChild(topBar);

  // Instructions
  var instr = document.createElement('div');
  instr.id = 'picker-instr';
  instr.style.cssText = 'flex-shrink:0;padding:8px 16px;background:rgba(255,68,68,0.08);font-size:12px;color:#ff6666;text-align:center';
  overlay.appendChild(instr);

  // Search bar
  var searchBar = document.createElement('div');
  searchBar.style.cssText = 'flex-shrink:0;padding:8px 12px;background:var(--surface,#1a1a2e);border-bottom:1px solid var(--border,rgba(255,255,255,0.06))';
  searchBar.innerHTML = `
    <input id="picker-search" type="text" placeholder="🔍 Buscar gasolinera, restaurante, taller..." style="width:100%;background:var(--card,#252540);border:1px solid var(--border,rgba(255,255,255,0.1));color:var(--text,#e2e2f0);padding:10px 14px;border-radius:10px;font-size:13px;outline:none;box-sizing:border-box">
    <div id="picker-search-results" style="display:none;max-height:180px;overflow-y:auto;margin-top:6px;border-radius:10px;background:var(--card,#252540);border:1px solid var(--border,rgba(255,255,255,0.1))"></div>
  `;
  overlay.appendChild(searchBar);

  // Map container
  var mapDiv = document.createElement('div');
  mapDiv.id = 'picker-map';
  mapDiv.style.cssText = 'flex:1;min-height:0;z-index:1';
  overlay.appendChild(mapDiv);

  // Bottom panel
  var bottom = document.createElement('div');
  bottom.style.cssText = 'flex-shrink:0;padding:12px 16px;background:var(--surface,#1a1a2e);border-top:1px solid var(--border,rgba(255,255,255,0.1))';
  bottom.id = 'picker-bottom';
  overlay.appendChild(bottom);

  document.body.style.overflow = 'hidden';

  // Init map after DOM is ready
  setTimeout(() => {
    if (!window.L) { toast('Error: mapa no disponible'); closeRouteMapPicker(); return; }
    _pickerMap = L.map('picker-map', {zoomControl:true, attributionControl:false}).setView([8.9824, -79.5199], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {subdomains:'abcd', maxZoom:19}).addTo(_pickerMap);

    // Existing point markers
    _pickerPoints.forEach((p, i) => _addPickerMarker(p, i));

    // Tap on map to add point
    _pickerMap.on('click', function(e) {
      _handlePickerTap(e.latlng);
    });

    // POI layer: lugares de la base de datos visibles en el mapa
    loadPanamaPOIs().then(function() { _renderPickerPOIs(); });
    _pickerMap.on('moveend zoomend', _renderPickerPOIs);

    // Setup search
    setupPickerSearch();

    _updatePickerUI();
  }, 50);
}

function _handlePickerTap(latlng) {
  if (_pickerMode === 'done') return;
  var type = _pickerMode;
  var label = type === 'start' ? 'SALIDA' : type === 'stop' ? 'PARADA ' + (_pickerPoints.filter(p=>p.type==='stop').length + 1) : 'DESTINO';
  var color = type === 'start' ? '#22c55e' : type === 'stop' ? '#ff8800' : '#ef4444';
  var icon = type === 'start' ? '🟢' : type === 'stop' ? '🟠' : '🔴';

  var pt = { lat: latlng.lat, lng: latlng.lng, name: '', type: type };

  // Reverse-geocode approximate name
  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`)
    .then(r => r.json())
    .then(d => { pt.name = (d.address?.road || d.address?.neighbourhood || d.address?.suburb || 'Punto ' + _pickerPoints.length); _updatePickerUI(); })
    .catch(() => {});

  _pickerPoints.push(pt);
  _addPickerMarker(pt, _pickerPoints.length - 1);

  if (type === 'start') _pickerMode = 'stop';
  else if (type === 'stop') { /* stay in stop mode */ }
  else if (type === 'end') _pickerMode = 'done';

  _updatePickerUI();
}

function _addPickerMarker(p, idx) {
  var color = p.type === 'start' ? '#22c55e' : p.type === 'stop' ? '#ff8800' : '#ef4444';
  var icon = p.type === 'start' ? 'SALIDA' : p.type === 'stop' ? 'P' + (idx + 1) : 'DEST';
  var label = p.type === 'start' ? 'SALIDA' : p.type === 'stop' ? 'PARADA' : 'DESTINO';
  var div = L.divIcon({className:'', html:`<div style="background:${color};color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">${icon}</div>`});
  var m = L.marker([p.lat, p.lng], {icon:div}).addTo(_pickerMap).bindPopup(label);
  _pickerMarkers.push(m);
}

function _updatePickerUI() {
  var instr = document.getElementById('picker-instr');
  var bottom = document.getElementById('picker-bottom');
  if (!instr || !bottom) return;

  var stops = _pickerPoints.filter(p => p.type === 'stop');
  var hasStart = _pickerPoints.some(p => p.type === 'start');
  var hasEnd = _pickerPoints.some(p => p.type === 'end');
  var canFinish = hasStart && hasEnd;

  // Instruction
  if (_pickerMode === 'start') {
    instr.textContent = '👆 Tocá en el mapa para marcar la SALIDA';
  } else if (_pickerMode === 'stop') {
    instr.textContent = '👆 Tocá para agregar PARADAS (opcional) · Tocá DESTINO cuando termines';
  } else {
    instr.textContent = '✅ Ruta completa — usá los botones de abajo';
  }

  // Bottom panel
  bottom.innerHTML = `
    <div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap">
      ${_pickerPoints.map((p, i) => `
        <div style="display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:600;background:${p.type==='start'?'rgba(34,197,94,0.15)':p.type==='stop'?'rgba(255,136,0,0.15)':'rgba(239,68,68,0.15)'};border:1px solid ${p.type==='start'?'rgba(34,197,94,0.4)':p.type==='stop'?'rgba(255,136,0,0.4)':'rgba(239,68,68,0.4)'};color:${p.type==='start'?'#22c55e':p.type==='stop'?'#ff8800':'#ef4444'}">
          ${p.type==='start'?'🟢':p.type==='stop'?'🟠':'🔴'} ${p.name || p.type.toUpperCase()}
          <button onclick="_removePickerPoint(${i})" style="background:none;border:none;color:inherit;cursor:pointer;font-size:13px;padding:0;margin-left:2px;opacity:0.7">✕</button>
        </div>
      `).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${_pickerMode !== 'done' ? `
        ${_pickerMode === 'stop' && !hasEnd ? `<button onclick="_setPickerModeEnd()" style="padding:10px;border-radius:10px;border:1px solid rgba(239,68,68,0.4);background:rgba(239,68,68,0.1);color:#ef4444;font-size:13px;font-weight:700;cursor:pointer">🔴 Marcar DESTINO</button>` : ''}
        ${_pickerMode === 'stop' ? `<button onclick="_addStopMode()" style="padding:10px;border-radius:10px;border:1px solid rgba(255,136,0,0.4);background:rgba(255,136,0,0.1);color:#ff8800;font-size:13px;font-weight:700;cursor:pointer">🟠 + Parada</button>` : ''}
      ` : ''}
      <button onclick="_undoLastPoint()" style="padding:10px;border-radius:10px;border:1px solid var(--border,rgba(255,255,255,0.1));background:var(--surface2,#252540);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer" ${_pickerPoints.length === 0 ? 'disabled style="opacity:0.4"' : ''}>↩ Deshacer</button>
      <button onclick="_confirmPicker()" style="padding:10px;border-radius:10px;border:none;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:14px;font-weight:700;cursor:pointer" ${!canFinish ? 'disabled style="opacity:0.4"' : ''}>✅ Listo</button>
    </div>
  `;
}

function _removePickerPoint(idx) {
  var p = _pickerPoints[idx];
  if (_pickerMarkers[idx]) { _pickerMap.removeLayer(_pickerMarkers[idx]); _pickerMarkers[idx] = null; }
  _pickerPoints.splice(idx, 1);
  // Recalculate mode
  var hasStart = _pickerPoints.some(p => p.type === 'start');
  var hasEnd = _pickerPoints.some(p => p.type === 'end');
  _pickerMode = !hasStart ? 'start' : !hasEnd ? 'stop' : 'done';
  // Remove all markers and re-add
  _pickerMarkers.forEach(m => { if (m) _pickerMap.removeLayer(m); });
  _pickerMarkers = [];
  _pickerPoints.forEach((pt, i) => _addPickerMarker(pt, i));
  _updatePickerUI();
}

function _undoLastPoint() {
  if (_pickerPoints.length === 0) return;
  _removePickerPoint(_pickerPoints.length - 1);
}

function _setPickerModeEnd() {
  _pickerMode = 'end';
  _updatePickerUI();
}

function _addStopMode() {
  _pickerMode = 'stop';
  _updatePickerUI();
}

function _confirmPicker() {
  var start = _pickerPoints.find(p => p.type === 'start');
  var end = _pickerPoints.find(p => p.type === 'end');
  var stops = _pickerPoints.filter(p => p.type === 'stop');
  if (!start || !end) { toast('Marcá SALIDA y DESTINO'); return; }
  closeRouteMapPicker();

  // Detect form mode: 'rt-' = create, 'ert-' = edit
  var prefix = document.getElementById('rt-start-lat') ? 'rt' : document.getElementById('ert-start-lat') ? 'ert' : 'rt';

  // Fill start
  var startNameEl = document.getElementById(prefix + '-start-name') || document.getElementById(prefix + '-start-selected-name');
  if (startNameEl) startNameEl.textContent = start.name;
  var startLatEl = document.getElementById(prefix + '-start-lat');
  var startLngEl = document.getElementById(prefix + '-start-lng');
  if (startLatEl) startLatEl.value = start.lat.toFixed(6);
  if (startLngEl) startLngEl.value = start.lng.toFixed(6);
  var startSel = document.getElementById(prefix + '-start-selected');
  if (startSel) startSel.style.display = 'flex';
  var startBtn = document.getElementById(prefix + '-start-map-btn');
  if (startBtn) startBtn.style.display = 'none';

  // Fill end
  var endNameEl = document.getElementById(prefix + '-end-name') || document.getElementById(prefix + '-end-selected-name');
  if (endNameEl) endNameEl.textContent = end.name;
  var endLatEl = document.getElementById(prefix + '-end-lat');
  var endLngEl = document.getElementById(prefix + '-end-lng');
  if (endLatEl) endLatEl.value = end.lat.toFixed(6);
  if (endLngEl) endLngEl.value = end.lng.toFixed(6);
  var endSel = document.getElementById(prefix + '-end-selected');
  if (endSel) endSel.style.display = 'flex';
  var endBtn = document.getElementById(prefix + '-end-map-btn');
  if (endBtn) endBtn.style.display = 'none';

  // Fill stops
  var stopsCont = document.getElementById(prefix + '-stops-container');
  if (stopsCont) {
    stopsCont.innerHTML = '';
    stops.forEach((s) => {
      if (prefix === 'rt') addStopField(s.lat, s.lng, s.name);
      else addEditStopField(s.lat, s.lng, s.name);
    });
  }

  toast('✅ Puntos cargados — ' + (stops.length > 0 ? stops.length + ' parada(s)' : 'sin paradas'));
}

function closeRouteMapPicker() {
  if (_pickerMap) { _pickerMap.remove(); _pickerMap = null; }
  var overlay = document.getElementById('route-picker-overlay');
  if (overlay) overlay.remove();
  _pickerMarkers = [];
  _pickerPoints = [];
  _pickerMode = 'start';
  _pickerPOILayer = null;
  _pickerPOIRenderer = null;
  document.body.style.overflow = '';
}

// ============================================================
// POI LAYER — lugares de la DB visibles en el mapa del picker
// (solo agrega una capa de marcadores; no toca los tiles oscuros)
// ============================================================
var _pickerPOILayer = null;
var _pickerPOIRenderer = null;

function _poiCatColor(cat) {
  var m = {
    'Gasolinera':'#ff8800','Restaurante':'#22c55e','Comida rápida':'#facc15',
    'Hospedaje':'#3b82f6','Servicio':'#a855f7','Taller':'#a855f7',
    'Supermercado':'#f97316','Farmacia':'#06b6d4','Tienda':'#f59e0b',
    'Cafeteria':'#d97706','Banco':'#10b981','ATM':'#10b981',
    'Estacionamiento':'#64748b','Parqueo':'#64748b','Policia':'#3b82f6',
    'Hospital':'#ef4444','Centro comercial':'#ec4899','Entretenimiento':'#ec4899'
  };
  return m[cat] || '#94a3b8';
}

function _renderPickerPOIs() {
  if (!_pickerMap || !PANAMA_POIS.length) return;
  if (_pickerPOILayer) { _pickerMap.removeLayer(_pickerPOILayer); _pickerPOILayer = null; }
  var zoom = _pickerMap.getZoom();
  if (zoom < 12) return; // muy alejado: ocultar para no saturar
  var bounds = _pickerMap.getBounds().pad(0.1);
  if (!_pickerPOIRenderer) _pickerPOIRenderer = L.canvas({ padding: 0.3 });
  var layer = L.layerGroup();
  var count = 0, MAX = 400;
  for (var i = 0; i < PANAMA_POIS.length && count < MAX; i++) {
    var p = PANAMA_POIS[i];
    if (!bounds.contains([p.lat, p.lng])) continue;
    var color = _poiCatColor(p.category);
    var mk = L.circleMarker([p.lat, p.lng], {
      renderer: _pickerPOIRenderer,
      radius: zoom >= 15 ? 7 : zoom >= 13 ? 5 : 4,
      fillColor: color, color: 'rgba(255,255,255,0.85)',
      weight: 1, fillOpacity: 0.85
    });
    mk.bindPopup(
      '<div style="min-width:160px;font-size:12px;line-height:1.5">' +
        '<b>' + (p.icon || '📍') + ' ' + escHtml(p.name || 'Lugar') + '</b><br>' +
        '<span style="color:#888">' + escHtml(p.subcategory || p.category || '') + '</span><br>' +
        '<button onclick="_pickerUsePOIIdx(' + i + ')" style="margin-top:6px;width:100%;padding:6px;border:none;border-radius:8px;background:linear-gradient(135deg,#ff4444,#ff8800);color:#fff;font-size:12px;font-weight:700;cursor:pointer">➕ Usar como punto</button>' +
      '</div>'
    );
    layer.addLayer(mk);
    count++;
  }
  _pickerPOILayer = layer.addTo(_pickerMap);
}

function _pickerUsePOIIdx(i) {
  var p = PANAMA_POIS[i];
  if (!p || !_pickerMap) return;
  _pickerMap.closePopup();
  _pickerGoToPOI(p.lat, p.lng, p.name);
}

function setupPickerSearch() {
  var searchInput = document.getElementById('picker-search');
  var resultsDiv = document.getElementById('picker-search-results');
  if (!searchInput || !resultsDiv) return;

  var _searchTimeout = null;
  var _poiMarkers = null;

  searchInput.addEventListener('input', function() {
    clearTimeout(_searchTimeout);
    var q = this.value.trim().toLowerCase();
    _searchTimeout = setTimeout(function() {
      if (q.length < 2) {
        resultsDiv.style.display = 'none';
        if (_poiMarkers && _pickerMap) { _pickerMap.removeLayer(_poiMarkers); _poiMarkers = null; }
        return;
      }
      var norm = function(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); };
      var nq = norm(q);
      var matches = (PANAMA_POIS || []).filter(function(p) {
        return norm(p.name).indexOf(nq) !== -1 ||
               norm(p.subcategory).indexOf(nq) !== -1 ||
               norm(p.category).indexOf(nq) !== -1 ||
               norm(p.address).indexOf(nq) !== -1;
      });
      // Prioridad: nombre que empieza con lo escrito > nombre que lo contiene > resto
      matches.sort(function(a, b) {
        var rank = function(p) {
          var n = norm(p.name);
          return n.indexOf(nq) === 0 ? 0 : n.indexOf(nq) !== -1 ? 1 : 2;
        };
        return rank(a) - rank(b);
      });
      var pois = matches.slice(0, 10);

      if (!pois.length) {
        resultsDiv.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text3);font-size:12px">Sin resultados</div>';
        resultsDiv.style.display = 'block';
        return;
      }

      // Color por categoría (mismas que la capa del mapa)
      var catColor = _poiCatColor;

      resultsDiv.innerHTML = pois.map(function(p) {
        return '<div onclick="_pickerGoToPOI(' + p.lat + ',' + p.lng + ',\'' + escHtml(p.name || 'Lugar').replace(/'/g, "\\'") + '\')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);transition:background 0.15s" onmouseover="this.style.background=\'rgba(255,68,68,0.08)\'" onmouseout="this.style.background=\'\'">' +

          '<div style="flex-shrink:0;font-size:11px;color:var(--text2);background:var(--surface2);padding:3px 8px;border-radius:20px;border:1px solid var(--border)">Tocar para marcar</div>' +
        '</div>';
      }).join('');

      resultsDiv.style.display = 'block';

      // Show markers on map
      if (_poiMarkers && _pickerMap) { _pickerMap.removeLayer(_poiMarkers); }
      _poiMarkers = L.featureGroup();
      pois.forEach(function(p) {
        var icon = L.circleMarker([p.lat, p.lng], {
          radius: 7, fillColor: catColor(p.category), color: '#fff', weight: 1.5, fillOpacity: 0.9
        });
        icon.bindPopup('<div style="min-width:150px;font-size:12px"><b>' + (p.icon||'📍') + ' ' + escHtml(p.name||'Lugar') + '</b><br><span style="color:#888">' + escHtml(p.subcategory||p.category||'') + '</span></div>');
        _poiMarkers.addLayer(icon);
      });
      _pickerMap.addLayer(_poiMarkers);
      if (pois.length === 1) {
        _pickerMap.setView([pois[0].lat, pois[0].lng], 15);
      } else {
        var group = L.featureGroup(_poiMarkers.getLayers());
        _pickerMap.fitBounds(group.getBounds().pad(0.2), {maxZoom: 14});
      }
    }, 150);
  });

  searchInput.addEventListener('focus', function() {
    if (this.value.trim().length >= 2) {
      this.dispatchEvent(new Event('input'));
    }
  });
}

function _pickerGoToPOI(lat, lng, name) {
  // Add as next point in sequence
  _handlePickerTap({ lat: lat, lng: lng });
  // Override name after reverse geocode (or set directly)
  if (_pickerPoints.length > 0) {
    var last = _pickerPoints[_pickerPoints.length - 1];
    last.name = name;
  }
  document.getElementById('picker-search-results').style.display = 'none';
  document.getElementById('picker-search').value = '';
  _updatePickerUI();
}

function isAppInstalled() {
  // Standalone display mode = installed PWA
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.matchMedia('(display-mode: fullscreen)').matches ||
         window.navigator.standalone === true;
}

async function installApp() {
  if (!_installPromptEvent) {

// Handle location updates from background SW sync
function handleBackgroundLocation(lat, lng) {
  if (!STATE.user || _activeRouteId === null) return;
  STATE.userLocation = { lat, lng, updated_at: Date.now() };
  checkAttendanceForActiveRoutes();
}

// Auto-confirm attendance for the currently active route only
function checkAttendanceForActiveRoutes() {
  if (!_activeRouteId || !STATE.userLocation) return;
  const route = STATE.routes.find(r => r.id === _activeRouteId);
  if (!route || !route.start_lat || !route.start_lng) return;

  // Check geofence on start point (300m)
  const distStart = haversineM(STATE.userLocation.lat, STATE.userLocation.lng, parseFloat(route.start_lat), parseFloat(route.start_lng));
  if (distStart <= 300) confirmAttendance(route.id, 'auto', false);

  // Check geofence on destination
  if (route.end_lat && route.end_lng) {
    const distEnd = haversineM(STATE.userLocation.lat, STATE.userLocation.lng, parseFloat(route.end_lat), parseFloat(route.end_lng));
    if (distEnd <= 300) confirmAttendance(route.id, 'auto', true);
  }
}

function haversineM(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function confirmAttendance(routeId, method, isArrival) {
  STATE.attendance = STATE.attendance || [];
  const existing = STATE.attendance.find(a => a.route_id === routeId && a.user_id === STATE.user.id && !!a.is_arrival === !!isArrival);
  if (existing) return; // already confirmed
  STATE.attendance.push({
    id: Date.now() % 100000,
    user_id: STATE.user.id,
    route_id: routeId,
    confirmed_at: new Date().toISOString(),
    method: method || 'manual',
    is_arrival: isArrival || false,
    lat: STATE.userLocation?.lat || null,
    lng: STATE.userLocation?.lng || null
  });
  ls('bs_att', STATE.attendance);
  saveToHV('attendance', STATE.attendance).catch(() => {});
  if (method === 'auto') toast('✅ Asistencia confirmada automaticamente');
}

// Manual check-in: "Estoy aquí" — verifica GPS antes de confirmar
function manualCheckin(routeId) {
  if (!STATE.user) { toast('Inicia sesion primero'); return; }
  if (!navigator.onLine) { toast('Sin conexion — intenta luego'); return; }

  const route = STATE.routes.find(r => r.id === routeId);
  if (!route) { toast('Ruta no encontrada'); return; }

  // Si la ruta no tiene coordenadas de destino, confirmar sin GPS
  if (!route.end_lat || !route.end_lng) {
    confirmAttendance(routeId, 'manual', false);
    renderRutas();
    toast('✅ Asistencia confirmada');
    return;
  }

  // Verificar ubicación GPS real
  if (!navigator.geolocation) {
    toast('⚠️ Tu dispositivo no soporta GPS — confirmando sin verificar ubicacion');
    confirmAttendance(routeId, 'manual', false);
    renderRutas();
    return;
  }

  // Mostrar estado de carga
  const btn = document.getElementById('fab-confirm-btn');
  if (btn) { btn.textContent = '📍 Verificando ubicacion...'; btn.disabled = true; }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const dist = haversineM(
        pos.coords.latitude, pos.coords.longitude,
        parseFloat(route.end_lat), parseFloat(route.end_lng)
      );

      // Restaurar botón
      if (btn) { btn.textContent = '📍 Estoy aquí — Confirmar asistencia'; btn.disabled = false; }

      if (dist <= 300) {
        confirmAttendance(routeId, 'manual', false);
        renderRutas();
        toast('✅ Asistencia confirmada — estas en el punto de encuentro');
      } else if (dist <= 1000) {
        toast('⚠️ Estas a ' + Math.round(dist) + ' metros del destino. Acercate mas para confirmar.');
      } else {
        toast('❌ Estas demasiado lejos (' + Math.round(dist/1000) + ' km). Debes estar en el lugar para confirmar asistencia.');
      }
    },
    err => {
      // Restaurar botón
      if (btn) { btn.textContent = '📍 Estoy aquí — Confirmar asistencia'; btn.disabled = false; }

      if (err.code === 1) {
        toast('⚠️ Permiso de ubicacion denegado. Activa el GPS en tu dispositivo.');
      } else if (err.code === 2) {
        toast('⚠️ No se pudo obtener tu ubicacion. Verifica la señal GPS.');
      } else {
        toast('⚠️ Error al obtener ubicacion. Intenta de nuevo.');
      }
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
  );
}

  }
}

// ── Live Location System ──────────────────────────────────────────────────────
// GPS OFF by default. Activates when:
//   a) AUTO: route date==today AND time <= now <= time+2h
//   b) MANUAL: user taps "Activar GPS" on a route
// Saves to HeyValue every 30s. Members polled every 15s when active.

var _geoWatchId = null;
var _saveInterval = null;
var _pollInterval = null;
var _checkInterval = null;
var _activeRouteId = null;    // route being tracked right now
var _activeWindowStart = null; // minutes-of-day when activation started
var _lastLocationSave = 0;

function startGPS(routeId) {
  // If already tracking this route, do nothing
  if (_geoWatchId !== null && _activeRouteId === routeId) return;

  const route = STATE.routes.find(r => r.id === routeId);
  if (!route) return;

  stopGPS(); // clean up any existing tracking

  _activeRouteId = routeId;
  updateFabState();
  renderRutas();
  _activeWindowStart = new Date().getHours() * 60 + new Date().getMinutes();

  toast('📍 GPS activado — ' + route.name);

  if (!navigator.geolocation) { toast('GPS no disponible'); return; }

  // Watch position
  _geoWatchId = navigator.geolocation.watchPosition(
    pos => {
      STATE.userLocation = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        updated_at: Date.now()
      };
      saveLocationToHV();
      checkAttendanceForActiveRoutes();
    },
    err => { console.warn('[BS] GPS:', err.message); },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }
  );

  // Save every 30s, poll members every 15s
  _saveInterval = setInterval(saveLocationToHV, 30000);
  _pollInterval = setInterval(loadMembersLocation, 15000);

  // Check every 30s if the 2h window expired
  _checkInterval = setInterval(checkGPSWindow, 30000);

  // Immediate first run
  saveLocationToHV();
  loadMembersLocation();
}

function stopGPS() {
  if (_geoWatchId !== null) { navigator.geolocation.clearWatch(_geoWatchId); _geoWatchId = null; }
  if (_saveInterval) { clearInterval(_saveInterval); _saveInterval = null; }
  if (_pollInterval) { clearInterval(_pollInterval); _pollInterval = null; }
  if (_checkInterval) { clearInterval(_checkInterval); _checkInterval = null; }
  if (_activeRouteId !== null) {
    toast('GPS desactivado — ' + (STATE.routes.find(r => r.id === _activeRouteId)?.name || 'ruta'));
    _activeRouteId = null;
    _activeWindowStart = null;
  }
  // Re-render rutas so the GPS panel reflects the change
  try { renderRutas(); } catch(e) {}
}

function initLiveMap(route) {
  if (!window.L) return;

  const mapEl = document.getElementById('live-map');
  if (!mapEl) return;

  // Center on route start
  const centerLat = parseFloat(route.start_lat) || 8.9824;
  const centerLng = parseFloat(route.start_lng) || -79.5199;

  const map = L.map('live-map', { zoomControl: true }).setView([centerLat, centerLng], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // Route start marker
  if (route.start_lat && route.start_lng) {
    L.marker([route.start_lat, route.start_lng], {
      icon: L.divIcon({ html: '🟢', className: '', iconSize: [30, 30], iconAnchor: [15, 15] })
    }).addTo(map).bindPopup('Salida: ' + (route.start_name || 'Punto de salida'));
  }

  // Route end marker
  if (route.end_lat && route.end_lng) {
    L.marker([route.end_lat, route.end_lng], {
      icon: L.divIcon({ html: '🔴', className: '', iconSize: [30, 30], iconAnchor: [15, 15] })

  }

  // Members markers
  let memberMarkers = {};

          radius: 7, color: '#ff8800', fillColor: '#ff8800', fillOpacity: 0.85, weight: 2
        }).addTo(map).bindPopup(u.username);
      } else {
        memberMarkers[uid].setLatLng([loc.lat, loc.lng]);
      }

      // Check if confirmed
      const confirmed = (STATE.attendance || []).find(a => a.user_id === parseInt(uid) && a.route_id === route.id);
      html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
        <div style="width:32px;height:32px;border-radius:50%;background:#ff8800;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0">${(u.username||'?').charAt(0).toUpperCase()}</div>
        <div style="flex:1">

          <div style="font-size:10px;color:var(--text3)">${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}</div>
        </div>

      </div>`;
    });

    // My own entry
    const myConfirmed = (STATE.attendance || []).find(a => a.user_id === STATE.user?.id && a.route_id === route.id);
    html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
      <div style="width:32px;height:32px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0">${(STATE.user?.username||'?').charAt(0).toUpperCase()}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600">${escHtml(STATE.user?.username || 'Tu')} (tu)</div>
        <div style="font-size:10px;color:var(--text3)">${STATE.userLocation ? (STATE.userLocation.lat.toFixed(4)+', '+STATE.userLocation.lng.toFixed(4)) : 'Sin GPS'}</div>
      </div>
      ${myConfirmed ? '<span style="font-size:11px;padding:2px 8px;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);border-radius:10px;color:#22c55e;font-weight:700">✅ Confirmado</span>' : ''}
    </div>`;

    if (list) list.innerHTML = html;
  }

  updateMembers();

  // Refresh map + list every 15s while modal is open
  _liveMapInterval = setInterval(() => {
    if (!document.getElementById('live-map')) {
      clearInterval(_liveMapInterval);
      return;
    }
    loadMembersLocation().then(() => {
      if (STATE.userLocation) updateMyMarker();
      updateMembers();
    });
  }, 15000);
}

// Auto-check every 30s: is the 2h window still open?
function checkGPSWindow() {
  if (_activeRouteId === null) return;
  const route = STATE.routes.find(r => r.id === _activeRouteId);
  if (!route || !route.date || !route.time) { stopGPS(); return; }

  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  if (route.date !== today) { stopGPS(); return; }

  const curMin = now.getHours() * 60 + now.getMinutes();
  const depMin = parseInt(route.time.slice(0,2))*60 + parseInt(route.time.slice(3,5));
  const windowEnd = depMin + 120; // +2 hours

  if (curMin > windowEnd) {
    toast('⏰ Tiempo de ruta terminado — GPS apagado');
    stopGPS();
  }
}

// Check on page load if a route should auto-activate
function autoActivateGPS() {
  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  const curMin = now.getHours() * 60 + now.getMinutes();

  const route = STATE.routes.find(r => {
    if (!r.date || !r.time) return false;
    if (r.date !== today) return false;
    const depMin = parseInt(r.time.slice(0,2))*60 + parseInt(r.time.slice(3,5));
    const windowEnd = depMin + 120;
    return curMin >= depMin && curMin <= windowEnd;
  });

  if (route) startGPS(route.id);
}

async function saveLocationToHV() {
  if (!HV.user || !HV.pass || !STATE.user || !STATE.userLocation) return;
  const now = Date.now();
  if (now - _lastLocationSave < 30000) return;
  _lastLocationSave = now;
  try {
    await saveToHV('member_location_' + STATE.user.id, {
      lat: STATE.userLocation.lat,
      lng: STATE.userLocation.lng,
      accuracy: STATE.userLocation.accuracy,
      username: STATE.user.username,
      route_id: _activeRouteId,
      updated_at: now
    });
  } catch(e) {}
}

async function loadMembersLocation() {
  if (!HV.user || !HV.pass) return;
  STATE.membersLocation = STATE.membersLocation || {};
  for (const u of STATE.users) {
    if (u.id === STATE.user?.id) continue;
    try {
      const data = await loadFromHV('member_location_' + u.id);
      if (data && data.lat && data.lng) {
        // Only show members tracking the same active route (or no route = manual mode)
        if (_activeRouteId && data.route_id && data.route_id !== _activeRouteId) continue;
        if (Date.now() - (data.updated_at || 0) < 120000) { // 2 min max age
          STATE.membersLocation[u.id] = data;
        }
      }
    } catch(e) {}
  }
}

// Only sync posts — fast, lightweight, used for BikerGram live refresh
async function syncPostsFromCloud() {
  if (!HV.user) return;
  const data = await loadFromHV('posts');
  if (data && Array.isArray(data)) {
    const deletedIds = STATE._deletedIds || [];
    // Filter out deleted posts from cloud data
    const filteredCloud = data.filter(item => !deletedIds.includes(item.id));
    const cloudMap = new Map(filteredCloud.map(item => [item.id, item]));
    // Find posts that exist locally but NOT in cloud — those were deleted by others
    const orphaned = (STATE.posts || []).filter(item => !cloudMap.has(item.id) && !deletedIds.includes(item.id));
    // Clean up orphaned posts from IndexedDB
    if (DB && orphaned.length > 0) {
      for (const post of orphaned) {
        await idbDelete('posts', post.id);
      }
    }
    // Prefer local version if post not yet synced (has pending media upload)
    const merged = [];
    const seen = new Set();
    // Add all cloud posts
    for (const p of filteredCloud) { merged.push(p); seen.add(p.id); }
    // Add local-only posts (new posts not yet synced or unsynced)
    for (const p of (STATE.posts || [])) {
      if (!seen.has(p.id)) merged.push(p);
      else {
        // If local has media_url but cloud doesn't, keep local
        const cloudP = cloudMap.get(p.id);
        if (cloudP && !cloudP.media_url && p.media_url) {
          const idx = merged.findIndex(x => x.id === p.id);
          if (idx >= 0) merged[idx] = p;
        }
      }
    }
    STATE.posts = merged.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  }
}

// Trae comentarios de la nube (lo que comentan otros) sin pisar los míos locales
// que aún no han subido. Permite que el contador y la lista se actualicen en vivo.
async function syncCommentsFromCloud() {
  if (!HV.user) return;
  const data = await loadFromHV('comments');
  if (data && Array.isArray(data)) {
    const cloudMap = new Map(data.map(c => [c.id, c]));
    const localOnly = (STATE.comments || []).filter(c => !cloudMap.has(c.id));
    STATE.comments = [...data, ...localOnly];
  }
}

// "Firma" ligera del feed: cambia si hay un post nuevo, un me gusta, una
// reacción o un comentario. Así el refresco detecta cambios reales, no solo
// posts nuevos (antes un me gusta de otro no se veía hasta recargar).
function bikergramSignature() {
  const posts = STATE.posts || [];
  const cByPost = {};
  (STATE.comments || []).forEach(c => { cByPost[c.post_id] = (cByPost[c.post_id] || 0) + 1; });
  return posts.map(p => {
    const rx = Object.values(p.reactions || {}).reduce((a, b) => a + b, 0);
    return p.id + ':' + (p.likes || []).length + ':' + rx + ':' + (cByPost[p.id] || 0);
  }).join('|') + '#' + posts.length;
}

// ¿El usuario está escribiendo un comentario? Si es así, NO re-renderizamos
// (le borraríamos el texto). Los comentarios ahora se ven siempre (estilo
// Instagram), así que tener la sección visible ya no cuenta como "ocupado".
function feedHasOpenInteraction() {
  const ae = document.activeElement;
  if (ae && ae.id && (ae.id.indexOf('cmt-') === 0 || ae.id.indexOf('comment-input-') === 0)) return true;
  const inputs = document.querySelectorAll('[id^="cmt-"], [id^="comment-input-"]');
  for (const i of inputs) { if (i.value && i.value.trim()) return true; }
  return false;
}

// Globo flotante estilo Instagram: "⬆️ N nuevas publicaciones". Al tocarlo,
// sube al inicio y refresca. Nunca interrumpe lo que el usuario esté haciendo.
function showNewPostsPill(n) {
  let pill = document.getElementById('new-posts-pill');
  if (!pill) {
    pill = document.createElement('div');
    pill.id = 'new-posts-pill';
    pill.onclick = function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderBikerGram();
      removeNewPostsPill();
    };
    document.body.appendChild(pill);
  }
  pill.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;background:linear-gradient(135deg,#ff4444,#ff8800);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(255,68,68,0.5);animation:fadeUp 0.3s ease;white-space:nowrap';
  pill.textContent = '⬆️ ' + n + (n === 1 ? ' nueva publicación' : ' nuevas publicaciones');
}

function removeNewPostsPill() {
  const pill = document.getElementById('new-posts-pill');
  if (pill) pill.remove();
}

// Un ciclo del refresco en vivo (cada 2.5s). Guarda anti-solapamiento: si una
// descarga aún no termina (la nube tarda ~2.5s), no se encima otra.
async function liveFeedTick() {
  if (STATE.currentPage !== 'bikergram') { removeNewPostsPill(); return; }
  if (STATE._polling) return;
  STATE._polling = true;
  try {
    const prevCount = STATE.posts.length;
    const prevSig = bikergramSignature();
    await syncPostsFromCloud();
    await syncCommentsFromCloud();
    const newCount = STATE.posts.length;
    if (bikergramSignature() === prevSig) return; // nada cambió de verdad

    const gotNewPosts = newCount > prevCount;
    const scrollY = window.scrollY || document.documentElement.scrollTop || 0;
    const busy = feedHasOpenInteraction();

    if (gotNewPosts && (scrollY > 200 || busy)) {
      // Hay posts nuevos pero el usuario está abajo o ocupado: avisar sin saltar
      showNewPostsPill(newCount - (STATE._feedRenderedCount || prevCount));
    } else if (busy) {
      // Solo cambiaron me gusta/comentarios y está escribiendo: esperar al próximo ciclo
    } else {
      // Seguro re-renderizar: arriba del feed, o solo cambios de me gusta/comentarios
      renderBikerGram();
    }
  } catch (e) {
    /* silencioso: reintenta en el próximo ciclo */
  } finally {
    STATE._polling = false;
  }
}

// Al volver la app a primer plano —abrir desde una notificación, cambiar de
// pestaña, desbloquear el teléfono— trae datos frescos de la nube para ver al
// instante los posts/mensajes nuevos, sin esperar el ciclo de 2.5s.
let _lastResumeSync = 0;
async function resumeSync() {
  if (!HV.user || document.hidden) return;
  const now = Date.now();
  if (now - _lastResumeSync < 1500) return; // anti-rebote
  _lastResumeSync = now;
  try {
    await syncFromCloud(true);
    if (STATE.currentPage === 'bikergram') renderBikerGram();
    // 'juegos' se refresca solo con su propio polling; re-renderizarlo aquí
    // cerraría una partida de dominó en curso, así que no lo tocamos.
    else if (STATE.currentPage && STATE.currentPage !== 'juegos' && typeof renderPage === 'function') renderPage(STATE.currentPage);
  } catch (e) { /* reintenta en el próximo foco */ }
}
document.addEventListener('visibilitychange', resumeSync);
window.addEventListener('focus', resumeSync);

async function saveState() {
  saveLocal();
  // Only sync to cloud if all posts with media are fully synced (media uploaded to HeyValue)
  if (HV.connected && STATE._cloudSynced !== false) {
    // Siempre sincroniza: cloudSafePosts() ya evita subir media local pesada.
    // (Antes un post viejo con synced!=true dejaba allSynced en falso para
    // siempre y NINGÚN post nuevo llegaba a la nube.)
    await syncToCloud();
  }
}

// Save to localStorage only (no cloud sync)
function saveLocal() {
  ls('bs_users', STATE.users);
  ls('bs_routes', STATE.routes);
  ls('bs_events', STATE.events);
  // Strip large embedded data:/blob: media from posts before saving to localStorage —
  // big base64 photos/videos can blow the ~5MB quota and silently fail to save,
  // which makes the whole post (and any newer ones) disappear after reload.
  // The full post (with media) stays safe in IndexedDB and gets restored on next load.
  ls('bs_posts', (STATE.posts || []).map(p => {
    const url = p.media_url || p.image_url;
    if (url && (url.startsWith('data:') || url.startsWith('blob:')) && url.length > 5000) {
      const { media_url, image_url, ...rest } = p;
      return { ...rest, _pendingMedia: true };
    }
    return p;
  }));
  ls('bs_badges', STATE.badges);
  ls('bs_challenges', STATE.challenges);
  ls('bs_uc', STATE.userChallenges);
  ls('bs_ub', STATE.userBadges);
  ls('bs_cc', STATE.chatChannels);
  ls('bs_cm', STATE.chatMessages);
  ls('bs_notif', STATE.notifications);
  ls('bs_att', STATE.attendance);
  ls('bs_places', STATE.places);
  ls('bs_comments', STATE.comments || []);
  ls('bs_follows', STATE.follows || []);
}

// ============================================================
// BREADCRUMB NAVIGATION SYSTEM
// ============================================================
const BREADCRUMB_PAGES = ['profile', 'rider-detail', 'admin', 'admin-users', 'admin-events', 'admin-edit-user', 'admin-edit-event', 'retos', 'insignias'];

function pushNav(page, pageId, label) {
  const isMainTab = ['inicio', 'rutas', 'bikergram', 'chat'].includes(page);
  if (isMainTab) {
    STATE.navStack = [];
  } else {
    const top = STATE.navStack[STATE.navStack.length - 1];
    if (top && top.page === page && top.pageId === pageId) return;
  }
  STATE.navStack.push({ page, pageId, label });
  renderBreadcrumb();
}

function popNav() {
  if (STATE.navStack.length <= 1) return;
  STATE.navStack.pop();
  const prev = STATE.navStack[STATE.navStack.length - 1];
  if (prev) {
    _navNoPush = true;
    navigate(prev.page, prev.pageId);
    _navNoPush = false;
  }
  renderBreadcrumb();
}

function navigateToBreadcrumb(index) {
  if (index < 0 || index >= STATE.navStack.length) return;
  STATE.navStack = STATE.navStack.slice(0, index + 1);
  const target = STATE.navStack[index];
  _navNoPush = true;
  navigate(target.page, target.pageId);
  _navNoPush = false;
  renderBreadcrumb();
}

function renderBreadcrumb() {
  const bar = document.getElementById('breadcrumb-bar');
  const inner = document.getElementById('breadcrumb-inner');
  if (!bar || !inner) return;
  const stack = STATE.navStack;
  if (stack.length === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  let html = '';
  // Botón Atrás neón parpadeante — solo cuando hay a dónde retroceder
  if (stack.length > 1) {
    html += `<button class="neon-back-btn" onclick="popNav()" aria-label="Atrás"><span class="bk-arrow">←</span> Atrás</button>`;
  }
  stack.forEach((item, i) => {
    const isLast = i === stack.length - 1;
    if (i > 0) html += '<span class="breadcrumb-sep">›</span>';
    if (isLast) {
      html += `<span class="breadcrumb-current">${item.label}</span>`;
    } else {
      html += `<span class="breadcrumb-link" onclick="navigateToBreadcrumb(${i})">${item.label}</span>`;
    }
  });
  inner.innerHTML = html;
}

// ============================================================
// NAVIGATION
// ============================================================
let _navNoPush = false; // set true by popNav/navigateToBreadcrumb to avoid duplicate stack entry

function navigate(page, pageId) {
  closeFpanel(); // always close floating panel on navigation
  if (page !== 'bikergram') removeNewPostsPill(); // el globo solo vive en el feed

  const pageLabels = {
    inicio: 'Inicio', rutas: 'Rutas', bikergram: 'Gram',
    profile: 'Mi Perfil', admin: 'Admin',
    'admin-users': 'Usuarios', 'admin-events': 'Eventos',
    'admin-notif': 'Notificaciones', 'admin-sync': 'HeyValue Sync',
    'admin-recovery': 'Recuperaciones',
    'admin-edit-user': 'Editar Usuario', 'admin-edit-event': 'Editar Evento',
    retos: 'Retos', insignias: 'Insignias',
    juegos: 'Juegos', 'domino-game': 'Dominó',
    'rider-detail': 'Perfil'
  };
  const label = pageLabels[page] || page;

  if (!_navNoPush) {
    const isMainTab = ['inicio', 'rutas', 'bikergram', 'chat'].includes(page);
    if (isMainTab) {
      STATE.navStack = [{ page, pageId, label }];
    } else {
      const top = STATE.navStack[STATE.navStack.length - 1];
      if (!top || top.page !== page || String(top.pageId) !== String(pageId)) {
        STATE.navStack.push({ page, pageId, label });
      }
    }
  }

  // Update bottom nav
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.bnav-item[data-page="${page}"]`);
  if (btn) btn.classList.add('active');

  // Hide all pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  STATE.currentPage = page;
  STATE.currentPageId = pageId;
  renderPage(page, pageId);
  renderBreadcrumb();

  // Refresh posts from cloud when entering BikerGram (no flicker — render happens once via timer)
  if (page === 'bikergram' && HV.connected) {
    syncPostsFromCloud();
  }
}

function renderPage(page, pageId) {
  const el = document.getElementById('page-' + page);
  if (!el) return;
  el.classList.add('active');

  switch(page) {
    case 'inicio': renderInicio(); break;
    case 'rutas': renderRutas(); break;
    case 'bikers': renderBikers(); break;
    case 'rider-detail': renderRiderDetail(pageId); break;
    case 'bikergram': renderBikerGram(); break;
    case 'eventos': RUTAS_TAB = 'rutas'; renderRutas(); break;
    case 'retos': renderRetos(); break;
    case 'insignias': renderInsignias(); break;
    case 'profile': renderProfile(); break;
    case 'admin': renderAdmin(); break;
    case 'chat': renderChat(); break;
    case 'ranking': renderRanking(); break;
    case 'juegos': renderJuegos(); break;
  }

  // Scroll to top
  el.scrollTop = 0;
}

function checkRecoveryAccount() {
  const val = document.getElementById('fp-input').value.trim().toLowerCase();
  const status = document.getElementById('fp-status');
  const btn = document.getElementById('fp-whatsapp-btn');
  _recoveryFoundUser = null;
  btn.disabled = true;
  btn.style.opacity = '0.5';

  if (!val || val.length < 2) {
    status.innerHTML = '';
    return;
  }

  // Check if it's an email or username
  const isEmail = val.includes('@');
  let user = null;
  if (isEmail) {
    user = STATE.users.find(x => x.email && x.email.toLowerCase() === val);
  } else {
    user = STATE.users.find(x => x.username && x.username.toLowerCase() === val);
  }

  if (user) {
    _recoveryFoundUser = user;
    status.innerHTML = `<span style="color:#22c55e">✅ Cuenta encontrada: @${user.username} (${user.email})</span>`;
    btn.disabled = false;
    btn.style.opacity = '1';
  } else {
    status.innerHTML = `<span style="color:#e74c3c">❌ No existe cuenta con ese usuario o email</span>`;
  }
}

async function doResetPassword() {
  const email = document.getElementById('rp-email').value.trim().toLowerCase();
  const code = document.getElementById('rp-code').value.trim();
  const pass = document.getElementById('rp-pass').value;
  const pass2 = document.getElementById('rp-pass2').value;
  if (!email || !code || !pass || !pass2) { toast('Completa todos los campos'); return; }
  if (pass !== pass2) { toast('Las contraseñas no coinciden'); return; }
  if (pass.length < 4) { toast('La contraseña debe tener al menos 4 caracteres'); return; }
  // Cargar códigos desde WebDAV
  const codes = await loadFromHV('recovery_codes') || {};
  const record = codes[email];
  if (!record || record.used) { toast('Código inválido o ya usado'); return; }
  if (new Date() > new Date(record.expiresAt)) { toast('El código expiró. Solicita uno nuevo.'); return; }
  if (record.code !== code) { toast('Código incorrecto'); return; }
  // Actualizar contraseña
  const userIdx = STATE.users.findIndex(x => x.email.toLowerCase() === email);
  if (userIdx === -1) { toast('Usuario no encontrado'); return; }
  STATE.users[userIdx].password = pass;
  // Marcar código como usado
  codes[email].used = true;
  await saveToHV('recovery_codes', codes);
  ls('bs_recovery_pending', null);
  // Sincronizar usuarios
  await syncToCloud();
  saveLocal();
  toast('¡Contraseña actualizada! Ya puedes iniciar sesión.');
  showLogin();
}

function doLogin() {
  const u = document.getElementById('li-user').value.trim();
  const p = document.getElementById('li-pass').value;
  const user = STATE.users.find(x => (x.username === u || x.email === u) && x.password === p);
  if (!user) { toast('Usuario o contraseña incorrectos'); return; }
  STATE.user = user;
  ls('bs_session', user);

  // Digital notification chime on login — Web Audio API, no file needed
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.setValueAtTime(1320, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}

  document.getElementById('page-login').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('bottomnav').style.display = 'flex';
  navigate('inicio');
  toast('Bienvenido, ' + user.username + '!');
  startPresence();
  // Auto-sync from cloud if HeyValue is already configured
  if (HV.user && HV.pass) {
    syncFromCloud(true).then(() => {
      if (STATE.currentPage) renderPage(STATE.currentPage);
    });
  }
}

async function saveHVSetup() {
  const u = document.getElementById('hv-user').value.trim();
  const p = document.getElementById('hv-pass').value;
  if (!u || !p) { toast('Completa ambos campos'); return; }

  // Discover WebDAV path via OCS API
  toast('Conectando a HeyValue...');
  try {
    const r = await fetch(HV.url + '/ocs/v1.php/cloud/user', {
      headers: { Authorization: 'Basic ' + btoa(u + ':' + p), 'OCS-APIREQUEST': 'true' }
    });
    const xml = await r.text();
    const idMatch = xml.match(/<id>([^<]+)<\/id>/);
    const displayName = xml.match(/<display-name>([^<]+)<\/display-name>/)?.[1] || u;
    if (idMatch) {
      HV.hvPath = idMatch[1];
      localStorage.setItem('hv_path', HV.hvPath);
      toast('HeyValue conectado! Descubriendo carpeta...');
    } else {
      toast('Error descubriendo usuario — usando email como path');
      HV.hvPath = '';
    }
  } catch(e) {
    toast('Error conectando: ' + e.message);
    return;
  }

  localStorage.setItem('hv_user', u);
  localStorage.setItem('hv_pass', p);
  HV.user = u; HV.pass = p;
  closeModal();

  // Ensure RuedeGram folder exists
  toast('Creando carpeta BikerGram...');
  await hvRequest('MKCOL', '/' + HV.gramFolder);
  await hvRequest('MKCOL', '/' + HV.gramFolder + '/photos');
  await hvRequest('MKCOL', '/' + HV.gramFolder + '/videos');
  await hvRequest('MKCOL', '/' + HV.gramFolder + '/audio');

  syncFromCloud().then(() => { saveState(); navigate('inicio'); toast('HeyValue listo! Sincronizado.'); });
}

async function loadNews() {
  const container = document.getElementById('news-container');
  if (!container) return;
  container.innerHTML = '<div class="news-loading">Cargando noticias...</div>';
  try {
    // Fetch motorcycle news and Panama news in parallel
    const [motoRes, panamaRes] = await Promise.all([
      fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://motorbike-thailand.com/feed')}`).catch(() => null),
      fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://feeds.bbci.co.uk/mundo/rss.xml')}`).catch(() => null),
    ]);

    let items = [];
    const half = 3; // mostrar 3 de cada fuente

    if (motoRes?.ok) {
      const d = await motoRes.json();
      if (d.status === 'ok' && d.items?.length) {
        items.push(...d.items.slice(0, half).map(i => ({ ...i, _cat: '🏍️ Motos' })));
      }
    }

    if (panamaRes?.ok) {
      const d = await panamaRes.json();
      if (d.status === 'ok' && d.items?.length) {
        items.push(...d.items.slice(0, half).map(i => ({ ...i, _cat: '🌎 Panama' })));
      }
    }

    if (!items.length) throw new Error('No news');

    // Mezclar aleatoriamente
    items.sort(() => Math.random() - 0.5);

    container.innerHTML = '<div class="news-grid">' + items.map(item => `
      <a class="news-card" href="${item.link}" target="_blank" rel="noopener">
        ${item.thumbnail ? `<img class="news-card-img" src="${item.thumbnail}" alt="${item.title}" onerror="this.style.display='none'">` : ''}
        <div class="news-card-body">
          <div class="news-card-title">${item.title}</div>
          <div class="news-card-desc">${item.description ? item.description.replace(/<[^>]+>/g, '').substring(0, 100) + '...' : ''}</div>
          <div class="news-card-meta">
            <span class="news-badge">${item._cat}</span>
            ${new Date(item.pubDate).toLocaleDateString('es-PA', {day:'numeric',month:'short'})}
          </div>
        </div>
      </a>
    `).join('') + '</div>';
  } catch (e) {
    container.innerHTML = '<div class="news-error">No se pudieron cargar las noticias</div>';
  }
}

function initHomeMap() {
  if (STATE.map) { STATE.map.remove(); STATE.map = null; }
  const mapEl = document.getElementById('map-home');
  if (!mapEl) return;

  const map = L.map('map-home', {zoomControl:false, attributionControl:false}).setView([8.9824, -79.5199], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {subdomains:'abcd', maxZoom:19}).addTo(map);

  // My location marker
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const {latitude:lat, longitude:lng} = pos.coords;
      map.setView([lat, lng], 13);
      L.circle([lat, lng], {color:'#ff4444', fillColor:'#ff4444', fillOpacity:0.3, radius:200}).addTo(map);
      L.marker([lat, lng]).addTo(map).bindPopup('Tu ubicacion');
    }, () => {}, {timeout:5000});
  }

  // Event markers
  STATE.events.filter(e => e.latitude && e.longitude).forEach(ev => {
    L.circle([ev.latitude, ev.longitude], {
      color:'#ff8800', fillColor:'#ff8800', fillOpacity:0.4, radius:300
    }).addTo(map).bindPopup(`<b>${ev.title}</b><br>${ev.date}`);
  });

  // Route lines with real-road routing via OSRM
  STATE.routes.forEach(rt => {
    if (!rt.start_lat || !rt.end_lat) return;
    const pts = [[rt.start_lat, rt.start_lng]];
    let stops = [];
    try { stops = JSON.parse(rt.stops || '[]'); } catch(e) {}
    stops.forEach(s => { if (s.lat && s.lng) pts.push([parseFloat(s.lat), parseFloat(s.lng)]); });
    pts.push([rt.end_lat, rt.end_lng]);

    // SALIDA pill
    const startDiv = L.divIcon({className:'', html:`<div style="background:#22c55e;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">SALIDA</div>`});
    L.marker([rt.start_lat, rt.start_lng], {icon:startDiv}).addTo(map);

    // PARADA pills
    stops.forEach(s => {
      if (!s.lat || !s.lng) return;
      const stopDiv = L.divIcon({className:'', html:`<div style="background:#ff8800;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">PARADA</div>`});
      L.marker([parseFloat(s.lat), parseFloat(s.lng)], {icon:stopDiv}).addTo(map);
    });

    // DESTINO pill
    const endDiv = L.divIcon({className:'', html:`<div style="background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">DESTINO</div>`});
    L.marker([rt.end_lat, rt.end_lng], {icon:endDiv}).addTo(map);

    // Dashed placeholder while OSRM loads
    const placeholder = L.polyline(pts, {color:'#ff4444', weight:4, opacity:0.4, dashArray:'10,10'}).addTo(map);

    // Real road route via OSRM
    const coords = pts.map(p => `${p[1]},${p[0]}`).join(';');
    fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`)
      .then(r => r.json())
      .then(data => {
        if (data.code !== 'Ok' || !data.routes || !data.routes[0]) return;
        placeholder.remove();
        L.geoJSON(data.routes[0].geometry, {style: {color:'#ff4444', weight:5, opacity:1, className:'route-animated'}}).addTo(map);
      }).catch(() => {});
  });

  STATE.map = map;
}

// Haversine distance in km
function routeDistanceKm(r) {
  if (!r.start_lat || !r.end_lat) return 0;
  const R = 6371;
  const dLat = (parseFloat(r.end_lat) - parseFloat(r.start_lat)) * Math.PI / 180;
  const dLng = (parseFloat(r.end_lng) - parseFloat(r.start_lng)) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(parseFloat(r.start_lat)*Math.PI/180)*Math.cos(parseFloat(r.end_lat)*Math.PI/180)*Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// Export route as GPX file
