// Always available — does NOT require GPS, geolocation, or any other condition.
// Works with whatever coordinates the route already has. If route has no coords,
// shows an interactive map so user can pick start/end.
function openRouteInNav(routeId) {
  const r = STATE.routes.find(x => x.id === routeId);
  if (!r) {
    toast('Ruta no encontrada');
    return;
  }
  let stops = [];
  try { stops = JSON.parse(r.stops || '[]'); } catch(e) {}
  const allPoints = [
    { name: r.start_name || 'Salida', lat: r.start_lat, lng: r.start_lng },
    ...stops.map(s => ({ name: s.name, lat: s.lat, lng: s.lng })),
    { name: r.end_name || 'Destino', lat: r.end_lat, lng: r.end_lng },
  ].filter(p => p.lat && p.lng);

  // If route has no coordinates, show a map picker so user can set start/end
  if (allPoints.length < 2) {
    pickRoutePointsForNav(r, stops);
    return;
  }

  const start = allPoints[0];
  const end = allPoints[allPoints.length - 1];

  // Detect platform
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(navigator.userAgent);

  // ── Waze deep link ─────────────────────────────────────────────────────
  const wazeUrl = `waze://?ll=${end.lat},${end.lng}&navigate=yes`;
  const wazeWebUrl = `https://waze.com/ul?ll=${end.lat},${end.lng}&navigate=yes`;

  // ── Google Maps deep link ─────────────────────────────────────────────
  const gmapsUrl = `comgooglemaps://?saddr=${start.lat},${start.lng}&daddr=${end.lat},${end.lng}&directionsmode=motorcycle`;
  const gmapsWebUrl = `https://www.google.com/maps/dir/?api=1&origin=${start.lat},${start.lng}&destination=${end.lat},${end.lng}&travelmode=motorcycle`;

  // ── Apple Maps (iOS only) ─────────────────────────────────────────────
  const appleMapsUrl = `https://maps.apple.com/?saddr=${start.lat},${start.lng}&daddr=${end.lat},${end.lng}&dirflg=d`;

  const body = `
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-size:13px;color:var(--text2);margin-bottom:4px">${escHtml(r.name)}</div>
      <div style="font-size:11px;color:var(--text3)">${escHtml(start.name)} → ${escHtml(end.name)}</div>
    </div>
    <div style="display:grid;gap:10px">
      <button onclick="navigateWith('${wazeUrl}', '${wazeWebUrl}')" style="padding:14px;border-radius:12px;border:1px solid rgba(0,212,255,0.3);background:rgba(0,212,255,0.08);color:#00d4ff;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;gap:12px">
        <div style="width:42px;height:42px;border-radius:50%;background:#33ccff;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">🧭</div>
        <div style="flex:1;text-align:left">
          <div>Waze</div>
          <div style="font-size:11px;font-weight:400;opacity:0.8">${isIOS || isAndroid ? 'Abre la app instalada' : 'Abre waze.com'}</div>
        </div>
        <span style="font-size:18px">→</span>
      </button>
      <button onclick="navigateWith('${gmapsUrl}', '${gmapsWebUrl}')" style="padding:14px;border-radius:12px;border:1px solid rgba(34,197,94,0.3);background:rgba(34,197,94,0.08);color:#22c55e;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;gap:12px">
        <div style="width:42px;height:42px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">🗺️</div>
        <div style="flex:1;text-align:left">
          <div>Google Maps</div>
          <div style="font-size:11px;font-weight:400;opacity:0.8">${isIOS || isAndroid ? 'Abre la app instalada' : 'maps.google.com'}</div>
        </div>
        <span style="font-size:18px">→</span>
      </button>
      ${isIOS ? `
      <button onclick="window.open('${appleMapsUrl}','_blank');closeModal();" style="padding:14px;border-radius:12px;border:1px solid rgba(168,85,247,0.3);background:rgba(168,85,247,0.08);color:#a855f7;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;gap:12px">
        <div style="width:42px;height:42px;border-radius:50%;background:#a855f7;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">🍎</div>
        <div style="flex:1;text-align:left">
          <div>Apple Maps</div>
          <div style="font-size:11px;font-weight:400;opacity:0.8">Solo en iPhone/iPad</div>
        </div>
        <span style="font-size:18px">→</span>
      </button>` : ''}
    </div>
    <div style="margin-top:14px;padding:10px;background:rgba(255,136,0,0.08);border:1px solid rgba(255,136,0,0.2);border-radius:10px;font-size:11px;color:var(--text2);text-align:center">
      ${isIOS || isAndroid ? 'Si la app no abre, ya tenes Google Maps en el telefono — toca el boton' : 'Abre desde el celular para que use las apps instaladas'}
    </div>
  `;
  openModal('🧭 Seguir ruta en...', body);
}

// Pick start/end points on a map for routes that don't have coordinates
function pickRoutePointsForNav(r, existingStops) {
  const body = `
    <div style="font-size:12px;color:var(--text2);text-align:center;margin-bottom:8px">
      Esta ruta no tiene coordenadas. Toca el mapa para elegir:
    </div>
    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px;font-size:11px">
      <span style="padding:4px 8px;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);border-radius:6px;color:#22c55e">1. Toca: Salida</span>
      <span style="padding:4px 8px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);border-radius:6px;color:#ef4444">2. Toca: Destino</span>
    </div>
    <div id="pick-nav-map" style="height:300px;border-radius:10px;overflow:hidden;border:1px solid var(--border);margin-bottom:10px"></div>
    <div style="display:flex;gap:6px">
      <button id="pick-start-name" onclick="setPickName('start')" style="flex:1;padding:8px;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;cursor:pointer">📍 Nombre salida</button>
      <button id="pick-end-name" onclick="setPickName('end')" style="flex:1;padding:8px;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:8px;cursor:pointer">🏁 Nombre destino</button>
    </div>
    <button id="pick-nav-go" disabled onclick="openPickedNav()" style="width:100%;margin-top:10px;padding:12px;background:linear-gradient(135deg,#ff4444,#ff8800);border:none;color:#fff;font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;opacity:0.5">Selecciona los 2 puntos</button>
  `;
  openModal('📍 Elige puntos de la ruta', body);

  setTimeout(() => {
    if (!window.L) return;
    const map = L.map('pick-nav-map').setView([8.9824, -79.5199], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OSM'
    }).addTo(map);

    let startMarker = null, endMarker = null;
    let startName = 'Salida', endName = 'Destino';

    map.on('click', e => {
      const { lat, lng } = e.latlng;
      if (!startMarker) {
        startMarker = L.marker([lat, lng], {
          icon: L.divIcon({ html: '🟢', className: '', iconSize: [30, 30], iconAnchor: [15, 15] })
        }).addTo(map).bindPopup('Salida').openPopup();
        window._pickStart = { lat, lng };
      } else if (!endMarker) {
        endMarker = L.marker([lat, lng], {
          icon: L.divIcon({ html: '🔴', className: '', iconSize: [30, 30], iconAnchor: [15, 15] })
        }).addTo(map).bindPopup('Destino').openPopup();
        window._pickEnd = { lat, lng };
        // Update button
        const btn = document.getElementById('pick-nav-go');
        if (btn) { btn.disabled = false; btn.style.opacity = '1'; btn.textContent = '🧭 Abrir en Waze/Maps'; }
      } else {
        // Reset
        map.removeLayer(startMarker);
        map.removeLayer(endMarker);
        startMarker = L.marker([lat, lng], {
          icon: L.divIcon({ html: '🟢', className: '', iconSize: [30, 30], iconAnchor: [15, 15] })
        }).addTo(map);
        window._pickStart = { lat, lng };
        endMarker = null;
        window._pickEnd = null;
        const btn = document.getElementById('pick-nav-go');
        if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.textContent = 'Selecciona los 2 puntos'; }
      }
    });

    window._pickStart = null;
    window._pickEnd = null;
    window._pickStartName = () => startName;
    window._pickEndName = () => endName;
  }, 100);
}

function setPickName(which) {
  const name = prompt(which === 'start' ? 'Nombre del punto de salida:' : 'Nombre del destino:');
  if (name) {
    if (which === 'start') window._pickStartName = () => name;
    else window._pickEndName = () => name;
  }
}

  const isAndroid = /Android/.test(navigator.userAgent);

  const wazeUrl = `waze://?ll=${e.lat},${e.lng}&navigate=yes`;

  const gmapsUrl = `comgooglemaps://?saddr=${s.lat},${s.lng}&daddr=${e.lat},${e.lng}&directionsmode=motorcycle`;
  const gmapsWebUrl = `https://www.google.com/maps/dir/?api=1&origin=${s.lat},${s.lng}&destination=${e.lat},${e.lng}&travelmode=motorcycle`;
  const appleMapsUrl = `https://maps.apple.com/?saddr=${s.lat},${s.lng}&daddr=${e.lat},${e.lng}&dirflg=d`;

  const body = `
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-size:13px;color:var(--text2);margin-bottom:4px">Ruta personalizada</div>
      <div style="font-size:11px;color:var(--text3)">${escHtml(sName)} → ${escHtml(eName)}</div>
    </div>
    <div style="display:grid;gap:10px">
      <button onclick="navigateWith('${wazeUrl}', '${wazeWebUrl}')" style="padding:14px;border-radius:12px;border:1px solid rgba(0,212,255,0.3);background:rgba(0,212,255,0.08);color:#00d4ff;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;gap:12px">
        <div style="width:42px;height:42px;border-radius:50%;background:#33ccff;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">🧭</div>
        <div style="flex:1;text-align:left"><div>Waze</div><div style="font-size:11px;font-weight:400;opacity:0.8">${isIOS || isAndroid ? 'Abre la app instalada' : 'Abre waze.com'}</div></div>
        <span style="font-size:18px">→</span>
      </button>
      <button onclick="navigateWith('${gmapsUrl}', '${gmapsWebUrl}')" style="padding:14px;border-radius:12px;border:1px solid rgba(34,197,94,0.3);background:rgba(34,197,94,0.08);color:#22c55e;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;gap:12px">
        <div style="width:42px;height:42px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">🗺️</div>
        <div style="flex:1;text-align:left"><div>Google Maps</div><div style="font-size:11px;font-weight:400;opacity:0.8">${isIOS || isAndroid ? 'Abre la app instalada' : 'maps.google.com'}</div></div>
        <span style="font-size:18px">→</span>
      </button>
      ${isIOS ? `<button onclick="window.open('${appleMapsUrl}','_blank');closeModal();" style="padding:14px;border-radius:12px;border:1px solid rgba(168,85,247,0.3);background:rgba(168,85,247,0.08);color:#a855f7;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;gap:12px"><div style="width:42px;height:42px;border-radius:50%;background:#a855f7;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">🍎</div><div style="flex:1;text-align:left"><div>Apple Maps</div></div><span style="font-size:18px">→</span></button>` : ''}
    </div>
  `;
  openModal('🧭 Seguir ruta en...', body);
}

// Try native app deep link first, fall back to web URL after a short delay
function navigateWith(nativeUrl, webUrl) {
  const start = Date.now();
  window.location.href = nativeUrl;
  setTimeout(() => {
    if (Date.now() - start < 2500) {
      window.open(webUrl, '_blank');
    }
  }, 1500);
  setTimeout(() => closeModal(), 500);
}

// Keep exportRouteGPX as a hidden fallback for power users
function exportRouteGPX(routeId) {
  openRouteInNav(routeId);
}

function setRutasTab(t) {
  RUTAS_TAB = t;
  renderRutas();
}

function setRouteSubTab(t) {
  routeSubTab = t;
  const list = document.getElementById('rutas-list');
  if (list) {
    const today = new Date().toISOString().slice(0,10);
    const nuevas = STATE.routes.filter(r => !r.date || r.date >= today);
    const vencidas = STATE.routes.filter(r => r.date && r.date < today);
    const sourceList = t === 'nuevas' ? nuevas : vencidas;
    list.innerHTML = sourceList.length === 0
      ? `<div class="empty-state"><div class="empty-icon">🗺️</div><div>${t==='nuevas'?'No hay rutas nuevas todavia':'No hay rutas vencidas'}</div></div>`
      : sourceList.map(r => renderRouteCard(r, t==='vencidas')).join('');
  }
  document.querySelectorAll('.sub-tab-bar button').forEach(b => {
    b.style.background = 'var(--surface2)';
    b.style.color = 'var(--text2)';
  });
  event.target.style.background = 'rgba(255,68,68,0.2)';
  event.target.style.color = '#ff4444';
}

function setEventSubTab(t) {
  eventSubTab = t;
  const upcoming = STATE.events.filter(e => e.status === 'activo');
  const past = STATE.events.filter(e => e.status !== 'activo');
  const list = document.getElementById('eventos-list');
  if (list) {
    list.innerHTML = (t === 'proximos' ? upcoming : past).map(ev => renderEventCard(ev)).join('') || '<div class="empty-state"><div class="empty-icon">📅</div><div>Sin eventos</div></div>';
  }
  document.querySelectorAll('.sub-tab-bar button').forEach(b => {
    b.style.background = 'var(--surface2)';
    b.style.color = 'var(--text2)';
  });
  if (event && event.target) {
    event.target.style.background = 'rgba(255,68,68,0.2)';
    event.target.style.color = '#ff4444';
  }
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function deselectRoute() {
  STATE.selectedRoute = null;
  renderRutas();
}

function initRutasMap() {
  const mapEl = document.getElementById('map-rutas');
  if (!mapEl) return;
  if (STATE.map) { STATE.map.remove(); STATE.map = null; }
  if (STATE.rutaWatchId !== null) { navigator.geolocation.clearWatch(STATE.rutaWatchId); STATE.rutaWatchId = null; }

  const map = L.map('map-rutas', {zoomControl:false, attributionControl:false}).setView([8.9824, -79.5199], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {subdomains:'abcd', maxZoom:19}).addTo(map);
  STATE.map = map;

  const sel = STATE.selectedRoute;

  if (sel) {
    // === MODO RUTA SELECCIONADA ===
    const pts = [[sel.start_lat, sel.start_lng]];
    let stops = [];
    try { stops = JSON.parse(sel.stops || '[]'); } catch(e) {}
    stops.forEach(s => { if (s.lat && s.lng) pts.push([parseFloat(s.lat), parseFloat(s.lng)]); });
    pts.push([sel.end_lat, sel.end_lng]);

    // SALIDA pill
    const startDiv = L.divIcon({className:'', html:`<div style="background:#22c55e;color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">SALIDA</div>`});
    L.marker([sel.start_lat, sel.start_lng], {icon:startDiv}).addTo(map);

    // PARADA pills
    stops.forEach((s, i) => {
      if (!s.lat || !s.lng) return;
      const stopDiv = L.divIcon({className:'', html:`<div style="background:#ff8800;color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">P${i+1}</div>`});
      L.marker([parseFloat(s.lat), parseFloat(s.lng)], {icon:stopDiv}).addTo(map);
    });

    // DESTINO pill
    const endDiv = L.divIcon({className:'', html:`<div style="background:#ef4444;color:#fff;font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">DESTINO</div>`});
    L.marker([sel.end_lat, sel.end_lng], {icon:endDiv}).addTo(map);

    // Placeholder line
    const placeholder = L.polyline(pts, {color:'#ff4444', weight:5, opacity:0.35, dashArray:'12,8'}).addTo(map);

    // Real road route via OSRM
    const coords = pts.map(p => `${p[1]},${p[0]}`).join(';');
    fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`)
      .then(res => res.json())
      .then(data => {
        if (data.code !== 'Ok' || !data.routes || !data.routes[0]) return;
        placeholder.remove();
        L.geoJSON(data.routes[0].geometry, {style: {color:'#ff4444', weight:5, opacity:1, className:'route-animated'}}).addTo(map);
      }).catch(() => {});

    // Fit to route
    if (sel.start_lat && sel.end_lat) map.fitBounds(pts, {padding: [40, 40], maxZoom: 14});

    // === UBICACION EN TIEMPO REAL ===
    if (navigator.geolocation) {
      // My location
      navigator.geolocation.getCurrentPosition(pos => {
        const {latitude:lat, longitude:lng} = pos.coords;
        if (STATE.myLocationMarker) { STATE.myLocationMarker.remove(); }
        const myIcon = L.divIcon({className:'', html:`<div style="width:16px;height:16px;background:#3b82f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px rgba(59,130,246,0.8)"></div>`});
        STATE.myLocationMarker = L.marker([lat, lng], {icon:myIcon}).addTo(map).bindPopup('Mi ubicación');
      }, () => {}, {timeout:5000});

      // Watch position for live tracking
      STATE.rutaWatchId = navigator.geolocation.watchPosition(pos => {
        const {latitude:lat, longitude:lng} = pos.coords;
        if (STATE.myLocationMarker) { STATE.myLocationMarker.remove(); }
        const myIcon = L.divIcon({className:'', html:`<div style="width:16px;height:16px;background:#3b82f6;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px rgba(59,130,246,0.8)"></div>`});
        STATE.myLocationMarker = L.marker([lat, lng], {icon:myIcon}).addTo(map).bindPopup('Mi ubicación (en vivo)');
      }, () => {}, {enableHighAccuracy:true, maximumAge:5000});
    }

    // Bikers en tiempo real
    renderBikerLiveLocations(map);

  } else {
    // === MODO VISTA GENERAL (todas las rutas) ===
    STATE.routes.forEach(r => {
      if (r.start_lat && r.start_lng) {
        L.circleMarker([r.start_lat, r.start_lng], {
          radius: 8, fillColor: '#00d4ff', color: '#a855f7', weight: 2, opacity: 1, fillOpacity: 0.8
        }).addTo(map).on('click', () => selectRoute(r.id));
      }
      try {
        const stops = JSON.parse(r.stops || '[]');
        stops.forEach((s, i) => {
          if (s.lat && s.lng) {
            L.circleMarker([s.lat, s.lng], {
              radius: 7, fillColor: '#ffaa00', color: '#ff8800', weight: 2, opacity: 1, fillOpacity: 0.8
            }).addTo(map);
          }
        });
      } catch(e) {}
      if (r.end_lat && r.end_lng) {
        L.circleMarker([r.end_lat, r.end_lng], {
          radius: 8, fillColor: '#00e676', color: '#00c853', weight: 2, opacity: 1, fillOpacity: 0.8
        }).addTo(map).on('click', () => selectRoute(r.id));
      }
    });

    // Ubicación del usuario en vista general
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        const {latitude:lat, longitude:lng} = pos.coords;
        map.setView([lat, lng], 12);
        const myIcon = L.divIcon({className:'', html:`<div style="width:14px;height:14px;background:#3b82f6;border:2px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(59,130,246,0.7)"></div>`});
        L.marker([lat, lng], {icon:myIcon}).addTo(map).bindPopup('Mi ubicación');
      }, () => {}, {timeout:5000});
    }

    const points = [];
    STATE.routes.forEach(r => {
      if (r.start_lat && r.start_lng) points.push([r.start_lat, r.start_lng]);
      if (r.end_lat && r.end_lng) points.push([r.end_lat, r.end_lng]);
    });
    if (points.length > 0) map.fitBounds(points, {padding: [30, 30]});
  }
}

function renderBikerLiveLocations(map) {
  // Muestra todos los bikers activos con ubicación en tiempo real
  // Cada biker comparte su ubicacion en STATE.users (lat/lng en tiempo real simulado)
  STATE.users.forEach(u => {
    if (!u.id || u.id === STATE.user?.id) return;
    if (!u.latitude || !u.longitude) return;
    const icon = L.divIcon({
      className:'',
      html:`<div style="width:18px;height:18px;background:${avatarColor(u.id)};border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;box-shadow:0 0 8px rgba(0,0,0,0.5)">${initials(u.username)}</div>`
    });
    if (!STATE.bikerMarkers[u.id]) {
      STATE.bikerMarkers[u.id] = L.marker([u.latitude, u.longitude], {icon}).addTo(map).bindPopup(`🏍️ ${u.username}`);
    }
  });
}

function selectRoute(id) {
  const r = STATE.routes.find(x => x.id === id);
  if (!r) return;
  STATE.selectedRoute = r;
  renderRutas();
}

function navigateToRoute(id) {

function setupEditStopPlaceSearch(idx) {
  const nameInput = document.getElementById('es-name-' + idx);
  const dropdown = document.getElementById('es-name-' + idx + '-dropdown');
  const latInput = document.getElementById('es-lat-' + idx);
  const lngInput = document.getElementById('es-lng-' + idx);
  if (!nameInput || !dropdown) return;

  let timeout = null;
  nameInput.addEventListener('input', function() {
    clearTimeout(timeout);
    const val = this.value.trim();
    if (val.length < 2) { dropdown.style.display = 'none'; return; }
    timeout = setTimeout(async () => {
      const { local, panamaPOIs, online } = await searchPlaces(val);
      const seen = new Set();
      const merged = [...local, ...panamaPOIs, ...online].filter(p => {
        const key = p.lat.toFixed(4) + ',' + p.lng.toFixed(4);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).slice(0, 8);
      showPlaceResults(dropdown, merged, { nameInput, latInput, lngInput, onSelect: () => toast('Guardado en EVA Lube 📍') });
    }, 100);
  });
  nameInput.addEventListener('blur', () => setTimeout(() => dropdown.style.display = 'none', 200));
}

function doEditRoute(id) {
  const name = document.getElementById('ert-name').value.trim();
  const desc = document.getElementById('ert-desc').value.trim();
  const startName = document.getElementById('ert-start-name').value.trim();
  const startLat = parseFloat(document.getElementById('ert-start-lat').value) || 0;
  const startLng = parseFloat(document.getElementById('ert-start-lng').value) || 0;
  const endName = document.getElementById('ert-end-name').value.trim();
  const endLat = parseFloat(document.getElementById('ert-end-lat').value) || 0;
  const endLng = parseFloat(document.getElementById('ert-end-lng').value) || 0;
  const diff = document.getElementById('ert-diff').value;
  const date = document.getElementById('ert-date').value;
  const time = document.getElementById('ert-time').value;
  const notify = document.getElementById('ert-notify').checked;

  if (!name) { toast('El nombre es obligatorio'); return; }
  if (!startLat || !startLng) { toast('Busca y selecciona un punto de SALIDA'); return; }
  if (!endLat || !endLng) { toast('Busca y selecciona un punto de DESTINO'); return; }

  const stops = [];
  // Stops from edit-stop-N fields
  document.querySelectorAll('[id^="edit-stop-"]').forEach(function(el) {
    const idx = el.id.replace('edit-stop-', '');
    const stopName = document.getElementById('es-name-' + idx);
    const stopLat = document.getElementById('es-lat-' + idx);
    const stopLng = document.getElementById('es-lng-' + idx);
    if (stopName && stopLat && stopLng && stopName.value.trim() && stopLat.value && stopLng.value) {
      stops.push({name: stopName.value.trim(), lat: parseFloat(stopLat.value), lng: parseFloat(stopLng.value)});
    }
  });
  // Stops from editstop-N fields
  document.querySelectorAll('[id^="editstop-"][id$="-name"]').forEach(function(el) {
    var stopId = el.id.replace('-name', '');
    var stopLat = document.getElementById(stopId + '-lat');
    var stopLng = document.getElementById(stopId + '-lng');
    if (el.value.trim() && stopLat && stopLng && stopLat.value && stopLng.value) {
      stops.push({name: el.value.trim(), lat: parseFloat(stopLat.value), lng: parseFloat(stopLng.value)});
    }
  });

  if (!name) { toast('El nombre es obligatorio'); return; }
  const idx = STATE.routes.findIndex(x => x.id === id);
  if (idx === -1) return;

  STATE.routes[idx] = {
    ...STATE.routes[idx],
    name,
    description: desc,
    start_lat: startLat,
    start_lng: startLng,
    start_name: startName,
    end_lat: endLat,
    end_lng: endLng,
    end_name: endName,
    difficulty: diff,
    date: date || null,
    time: time || null,
    notify: notify,
    stops: JSON.stringify(stops)
  };

  saveState();
  closeModal();
  STATE.selectedRoute = STATE.routes[idx];
  renderRutas();
  toast('Ruta actualizada!');
}

var _poiPickTarget = null;
var _poiMarkers = null;

function clearPlace(prefix) {
  // Clear from state so form re-renders without this POI
  if (prefix === 'rt-start') _routePOI.start = null;
  else if (prefix === 'rt-end') _routePOI.end = null;
  // Reopen modal to reflect cleared state
  createRoute();
}

function useMyLocation(prefix) {
  if (!navigator.geolocation) {
    toast('Geolocalizacion no disponible en este navegador');
    return;
  }
  toast('Obteniendo ubicacion...');
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const { latitude: lat, longitude: lng } = pos.coords;
      document.getElementById(prefix + '-lat').value = lat.toFixed(6);
      document.getElementById(prefix + '-lng').value = lng.toFixed(6);
      // Also set in _routePOI so POI picker knows
      if (prefix === 'rt-start') { _routePOI.start = { lat, lng }; }
      else if (prefix === 'rt-end') { _routePOI.end = { lat, lng }; }
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`, {
          headers: { 'Accept-Language': 'es' }
        });
        const data = await res.json();
        let name = data.address?.road || data.address?.neighbourhood || data.address?.suburb || data.address?.city || data.address?.town || 'Mi ubicacion';
        document.getElementById(prefix + '-name').value = name;
        toast('Ubicacion: ' + name);
      } catch(e) {
        document.getElementById(prefix + '-name').value = 'Mi ubicacion';
        toast('Ubicacion detectada');
      }
    },
    err => { toast('Sin acceso a ubicacion'); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function startPOIPicker(target) {
  _poiPickTarget = target;
  
  // Close modal completely to free the map
  closeModal();
  
  // Show floating picker bar with search
  var bar = document.createElement('div');
  bar.id = 'poi-picker-bar';
  bar.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:99999;background:var(--surface, #1a1a2e);border:1px solid var(--accent);border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(255,68,68,0.3);font-size:13px;color:var(--text);flex-wrap:wrap;max-width:95vw';
  bar.innerHTML = '<span style="font-size:16px">📍</span> <b>' + (target === 'start' ? 'SALIDA' : 'DESTINO') + '</b>' +
    '<input id="poi-map-search" type="text" placeholder="🔍 Buscar por nombre..." style="flex:1;min-width:180px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12px;outline:none" autocomplete="off" oninput="window._handlePOISearch(this.value)">' +
    '<button onclick="cancelPOIPicker()" style="background:var(--card);border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;white-space:nowrap">✕ Cancelar</button>';
  document.body.appendChild(bar);
  
  // Search filter — globally accessible via oninput attribute
  var _searchTimeout = null;
  window._handlePOISearch = function(q) {
    clearTimeout(_searchTimeout);
    q = (q || '').trim().toLowerCase();
    _searchTimeout = setTimeout(function() {
      var norm = function(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
      var nq = norm(q);
      var pois = PANAMA_POIS || [];
      if (q.length >= 2) {
        pois = pois.filter(function(p) {
          return norm(p.name).indexOf(nq) !== -1 ||
                 norm(p.subcategory).indexOf(nq) !== -1 ||
                 norm(p.category).indexOf(nq) !== -1 ||
                 norm(p.address).indexOf(nq) !== -1;
        });
      }
      renderPOIs(pois);
    }, 100);
  };
  
  // Load POIs onto map
  loadPOIsToMap();
  
  // Color-code by category for circle markers (mismos colores que la capa del picker)
  function catColor(cat) {
    return _poiCatColor(cat);
  }

  // Show POIs
  function loadPOIsToMap() {
    if (!STATE.map) return;
    if (_poiMarkers) { STATE.map.removeLayer(_poiMarkers); }

    var pois = PANAMA_POIS || [];
    if (pois.length === 0) {
      // Try loading
      loadPanamaPOIs()
        .then(() => { if (PANAMA_POIS.length) renderPOIs(PANAMA_POIS); else toast('No se pudo cargar la base de datos'); })
        .catch(() => toast('No se pudo cargar la base de datos'));
      return;
    }
    renderPOIs(pois);
  }
  
  function renderPOIs(pois) {
    // Remove old markers first to avoid stacking
    if (_poiMarkers) { STATE.map.removeLayer(_poiMarkers); _poiMarkers = null; }
    _poiMarkers = L.featureGroup();
    
    // Store POI data globally for popup onclick access
    window._poiDataMap = {};
    
    pois.forEach(function(p, idx) {
      var icon = p.icon || '📍';
      var color = catColor(p.category);
      var marker = L.circleMarker([p.lat, p.lng], {
        radius: 6,
        fillColor: color,
        color: '#fff',
        weight: 1.5,
        fillOpacity: 0.85
      });
      
      var poiId = 'poi-' + idx;
      window._poiDataMap[poiId] = p;
      
      var targetLabel = _poiPickTarget === 'start' ? 'SALIDA' : 'DESTINO';
      var altLabel = _poiPickTarget === 'start' ? 'DESTINO' : 'SALIDA';
      
      var popupHtml = '<div style="min-width:180px;font-size:12px">' +
        '<div style="font-size:14px;font-weight:700;margin-bottom:4px">' + icon + ' ' + escHtml(p.name || 'Lugar') + '</div>' +
        '<div style="color:var(--text2);margin-bottom:2px">' + escHtml(p.subcategory || p.category || '') + '</div>' +
        (p.address ? '<div style="color:var(--text3);font-size:11px;margin-bottom:6px">' + escHtml(p.address) + '</div>' : '') +
        '<div style="display:flex;gap:6px;margin-top:6px">' +
          '<button data-poi-id="' + poiId + '" data-action="pick" style="flex:1;background:var(--accent);color:#fff;border:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600">✅ ' + targetLabel + '</button>' +
          '<button data-poi-id="' + poiId + '" data-action="alt" style="flex:1;background:var(--card);border:1px solid var(--border);color:var(--text2);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:11px">' + altLabel + '</button>' +
        '</div>' +
      '</div>';
      
      marker.bindPopup(popupHtml, {maxWidth: 280});
      marker.bindTooltip(icon + ' ' + (p.name || 'Lugar'), {direction:'top', offset:[0,-8], opacity:1, className: 'poi-tooltip'});
      // Larger markers for easier tapping
      marker.setRadius(8);
      _poiMarkers.addLayer(marker);
    });
    
    STATE.map.addLayer(_poiMarkers);
    
    // Delegate click events from popup buttons (remove old listener first)
    STATE.map.off('popupopen');
    STATE.map.on('popupopen', function(e) {
      setTimeout(function() {
        document.querySelectorAll('[data-poi-id][data-action]').forEach(function(btn) {
          btn.onclick = function() {
            var poiId = this.getAttribute('data-poi-id');
            var action = this.getAttribute('data-action');
            var p = window._poiDataMap[poiId];
            if (!p) return;
            if (action === 'pick') {
              selectPOIFromMap(p.lat, p.lng, p.name);
            } else {
              selectPOIFromMapAlt(p.lat, p.lng, p.name);
            }
          };
        });
      }, 50);
    });
    
    // Fit map to show all markers
    try {
      var bounds = _poiMarkers.getBounds();
      STATE.map.fitBounds(bounds, {padding: [30,30], maxZoom: 16});
    } catch(e) {}
    
    toast(pois.length + ' lugares en el mapa — haz clic en un marcador para seleccionar');
  }
}

function parseGmapsUrl(url) {
  // Handle various Google Maps URL formats
  // Format 1: @lat,lng,z - direct coordinates
  // Format 2: /place/Name/@lat,lng - place with coordinates
  // Format 3: ?query=lat,lng - search query
  // Format 4: !3dlocation=lat,lng!4d - data coordinates
  const patterns = [
    /@(-?\d+\.?\d*),(-?\d+\.?\d*)/,
    /!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/,
    /query=(-?\d+\.?\d*)%2C(-?\d+\.?\d*)/,
    /\?q=(-?\d+\.?\d*),(-?\d+\.?\d*)/,
    /\/place\/[^\/]+\/(-?\d+\.?\d*),(-?\d+\.?\d*)/
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  }
  return null;
}

  const startNameEl = document.getElementById('rt-start-selected-name');
  const endNameEl = document.getElementById('rt-end-selected-name');
  const startName = startNameEl ? startNameEl.textContent.trim() : '';
  const endName = endNameEl ? endNameEl.textContent.trim() : '';
  const startLat = parseFloat(document.getElementById('rt-start-lat').value) || 0;
  const startLng = parseFloat(document.getElementById('rt-start-lng').value) || 0;
  const endLat = parseFloat(document.getElementById('rt-end-lat').value) || 0;
  const endLng = parseFloat(document.getElementById('rt-end-lng').value) || 0;
  const diff = document.getElementById('rt-diff').value;
  const date = document.getElementById('rt-date').value;
  const time = document.getElementById('rt-time').value;
  const notify = document.getElementById('rt-notify').checked;

  // Collect stops
  const stops = [];
  document.querySelectorAll('[id^="stop-"][id$="-name"]').forEach(function(el) {
    var stopId = el.id.replace('-name', '');
    var stopLat = parseFloat(document.getElementById(stopId + '-lat').value) || 0;
    var stopLng = parseFloat(document.getElementById(stopId + '-lng').value) || 0;
    if (el.value.trim() && stopLat && stopLng) {
      stops.push({name: el.value.trim(), lat: stopLat, lng: stopLng});
    }
  });

  if (!name) { toast('El nombre es obligatorio'); return; }
  if (!startLat || !startLng) { toast('Busca y selecciona un punto de SALIDA'); return; }
  if (!endLat || !endLng) { toast('Busca y selecciona un punto de DESTINO'); return; }
  const route = {
    id: Date.now() % 100000,
    name,
    description: desc,
    start_lat: startLat,
    start_lng: startLng,
    start_name: startName,
    end_lat: endLat,
    end_lng: endLng,
    end_name: endName,
    difficulty: diff,
    date: date || null,
    time: time || null,
    notify: notify,
    stops: JSON.stringify(stops),
    created_by: STATE.user.id,
    created_at: new Date().toISOString().slice(0,19).replace('T',' ')
  };
  STATE.routes.push(route);
  saveState();
  closeModal();
  STATE.selectedRoute = route;
  renderRutas();
  toast('Ruta creada!');
  bsNotifyAll('🏍️ Nueva ruta: ' + name,
    'Salida: ' + (startName || 'ver detalles') + (date ? (' · ' + date + (time ? ' ' + time : '')) : ''),
    'ruta');
}

async function deleteRoute(id) {
  if (!confirm('¿Eliminar esta ruta?')) return;
  // Mark as deleted to block cloud sync from restoring it
  STATE._deletedRouteIds = STATE._deletedRouteIds || [];
  STATE._deletedRouteIds.push(id);
  ls('_deletedRoutes', STATE._deletedRouteIds);
  // Delete from IndexedDB if exists
  if (DB) { try { await idbDelete('routes', id); } catch(e) {} }
  // Remove from STATE
  STATE.routes = STATE.routes.filter(r => r.id !== id);
  STATE.selectedRoute = null;
  // Save local immediately
  ls('bs_routes', STATE.routes);
  // Push to cloud immediately so it doesn't come back
  if (HV.connected) {
    await saveToHV('routes', STATE.routes);
    // After cloud synced, remove from deleted list
    STATE._deletedRouteIds = STATE._deletedRouteIds.filter(i => i !== id);
    ls('_deletedRoutes', STATE._deletedRouteIds);
  }
  renderRutas();
  toast('Ruta eliminada');
}

// Live preview when user selects a new avatar
async function previewAvatarUpload(event, userId) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast('Imagen muy grande (máx 8MB)'); return; }
  const compressed = await compressImage(file, 800, 0.82);
  if (!compressed) { toast('No se pudo procesar la imagen'); return; }
  // Store on user record (saved on submit)
  const r = STATE.users.find(u => u.id === userId);
  if (!r) return;
  r.avatar = compressed;
  // Live preview in modal
  const prev = document.getElementById('ed-avatar-preview');
  if (prev) prev.innerHTML = renderAvatar(r, 96);
  // Show "Quitar" button
  event.target.insertAdjacentHTML('afterend',
    `<button type="button" id="ed-avatar-clear" style="display:inline-block;margin-left:8px;padding:8px 14px;background:transparent;border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--danger);cursor:pointer" onclick="clearAvatar(${userId})">Quitar</button>`);
  toast('Foto cargada — guarda para aplicar');
}

function clearAvatar(userId) {
  const r = STATE.users.find(u => u.id === userId);
  if (!r) return;
  r.avatar = null;
  const prev = document.getElementById('ed-avatar-preview');
  if (prev) prev.innerHTML = renderAvatar(r, 96);
  const clr = document.getElementById('ed-avatar-clear');
  if (clr) clr.remove();
  const fileIn = document.getElementById('ed-avatar');
  if (fileIn) fileIn.value = '';
  toast('Foto quitada — guarda para confirmar');
}

function resolveHvMedia() {
  if (!HV.user || !HV.pass) return;
  document.querySelectorAll('video[src], audio[src]').forEach(el => {
    const src = el.src;
    // Skip data URLs, blob URLs, and already-resolved URLs
    if (!src || src.startsWith('data:') || src.startsWith('blob:')) return;
    // Only handle HeyValue WebDAV URLs
    if (!src.includes('/dav/files/')) return;
    // Already resolved?
    if (el.dataset.hvResolved === '1') return;
    el.dataset.hvResolved = '1';
    resolveMediaUrl(src).then(blobUrl => {
      if (blobUrl !== src) {
        el.src = blobUrl;
        el.load();
      }
    }).catch(() => {});
  });
}

// Render media block for a post (image / video / audio / none)

  }
  // image (default) — hover overlay with "Abrir"
  return `<div style="position:relative;background:#000;overflow:hidden;cursor:pointer" onclick="openLightbox('${resolveMediaUrlSync(url, 'image')}')">
    <img src="${resolveMediaUrlSync(url, 'image')}" loading="lazy" decoding="async" data-lightbox="1" style="display:block;width:100%;max-height:75vh;object-fit:contain;background:#000"
         onload="(function(img){var r=img.naturalHeight/img.naturalWidth;if(r>1.3){img.style.maxHeight='80vh';img.style.width='auto';img.style.maxWidth='100%';img.style.margin='0 auto';}else if(r<0.6){img.style.maxHeight='55vh';}})(this)">
    <div style="position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;transition:background 0.2s;pointer-events:none"

// Resolve media URL: blob/data URLs pass through, HeyValue WebDAV URLs get fetched with auth
const _mediaCache = {};
async function resolveMediaUrl(url, type) {
  if (!url) return url;
  if (url.startsWith('data:') || url.startsWith('blob:') || url.startsWith('http') && !url.includes('dav/files')) return url;
  if (_mediaCache[url]) return _mediaCache[url];
  if (!url.includes('/dav/files/')) return url;
  try {
    const res = await fetch(url, { headers: { Authorization: 'Basic ' + btoa(HV.user + ':' + HV.pass) } });
    if (!res.ok) return url;
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    _mediaCache[url] = blobUrl;
    return blobUrl;
  } catch { return url; }
}
function resolveMediaUrlSync(url) {
  if (!url) return url;
  // For HeyValue WebDAV URLs, inject Basic auth so browser can load media directly
  // (used by image lightbox which doesn't go through EC2 proxy)
  if (url.includes('/dav/') && HV.user && HV.pass && !url.includes('@')) {
    return url.replace('https://', `https://${encodeURIComponent(HV.user)}:${encodeURIComponent(HV.pass)}@`);
  }
  return url;
}

function sharePost(postId) {

  if (navigator.share) {
    navigator.share({title: 'BikerGram', text}).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => toast('Enlace copiado!')).catch(() => toast('No se pudo copiar'));
  }
}

function toggleLike(postId) {
  if (!STATE.user) { toast('Inicia sesion para dar like'); return; }
  const p = STATE.posts.find(x => x.id === postId);
  if (!p) return;
  p.likes = p.likes || [];
  const uid = String(STATE.user.id);
  const wasLiked = p.likes.includes(uid);
  if (wasLiked) {
    p.likes = p.likes.filter(l => l !== uid);
  } else {
    p.likes.push(uid);
    if (p.user_id !== STATE.user.id) {
      STATE.notifications.push({id:Date.now(), user_id:p.user_id, actor_id:STATE.user.id, type:'like', message:STATE.user.username + ' le gusto tu publicacion', link:'/feed', read:false, created_at:new Date().toISOString()});
    }
    // Animate like button on add
    const btn = document.querySelector(`[data-like-btn="${postId}"]`);
    if (btn) {
      const icon = btn.querySelector('.like-icon');
      if (icon) {
        icon.style.transform = 'scale(1.5)';
        setTimeout(() => { icon.style.transform = 'scale(1)'; }, 250);
      }
      btn.classList.add('like-burst');
      setTimeout(() => btn.classList.remove('like-burst'), 600);
    }
  }
  saveState();
  // Update like count without re-rendering the whole feed (preserves scroll & media state)
  const countEl = document.querySelector(`[data-count="${postId}"]`);
  // Update button visual state (neon glow)
  const btn = document.querySelector(`[data-like-btn="${postId}"]`);
  if (btn) {
    const isLiked = !wasLiked;
    if (isLiked) {
      btn.classList.add('liked');
      btn.classList.add('liked-neon');
    } else {
      btn.classList.remove('liked');
      btn.classList.remove('liked-neon');
    }
    // Update the heart icon
    const spans = btn.querySelectorAll('span');
    if (spans[0]) spans[0].textContent = isLiked ? '❤️' : '🤍';
  }
}

function addComment(postId) {

  if (!isImage && !isVideo && !isAudio) { toast('Tipo de archivo no soportado'); return; }

  // Images: max 50MB. Video/audio: no limit.
  if (isImage && file.size > 50 * 1024 * 1024) { toast('Imagen muy grande (máx 50MB)'); return; }

  const type = isImage ? 'image' : (isVideo ? 'video' : 'audio');
  let dataUrl;
  let fileToUpload = file;

  if (isImage) {
    // Feedback inmediato: leer + decodificar una foto de cámara (10-50MB) tarda 1-3s
    const preview = document.getElementById('post-media-preview');
    if (preview) {
      preview.style.display = 'block';
      preview.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:28px;color:var(--text2);font-size:13px;background:rgba(255,255,255,0.03);border-radius:12px">
        <div style="width:18px;height:18px;border:2px solid rgba(255,255,255,0.15);border-top-color:#ff4444;border-radius:50%;animation:avatarRing 0.8s linear infinite"></div>
        Procesando foto...</div>`;
    }
    // Optimizado para el feed: 1280px en WebP => nítido en el teléfono pero
    // mucho más ligero, así carga rápido. Si aún pesa, baja escalonado hasta
    // ~350 KB (480K chars de data URL ≈ 350 KB reales).
    dataUrl = await compressImage(file, 1280, 0.72);
    if (dataUrl && dataUrl.length > 480 * 1024) dataUrl = await compressImage(file, 1080, 0.66) || dataUrl;
    if (dataUrl && dataUrl.length > 480 * 1024) dataUrl = await compressImage(file, 900, 0.6) || dataUrl;
    if (!dataUrl) { toast('No se pudo procesar la imagen'); renderPostPreview(); return; }
  } else if (isVideo) {
    // Compress video with FFmpeg (720p, small file)
    const preview = document.getElementById('post-media-preview');
    if (preview) preview.innerHTML = '<div style="text-align:center;color:var(--text2);padding:20px">Comprimiendo video... esto puede tardar un momento</div>';
    const compressed = await compressVideo(file, null);
    if (compressed) {
      dataUrl = URL.createObjectURL(compressed);
      fileToUpload = compressed;
      toast('Video comprimido!');
    } else {
      dataUrl = URL.createObjectURL(file);
    }
  } else {
    // Audio: use blob URL
    dataUrl = URL.createObjectURL(file);
  }

  // Para imágenes, el dataUrl ya es la versión comprimida (WebP/JPEG): se sube
  // con su content-type y extensión reales, y se muestra su tamaño reducido.
  let outMime = file.type, outName = file.name, outSize = fileToUpload.size;
  if (isImage && dataUrl && dataUrl.startsWith('data:')) {
    outMime = dataUrl.substring(5, dataUrl.indexOf(';'));
    const ext = outMime === 'image/webp' ? 'webp' : (outMime === 'image/png' ? 'png' : 'jpg');
    outName = (file.name || 'foto').replace(/\.[^.]+$/, '') + '.' + ext;
    outSize = Math.round((dataUrl.length - dataUrl.indexOf(',') - 1) * 3 / 4);
  }

  POST_DRAFT = {
    type,
    dataUrl,
    file: fileToUpload,
    fileName: outName,
    fileSize: outSize,
    mimeType: outMime,
    originalSize: file.size,
  };

  renderPostPreview();
}

// ============================================================
// VIDEO COMPRESSION via FFmpeg.wasm
// ============================================================
let ffmpegInstance = null;
let ffmpegLoading = false;

async function loadFFmpeg(onProgress) {
  if (ffmpegInstance) return ffmpegInstance;
  if (ffmpegLoading) {
    // Wait for existing load
    while (ffmpegLoading) await new Promise(r => setTimeout(r, 500));
    return ffmpegInstance;
  }
  ffmpegLoading = true;
  try {
    const { FFmpeg } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm');
    const { fetchFile } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm');
    const ff = new FFmpeg();
    ff.on('progress', ({ progress }) => {
      if (onProgress) onProgress(progress * 100);
    });
    await ff.load({
      coreURL: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
      wasmURL: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm',
    });
    ffmpegInstance = { ff, fetchFile };
    return ffmpegInstance;
  } catch(e) {
    ffmpegLoading = false;
    throw e;
  } finally {
    ffmpegLoading = false;
  }
}

async function compressVideo(file, onProgress) {
  try {
    const { ff, fetchFile } = await loadFFmpeg(onProgress);
    const inputName = 'input_' + Date.now() + '.mp4';
    const outputName = 'output_' + Date.now() + '.mp4';

    // Write input file
    const inputData = await fetchFile(file);
    await ff.writeFile(inputName, inputData);

    // Compress: 720p, CRF 23 (high quality), fast preset — targets ~1MB/min
    await ff.exec([
      '-i', inputName,
      '-vf', 'scale=-2:720',
      '-c:v', 'libx264',
      '-preset', 'fast',
      '-crf', '23',
      '-c:a', 'aac',
      '-b:a', '64k',
      '-movflags', '+faststart',
      outputName
    ]);

    // Read compressed output
    const data = await ff.readFile(outputName);
    const blob = new Blob([data.buffer], { type: 'video/mp4' });

    // Cleanup
    await ff.deleteFile(inputName);
    await ff.deleteFile(outputName);

    return blob;
  } catch(e) {
    console.warn('Video compression failed:', e);
    return null;
  }
}

function renderPostPreview() {
  const preview = document.getElementById('post-media-preview');
  const zone = document.getElementById('post-media-zone');
  const typeIndicator = document.getElementById('post-media-type');
  if (!POST_DRAFT || !POST_DRAFT.dataUrl) {
    preview.style.display = 'none';
    preview.innerHTML = '';
    if (zone) zone.style.display = 'block';
    if (typeIndicator) typeIndicator.style.display = 'none';
    return;
  }
  if (zone) zone.style.display = 'none';
  preview.style.display = 'block';
  const sizeKB = Math.round(POST_DRAFT.fileSize / 1024);
  const typeEmoji = POST_DRAFT.type === 'image' ? '📷' : (POST_DRAFT.type === 'video' ? '🎬' : '🎵');
  const typeLabel = POST_DRAFT.type === 'image' ? 'Imagen' : (POST_DRAFT.type === 'video' ? 'Video' : 'Audio');

  if (POST_DRAFT.type === 'image') {
    preview.innerHTML = `
      <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
        <img src="${POST_DRAFT.dataUrl}" style="display:block;width:100%;max-height:70vh;object-fit:contain;background:#000" onload="(function(img){var r=img.naturalHeight/img.naturalWidth;if(r>1.3){img.style.maxHeight='75vh';img.style.width='auto';img.style.maxWidth='100%';img.style.margin='0 auto'}})(this)">
        <button type="button" onclick="clearPostMedia()" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;backdrop-filter:blur(8px)">✕</button>
        <div style="position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.7);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;backdrop-filter:blur(8px)">${typeEmoji} ${typeLabel} · ${sizeKB}KB</div>
      </div>
    `;
  } else if (POST_DRAFT.type === 'video') {
    const sizeMB = (POST_DRAFT.fileSize / 1024 / 1024).toFixed(1);
    const origMB = POST_DRAFT.originalSize ? (POST_DRAFT.originalSize / 1024 / 1024).toFixed(1) : null;
    const compressionNote = (origMB && origMB !== sizeMB)
      ? `<span style="color:#22c55e"> · Comprimido ${origMB}MB → ${sizeMB}MB</span>`
      : `<span> · ${sizeMB}MB</span>`;
    preview.innerHTML = `
      <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
        <video src="${POST_DRAFT.dataUrl}" controls style="display:block;width:100%;max-height:480px;background:#000"></video>
        <button type="button" onclick="clearPostMedia()" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;backdrop-filter:blur(8px);z-index:5">✕</button>
        <div style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.7);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:4px">${typeEmoji} VIDEO${compressionNote}</div>
      </div>
    `;
  } else {
    // audio
    preview.innerHTML = `
      <div style="position:relative;border-radius:12px;background:linear-gradient(135deg,rgba(255,68,68,0.15),rgba(255,136,0,0.15));border:1px solid var(--border);padding:14px">
        <button type="button" onclick="clearPostMedia()" style="position:absolute;top:8px;right:8px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer">✕</button>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
          <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ff4444,#ff8800);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;animation:audioPulse 2s ease-in-out infinite">🎵</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${POST_DRAFT.fileName}</div>
            <div style="font-size:11px;color:var(--text2)">${typeEmoji} ${typeLabel} · ${sizeKB}KB</div>
          </div>
        </div>
        <audio src="${POST_DRAFT.dataUrl}" controls style="width:100%"></audio>
      </div>
    `;
  }
  if (typeIndicator) {
    typeIndicator.style.display = 'block';
    const origMB = POST_DRAFT.originalSize ? (POST_DRAFT.originalSize / 1024 / 1024).toFixed(1) : null;
    const compressionNote = (POST_DRAFT.type === 'video' && origMB && origMB !== (POST_DRAFT.fileSize / 1024 / 1024).toFixed(1))
      ? ` · Comprimido de ${origMB}MB`
      : '';
    typeIndicator.textContent = `${typeEmoji} ${typeLabel} detectado — listo para publicar${compressionNote}`;
  }
}

function clearPostMedia() {
  POST_DRAFT = { type: null, dataUrl: null, file: null, fileName: '', fileSize: 0, mimeType: null };
  ['image','video','audio'].forEach(t => {
    const inp = document.getElementById('post-file-' + t);
    if (inp) inp.value = '';
  });
  renderPostPreview();
}

 async function doCreatePost() {
  const content = document.getElementById('post-content').value.trim();
  if (!content && (!POST_DRAFT || !POST_DRAFT.dataUrl)) { toast('Escribe algo o sube una foto/video/audio'); return; }
  if (!STATE.user) { toast('Inicia sesion primero'); return; }

  // Close modal immediately
  closeModal();

  // Prepare media data for instant display
  let mediaData = null;
  if (POST_DRAFT?.dataUrl) {
    mediaData = {
      type: POST_DRAFT.type,
      url: POST_DRAFT.dataUrl,
      blob: null,
      fileName: POST_DRAFT.fileName,
      mimeType: POST_DRAFT.mimeType
    };
    // Get blob for background upload
    if (POST_DRAFT.dataUrl.startsWith('data:')) {
      mediaData.blob = dataURLtoBlob(POST_DRAFT.dataUrl);
    } else {
      mediaData.blob = await fetch(POST_DRAFT.dataUrl).then(r => r.blob()).catch(() => null);
    }
  }

  // Create post INSTANTLY - shows immediately
  createPostInstant(content, mediaData);

  // Upload media in background (already handled by createPostInstant)
  toast('Publicado!');
  bsNotifyAll('📸 Nuevo post en BikerGram',
    (STATE.user?.username ? STATE.user.username + ': ' : '') + (content || 'Nueva publicación'),
    'post');
}

async function deletePost(id) {
  if (!confirm('Eliminar esta publicacion?')) return;
  // Mark as deleted to block background sync from restoring it
  STATE._deletedIds = STATE._deletedIds || [];
  STATE._deletedIds.push(id);
  ls('_deletedPosts', STATE._deletedIds); // persist so reload doesn't forget
  // Delete from IndexedDB immediately
  if (DB) await idbDelete('posts', id);
  // Remove from STATE
  STATE.posts = STATE.posts.filter(p => p.id !== id);
  renderBikerGram();
  // Save local first
  saveLocal();
  // Push to cloud immediately so it doesn't come back
  if (HV.connected) {
    await saveToHV('posts', STATE.posts);
    // After cloud synced, remove from deleted list
    STATE._deletedIds = (STATE._deletedIds || []).filter(i => i !== id);
    ls('_deletedPosts', STATE._deletedIds);
  }
  toast('Eliminado');
}

function renderEventos() {

function showEventTab(tab, btn) {
  document.querySelectorAll('.tab-bar .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const list = tab === 'proximos' ? STATE.events.filter(e => e.status === 'activo') : STATE.events.filter(e => e.status !== 'activo');
  document.getElementById('eventos-list').innerHTML = list.length === 0
    ? '<div class="empty-state"><div class="empty-icon">📅</div><div>Sin eventos</div></div>'
    : list.map(ev => renderEventCard(ev)).join('');
}

function renderEventCard(ev) {
  const attCount = STATE.attendance.filter(a => a.event_id === ev.id).length;
  const myAtt = STATE.user && STATE.attendance.find(a => a.event_id === ev.id && a.user_id === STATE.user.id);
  // Countdown to event
  let countdown = '';
  try {
    const eventDate = new Date(ev.date + 'T' + (ev.time || '00:00'));
    const diff = eventDate - new Date();
    if (diff > 0) {
      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      if (days > 0) countdown = `${days}d ${hours}h`;
      else if (hours > 0) countdown = `${hours}h ${mins}m`;
      else countdown = `${mins}m`;
    } else {
      const passed = Math.abs(diff);
      const days = Math.floor(passed / 86400000);
      countdown = days > 0 ? `Hace ${days}d` : 'Pasado';
    }
  } catch(e) {}

  // Gradient based on difficulty
  const diffGradients = {
    facil: 'linear-gradient(135deg,rgba(34,197,94,0.3),rgba(16,185,129,0.15))',
    intermedia: 'linear-gradient(135deg,rgba(245,158,11,0.3),rgba(255,68,68,0.15))',
    alta: 'linear-gradient(135deg,rgba(239,68,68,0.3),rgba(220,38,38,0.15))',
    epica: 'linear-gradient(135deg,rgba(156,39,176,0.3),rgba(67,56,202,0.15))',
  };
  const gradient = diffGradients[ev.difficulty] || 'linear-gradient(135deg,rgba(255,68,68,0.3),rgba(255,136,0,0.15))';

  return `
    <div class="event-card vanish" onclick="viewEvent(${ev.id})" style="overflow:hidden;cursor:pointer;border-radius:16px;border:1px solid var(--border);background:var(--surface);margin-bottom:12px;transition:transform 0.2s" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='none'">
      <div style="height:120px;background:${gradient};display:flex;align-items:center;justify-content:space-between;padding:16px;position:relative">
        <div style="font-size:48px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3))">🏍️</div>
        <div style="text-align:right">
          <div style="background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);color:#fff;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:800">${countdown}</div>
        </div>
      </div>
      <div style="padding:14px 16px">
        <div style="font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px">${ev.date} · ${ev.time}</div>
        <div style="font-size:16px;font-weight:800;margin-bottom:8px;line-height:1.3">${escHtml(ev.title)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-bottom:10px">
          <span>📍 ${escHtml(ev.location || 'N/A')}</span>
          <span>⚡ ${ev.difficulty}</span>
          <span>👥 ${attCount}</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          ${myAtt
            ? '<span class="badge-green" style="font-size:11px;padding:4px 10px">✅ Confirmado</span>'
            : `<button onclick="event.stopPropagation();confirmEvent(${ev.id})" style="flex:1;padding:8px 14px;background:linear-gradient(135deg,#ff4444,#ff8800);border:none;border-radius:10px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='none'">+ Confirmar asistencia</button>`}
          <button onclick="event.stopPropagation();viewEvent(${ev.id})" style="padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text2);cursor:pointer;font-size:12px">👁️</button>
        </div>
      </div>
    </div>
  `;
}

function viewEvent(id) {
  const ev = STATE.events.find(x => x.id === id);
  if (!ev) return;
  const attCount = STATE.attendance.filter(a => a.event_id === ev.id).length;
  const attList = STATE.attendance.filter(a => a.event_id === ev.id).map(a => STATE.users.find(u => u.id === a.user_id)).filter(Boolean);
  const myAtt = STATE.user && STATE.attendance.find(a => a.event_id === ev.id && a.user_id === STATE.user.id);
  // Reminder state
  const remKey = 'bs_event_rem_' + ev.id + '_' + (STATE.user ? STATE.user.id : '');
  const hasReminder = ls(remKey) ? true : false;

  openModal(ev.title, `
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">
      📅 ${ev.date} · 🕐 ${ev.time}<br>
      📍 ${ev.location || 'N/A'} · ⚡ ${ev.difficulty}
    </div>
    ${ev.description ? `<p style="margin-bottom:16px">${ev.description}</p>` : ''}
    <div style="margin-bottom:16px">
      <div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px">ASISTENTES (${attCount})</div>
      ${attList.length === 0 ? '<div style="font-size:12px;color:var(--text3)">Nadie ha confirmado aun</div>' :
        attList.slice(0, 8).map(u => `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px">
          ${renderAvatar(u, 28)}
          <span>${u.username}</span>
          ${u.is_injured ? '<span class="badge-red" style="font-size:9px">LESIONADO</span>' : ''}
        </div>`).join('')}
      ${attList.length > 8 ? `<div style="font-size:11px;color:var(--text3);margin-top:4px">+${attList.length-8} más</div>` : ''}
    </div>
    ${myAtt
      ? '<button class="btn btn-secondary" style="width:100%" onclick="cancelEvent(' + ev.id + ')">Cancelar asistencia</button>'
      : '<button class="btn btn-primary" style="width:100%" onclick="confirmEvent(' + ev.id + ')">Confirmar asistencia</button>'}
    <div style="margin-top:10px;display:flex;gap:6px;align-items:center;background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.15);border-radius:10px;padding:10px">
      <div style="font-size:18px">⏰</div>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:700">Recordatorio</div>
        <div style="font-size:10px;color:var(--text2)">${hasReminder ? 'Activado · te avisaremos antes' : 'Recibe una notificacion antes del evento'}</div>
      </div>
      <button onclick="toggleEventReminder(${ev.id})" style="padding:6px 12px;background:${hasReminder ? 'rgba(255,68,68,0.15)' : 'var(--surface2)'};border:1px solid ${hasReminder ? 'rgba(255,68,68,0.3)' : 'var(--border)'};border-radius:8px;color:${hasReminder ? '#ff4444' : 'var(--text2)'};font-size:11px;font-weight:700;cursor:pointer">${hasReminder ? 'Quitar' : 'Activar'}</button>
    </div>
    ${STATE.user?.is_admin ? `<button class="btn btn-ghost" style="width:100%;margin-top:8px;color:var(--danger)" onclick="deleteEvent(${ev.id})">Eliminar evento</button>` : ''}
  `);
}

function confirmEvent(id) {
  if (!STATE.user) { toast('Inicia sesion'); return; }
  if (STATE.attendance.find(a => a.event_id === id && a.user_id === STATE.user.id)) {
    toast('Ya confirmaste'); return;
  }
  STATE.attendance.push({id:Date.now(), user_id:STATE.user.id, event_id:id, confirmed_at:new Date().toISOString(), notes:'', status:'confirmed', featured:false});
  saveState();
  closeModal();
  navigate('rutas');
  toast('Asistencia confirmada!');
}

function cancelEvent(id) {
  STATE.attendance = STATE.attendance.filter(a => !(a.event_id === id && a.user_id === STATE.user.id));
  saveState();
  closeModal();
  navigate('rutas');
  toast('Asistencia cancelada');
}

// Event reminder — set a localStorage flag, then a global setInterval checks every 60s
// and pushes a notification if the event is within 1h and the user has confirmed
function toggleEventReminder(eventId) {
  if (!STATE.user) { toast('Inicia sesion'); return; }
  const remKey = 'bs_event_rem_' + eventId + '_' + STATE.user.id;
  if (ls(remKey)) {
    ls(remKey, null);
    toast('Recordatorio desactivado');
  } else {
    ls(remKey, { eventId, userId: STATE.user.id, at: Date.now() });
    toast('Te avisaremos 1h antes del evento');
  }
  // Re-render modal
  viewEvent(eventId);
}

// Check events every 60s and push reminder notifications
setInterval(() => {
  if (!STATE.user) return;
  const now = Date.now();
  STATE.attendance.filter(a => a.user_id === STATE.user.id).forEach(a => {
    const ev = STATE.events.find(e => e.id === a.event_id);
    if (!ev) return;
    const remKey = 'bs_event_rem_' + ev.id + '_' + STATE.user.id;
    if (!ls(remKey)) return;
    const eventTime = new Date(ev.date + 'T' + (ev.time || '00:00')).getTime();
    const diff = eventTime - now;
    // Notify when 1h before (with 5min tolerance window)
    if (diff > 55*60*1000 && diff < 65*60*1000) {
      const notifId = 'reminder_' + ev.id;
      const existing = STATE.notifications.find(n => n.id === notifId);
      if (!existing) {
        STATE.notifications.unshift({

function toggleChatSidebar() {
  const sb = document.getElementById('chat-sidebar');
  const bd = document.getElementById('chat-sidebar-backdrop');
  if (!sb) return;
  const isOpen = sb.style.transform === 'translateX(0%)';
  sb.style.transform = isOpen ? 'translateX(-100%)' : 'translateX(0%)';
  if (bd) bd.style.display = isOpen ? 'none' : 'block';
}

function setChatChannel(id) {
  CHAT_CHANNEL = id;
  renderChat();
}

function renderChatMessage(m) {
  const author = STATE.users.find(u => u.id === m.user_id) || { username: '?', id: 0, is_admin: false };
  const isMe = STATE.user && m.user_id === STATE.user.id;
  // Convert @mentions into highlighted spans
  const content = escHtml(m.content).replace(/@(\w+)/g, '<span style="color:var(--accent);font-weight:700;background:rgba(255,68,68,0.1);padding:1px 4px;border-radius:4px">@$1</span>');
  // Time
  let t = '';
  try {
    const d = new Date(m.created_at.replace(' ', 'T'));
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) t = 'ahora';
    else if (diff < 3600) t = Math.floor(diff/60) + 'm';
    else if (diff < 86400) t = Math.floor(diff/3600) + 'h';
    else t = Math.floor(diff/86400) + 'd';
  } catch(e) { t = ''; }

  return `
    <div style="display:flex;gap:8px;align-items:flex-start;${isMe?'flex-direction:row-reverse':''}">
      ${renderAvatar(author, 32)}
      <div style="max-width:75%;${isMe?'text-align:right':''}">
        <div style="font-size:10px;color:var(--text3);margin-bottom:2px;${isMe?'text-align:right':''}">
          <span style="font-weight:700;color:var(--text2)">${escHtml(author.username)}</span>
          ${author.is_admin ? '<span style="background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;padding:0 4px;border-radius:3px;font-size:8px;font-weight:800;margin-left:2px">ADMIN</span>' : ''}
          <span style="margin-left:4px">${t}</span>
        </div>
        <div style="display:inline-block;padding:8px 12px;border-radius:14px;${isMe?'background:linear-gradient(135deg,#ff4444,#ff8800);color:#fff;border-bottom-right-radius:4px':'background:var(--surface2);color:var(--text);border-bottom-left-radius:4px'};font-size:13px;line-height:1.45;word-wrap:break-word;text-align:left">
          ${content}
        </div>
      </div>
    </div>
  `;
}

function appendChatEmoji(e) {
  const inp = document.getElementById('chat-input');
  if (!inp) return;
  inp.value += e;
  inp.focus();
  autoGrowChatInput(inp);
}

function autoGrowChatInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(120, el.scrollHeight) + 'px';
}

function handleChatKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
}

let MENTION_FILTER = '';
function handleMentionInput(el) {
  const cursor = el.selectionStart;
  const text = el.value.substring(0, cursor);
  const match = text.match(/@(\w*)$/);
  if (!match) {
    document.getElementById('mention-popup').style.display = 'none';
    return;
  }
  MENTION_FILTER = match[1].toLowerCase();
  const candidates = STATE.users.filter(u => u.username.toLowerCase().includes(MENTION_FILTER)).slice(0, 6);
  if (candidates.length === 0) {
    document.getElementById('mention-popup').style.display = 'none';
    return;
  }
  const popup = document.getElementById('mention-popup');
  popup.innerHTML = candidates.map(u => `
    <div onclick="insertMention('${u.username}')" style="padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background 0.15s" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='transparent'">
      ${renderAvatar(u, 26)}
      <span style="font-size:13px;font-weight:600">${u.username}</span>
    </div>
  `).join('');
  popup.style.display = 'block';
}
function insertMention(name) {
  const inp = document.getElementById('chat-input');
  if (!inp) return;
  const cursor = inp.selectionStart;
  const text = inp.value.substring(0, cursor);
  const replaced = text.replace(/@\w*$/, '@' + name + ' ');
  inp.value = replaced + inp.value.substring(cursor);
  document.getElementById('mention-popup').style.display = 'none';
  inp.focus();
  autoGrowChatInput(inp);
}

function sendChatMessage() {
  if (!STATE.user) { toast('Inicia sesion'); return; }
  const inp = document.getElementById('chat-input');
  if (!inp) return;
  const content = inp.value.trim();
  if (!content) return;
  const msg = {
    id: Date.now() % 1000000,
    channel_id: CHAT_CHANNEL,
    user_id: STATE.user.id,
    content,
    created_at: new Date().toISOString(),
    recipient_id: null,
  };
  STATE.chatMessages.push(msg);
  // Notify mentioned users
  const mentions = content.match(/@(\w+)/g) || [];
  mentions.forEach(m => {
    const username = m.substring(1);
    const target = STATE.users.find(u => u.username === username);
    if (target && target.id !== STATE.user.id) {
      STATE.notifications.push({
        id: Date.now() + Math.random(),
        user_id: target.id,
        actor_id: STATE.user.id,
        type: 'mention',
        message: STATE.user.username + ' te menciono en #' + (STATE.chatChannels.find(c => c.id === CHAT_CHANNEL)?.name || 'chat'),
        link: '/chat',
        read: false,
        created_at: new Date().toISOString()
      });
    }
  });
  saveState();
  inp.value = '';
  autoGrowChatInput(inp);
  renderChat();
  bsNotifyAll('💬 ' + (STATE.user?.username || 'Alguien') + ' en el chat', content, 'chat');
}

function bindChatNotifications() {
  // Browser notification permission (soft request, only after a user action)
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().catch(() => {});
  }
  // In-app: when user is on chat page, listen to new messages and visual ping
  window.__chatBound = true;
}

            body: `${author.username}: ${last.content.substring(0, 80)}`,
            icon: 'icons/icon-192.png',
            tag: 'bs-chat-' + last.channel_id,
          });
        } catch (e) { /* ignore */ }
      }
      // Update bottom nav badge
      const chatNav = document.querySelector('[data-nav="chat"]');
      if (chatNav) {
        const total = STATE.chatMessages.filter(m => m.user_id !== STATE.user?.id).length;
        let badge = chatNav.querySelector('.nav-badge');
        if (!badge) {
          badge = document.createElement('div');
          badge.className = 'nav-badge';
          badge.style.cssText = 'position:absolute;top:4px;right:8px;background:#ef4444;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:8px;min-width:16px;text-align:center';
          chatNav.style.position = 'relative';
          chatNav.appendChild(badge);
        }
        badge.textContent = total > 99 ? '99+' : total;
      }
    }
  }
}, 3000);

  openModal('Crear Evento', `

function doCreateEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const desc = document.getElementById('ev-desc').value.trim();
  const date = document.getElementById('ev-date').value;
  const time = document.getElementById('ev-time').value;
  const location = document.getElementById('ev-location').value.trim();
  const diff = document.getElementById('ev-diff').value;
  if (!title || !date) { toast('Titulo y fecha son obligatorios'); return; }
  STATE.events.push({id:Date.now()%100000, title, description:desc, date, time, location, difficulty:diff, status:'activo', max_riders:0, latitude:0, longitude:0, created_by:STATE.user.id});
  saveState();
  closeModal();
  navigate('rutas');
  toast('Evento creado!');
}

function renderRetos() {
  const myChallenges = STATE.userChallenges || [];

  const special = STATE.challenges.filter(c => c.category === 'special');

  document.getElementById('page-retos').innerHTML = `

    </div>

    </div>

        <div style="font-size:12px;color:var(--text2);margin-bottom:4px">RETOS ESPECIALES</div>

function renderChallengeCard(c, myChallenges) {
  const myProg = myChallenges.find(mc => mc.challenge_id === c.id);
  const progress = myProg ? myProg.progress : 0;
  const pct = Math.min(100, (progress / c.requirement_count) * 100);
  const done = myProg && myProg.completed;
  return `
    <div class="challenge-card ${done ? 'earned' : ''}" style="margin-top:12px">
      <div class="challenge-title">
        <span style="font-size:20px">${c.icon}</span>
        ${c.title}
        ${done ? '<span class="badge-green" style="font-size:10px">COMPLETADO</span>' : ''}
      </div>
      <div class="challenge-desc">${c.description}</div>
      <div class="challenge-progress">
        <div class="challenge-track"><div class="challenge-fill" style="width:${pct}%"></div></div>
        <div class="challenge-points">${progress}/${c.requirement_count}</div>
      </div>
      <div style="margin-top:8px;font-size:12px;color:var(--accent);font-weight:600">+${c.points} pts</div>
    </div>
  `;
}

function renderAdminEditUser(id) {
  // Wrapper: opens editRider modal, but after save navigates back to admin users list
  const _origDoEdit = doEditRider;
  window.doEditRider = function(uid) {
    const r = STATE.users.find(u => u.id === uid);
    if (!r) return;
    const isAdmin = STATE.user?.is_admin;
    r.username = document.getElementById('ed-username').value.trim() || r.username;
    r.email = document.getElementById('ed-email').value.trim() || r.email;
    r.bike_model = document.getElementById('ed-bike').value.trim();
    r.city = document.getElementById('ed-city').value.trim();
    r.bio = document.getElementById('ed-bio').value.trim();
    const newPass = document.getElementById('ed-pass')?.value;
    if (newPass) r.password = newPass;
    if (isAdmin) {
      const edIsAdmin = document.getElementById('ed-isadmin');
      const edIsInjured = document.getElementById('ed-isinjured');
      const edPoints = document.getElementById('ed-points');
      if (edIsAdmin) r.is_admin = edIsAdmin.checked;
      if (edIsInjured) r.is_injured = edIsInjured.checked;
      if (edPoints) r.points = parseInt(edPoints.value) || r.points;
    }
    if (STATE.user?.id === uid) STATE.user = r;
    ls('bs_session', STATE.user);
    saveState();
    recalculateUserStats(uid);

function deleteUser(id) {

  const deletedUsers = ls('_deletedUsers') || [];
  if (!deletedUsers.includes(id)) {
    deletedUsers.push(id);
    ls('_deletedUsers', deletedUsers);
  }
  STATE.users = STATE.users.filter(x => x.id !== id);
  STATE.userBadges = STATE.userBadges.filter(ub => ub.user_id !== id);
  STATE.userChallenges = STATE.userChallenges.filter(uc => uc.user_id !== id);
  STATE.attendance = STATE.attendance.filter(a => a.user_id !== id);
  STATE.notifications = STATE.notifications.filter(n => n.user_id !== id && n.actor_id !== id);
  STATE.comments = STATE.comments.filter(c => c.user_id !== id);
  if (STATE.user?.id === id) { logout(); return; }

}

// ===== INDEXED DB LAYER =====
let DB = null;
const DB_NAME = 'BikerGramDB';
const DB_VERSION = 1;
const STORES = ['posts', 'comments', 'follows', 'sync_queue'];

function initIndexedDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { DB = req.result; resolve(DB); };
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('posts')) {
        const ps = db.createObjectStore('posts', {keyPath: 'id'});
        ps.createIndex('user_id', 'user_id', {unique: false});
        ps.createIndex('created_at', 'created_at', {unique: false});
      }
      if (!db.objectStoreNames.contains('comments')) {
        const cm = db.createObjectStore('comments', {keyPath: 'id', autoIncrement: true});
        cm.createIndex('post_id', 'post_id', {unique: false});
      }
      if (!db.objectStoreNames.contains('follows')) {
        const fl = db.createObjectStore('follows', {keyPath: 'id'});
        fl.createIndex('follower_id', 'follower_id', {unique: false});
        fl.createIndex('following_id', 'following_id', {unique: false});
      }
      if (!db.objectStoreNames.contains('sync_queue')) {
        const sq = db.createObjectStore('sync_queue', {keyPath: 'id', autoIncrement: true});
        sq.createIndex('status', 'status', {unique: false});
      }
      if (!db.objectStoreNames.contains('routes')) {
        const rr = db.createObjectStore('routes', {keyPath: 'id'});
        rr.createIndex('created_by', 'created_by', {unique: false});
      }
    };
  });
}

function idbGet(store, key) {
  return new Promise((resolve, reject) => {
    if (!DB) { resolve(null); return; }
    const tx = DB.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbPut(store, data, key) {
  return new Promise((resolve, reject) => {
    if (!DB) { resolve(null); return; }
    const tx = DB.transaction(store, 'readwrite');
    if (key !== undefined) data.id = key;
    const req = tx.objectStore(store).put(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGetAll(store) {
  return new Promise((resolve, reject) => {
    if (!DB) { resolve([]); return; }
    const tx = DB.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function idbDelete(store, key) {
  return new Promise((resolve, reject) => {
    if (!DB) { resolve(null); return; }
    const tx = DB.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

// ===== SYNC QUEUE =====
function syncQueuePush(action, storeName, data) {
  return idbPut('sync_queue', {
    action,
    store_name: storeName,
    data,
    created_at: new Date().toISOString(),
    status: 'pending'
  });
}

async function syncQueueProcess() {
  if (!DB || !HV.connected) return;
  const items = await idbGetAll('sync_queue');
  const pending = items.filter(i => i.status === 'pending');
  for (const item of pending) {
    try {
      const tableMap = {posts: 'posts', comments: 'comments', follows: 'follows'};
      const table = tableMap[item.store_name];
      if (!table) { await idbDelete('sync_queue', item.id); continue; }
      await saveToHV(table, STATE[item.store_name] || []);
      item.status = 'done';
      await idbPut('sync_queue', item, item.id);
    } catch(e) { /* keep pending */ }
  }
}

const REACTION_EMOJIS = ['❤️', '😂', '😮', '😢', '😡'];

function getReactions(postId) {
  const p = STATE.posts.find(x => x.id === postId);
  if (!p) return {};
