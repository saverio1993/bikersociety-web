  return reactions;
}

function renderReactions(postId) {
  const reactions = getReactions(postId);
  const total = Object.values(reactions).reduce((a, b) => a + b, 0);
  if (total === 0) return '';
  const badges = Object.entries(reactions)
    .filter(([, c]) => c > 0)
    .sort((a, b) => b[1] - a[1])
    .map(([emoji, count]) => `<span style="background:rgba(255,255,255,0.1);padding:2px 7px;border-radius:10px;font-size:12px;margin-right:4px">${emoji} ${count}</span>`)
    .join('');
  return `<div style="padding:6px 14px;font-size:12px;color:var(--text2)">${badges}</div>`;
}

function addReaction(postId, emoji) {
  if (!STATE.user) return;
  const p = STATE.posts.find(x => x.id === postId);
  if (!p) return;
  if (!p.reactions) p.reactions = {};
  // Toggle: if same emoji, remove; else set
  const userId = String(STATE.user.id);
  if (p._reactionUser === userId && p._reactionEmoji === emoji) {
    p.reactions[emoji] = Math.max(0, (p.reactions[emoji] || 1) - 1);
    p._reactionUser = null;
    p._reactionEmoji = null;
  } else {
    // Remove old reaction count
    if (p._reactionEmoji && p.reactions[p._reactionEmoji]) {
      p.reactions[p._reactionEmoji] = Math.max(0, p.reactions[p._reactionEmoji] - 1);
    }
    p.reactions[emoji] = (p.reactions[emoji] || 0) + 1;
    p._reactionUser = userId;
    p._reactionEmoji = emoji;
  }
  saveState();
  syncQueuePush('update', 'posts', p);
  renderBikerGram();
}

function showReactionPicker(postId, btn) {
  // Remove existing picker
  const existing = document.querySelector('.reaction-picker');
  if (existing) { existing.remove(); return; }
  const picker = document.createElement('div');
  picker.className = 'reaction-picker';
  picker.style.cssText = 'position:absolute;bottom:40px;left:0;background:var(--surface);border:1px solid rgba(255,200,0,0.35);border-radius:16px;padding:8px 10px;display:flex;gap:4px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,0.5),0 0 16px rgba(255,200,0,0.12)';
  REACTION_EMOJIS.forEach(emoji => {

    b.textContent = emoji;
    b.style.cssText = 'background:none;border:none;font-size:20px;cursor:pointer;padding:2px;transition:transform 0.1s;border-radius:50%';
    b.onmouseover = () => b.style.transform = 'scale(1.35)';

// ===== INSTANT POST CREATION =====
async function createPostInstant(content, mediaData) {
  if (!STATE.user) return;
  const post = {
    id: Date.now() % 100000,
    user_id: STATE.user.id,
    username: STATE.user.username,
    user_avatar: STATE.user.avatar || '',
    user_bike: STATE.user.bike_model || '',
    content,
    media_type: mediaData?.type || null,
    media_url: mediaData?.url || null,
    image_url: mediaData?.type === 'image' ? mediaData.url : null,
    created_at: new Date().toISOString(),
    likes: [],
    reactions: {},
    comments_count: 0,
    synced: false
  };
  // Save to IndexedDB immediately
  if (DB) await idbPut('posts', post, post.id);
  // Show in UI instantly
  STATE.posts.unshift(post);
  renderBikerGram();
  saveLocal();
  // Sube el registro del post a la nube AL INSTANTE (sin esperar la media).
  // Los posts de texto quedan completos; los de imagen/video suben su registro
  // ahora y la media se añade (URL https) cuando termina la subida.
  pushPostsToCloud();
  // Upload media in background
  if (mediaData?.blob && HV.user && HV.pass) {
    uploadMediaAsync(post.id, mediaData);
  }
}

// Estado de subida en vivo por post: {pct, failed, media} — alimenta el badge del feed
const UPLOAD_STATE = {};

// Actualiza el badge en el DOM sin re-renderizar todo el feed (la subida emite
// muchos eventos de progreso; un render completo por evento sería muy costoso)
function updateUploadBadge(postId) {
  const st = UPLOAD_STATE[postId];
  document.querySelectorAll(`[data-upload-badge="${postId}"]`).forEach(el => {
    if (!st) return;
    if (st.failed) {
      el.style.background = 'rgba(239,68,68,0.15)';
      el.style.color = '#ef4444';
      el.style.cursor = 'pointer';
      el.textContent = '❌ Fallo — toca para reintentar';
    } else {
      el.textContent = '⏳ Subiendo' + (st.pct != null ? ' ' + st.pct + '%' : '...');
    }
  });
}

async function uploadMediaAsync(postId, mediaData, attempt = 0) {
  const typeFolder = mediaData.type === 'video' ? 'videos' : mediaData.type === 'audio' ? 'audio' : 'photos';
  const ext = mediaData.fileName ? mediaData.fileName.split('.').pop() : (mediaData.type === 'image' ? 'jpg' : 'mp4');
  const filename = Date.now() + '_' + Math.random().toString(36).substring(2, 8) + '.' + ext;
  const path = '/' + HV.gramFolder + '/' + typeFolder + '/' + filename;
  const uploadUrl = HV.url + '/nc' + path;
  UPLOAD_STATE[postId] = { pct: 0, failed: false, media: mediaData };
  updateUploadBadge(postId);
  try {
    const blob = mediaData.blob;
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', uploadUrl);
      xhr.setRequestHeader('Authorization', 'Basic ' + btoa(HV.user + ':' + HV.pass));
      xhr.setRequestHeader('Content-Type', mediaData.mimeType || 'application/octet-stream');
      xhr.upload.onprogress = ev => {
        if (ev.lengthComputable && UPLOAD_STATE[postId]) {
          UPLOAD_STATE[postId].pct = Math.round(ev.loaded / ev.total * 100);
          updateUploadBadge(postId);
        }
      };
      xhr.onload = () => {
        if (xhr.status === 201 || xhr.status === 204 || xhr.status === 200) resolve();
        else reject(new Error('HTTP ' + xhr.status));
      };
      xhr.onerror = () => reject(new Error('Error'));
      xhr.ontimeout = () => reject(new Error('Timeout'));
      xhr.timeout = 300000;
      xhr.send(blob);
    });
    delete UPLOAD_STATE[postId];
    // Update post with real URL
    const p = STATE.posts.find(x => x.id === postId);
    if (p) {
      p.media_url = uploadUrl;
      p.image_url = mediaData.type === 'image' ? uploadUrl : null;
      p.synced = true;
      if (DB) await idbPut('posts', p, p.id);
      saveLocal();
      // La media ya está alojada (URL https): súbela a la nube para que el
      // post aparezca COMPLETO (con foto/video) en los demás dispositivos.
      await pushPostsToCloud();
      renderBikerGram();
    }
  } catch(e) {
    console.warn('Media upload failed (intento ' + (attempt + 1) + '):', e);
    if (attempt < 2) {
      // Reintento automático: 3s el primero, 10s el segundo
      setTimeout(() => uploadMediaAsync(postId, mediaData, attempt + 1), attempt === 0 ? 3000 : 10000);
      return;
    }
    UPLOAD_STATE[postId] = { failed: true, media: mediaData };
    updateUploadBadge(postId);
    toast('No se pudo subir el archivo — toca el badge rojo para reintentar');
  }
}

// Reintento manual desde el badge rojo del post
function retryUploadNow(postId) {
  const st = UPLOAD_STATE[postId];
  const p = STATE.posts.find(x => x.id === postId);
  let media = st?.media;
  if (!media && p && (p.media_url || '').startsWith('data:')) {
    const blob = dataURLtoBlob(p.media_url);
    if (blob) {
      const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
      media = { type: p.media_type || 'image', blob, fileName: 'retry.' + ext, mimeType: blob.type };
    }
  }
  if (!media) { toast('No hay datos locales para reintentar'); return; }
  toast('Reintentando subida...');
  uploadMediaAsync(postId, media, 0);
}

// Recover posts whose large media (data:/blob: URLs) were stripped from localStorage
// to avoid quota errors, restoring them from IndexedDB so they appear again on reload.
async function recoverPendingPostMedia() {
  if (!DB) return;
  const pending = (STATE.posts || []).filter(p => p._pendingMedia);
  if (!pending.length) return;
  let restored = false;
  for (const p of pending) {
    try {
      const idbPost = await idbGet('posts', p.id);
      if (idbPost && (idbPost.media_url || idbPost.image_url)) {
        p.media_url = idbPost.media_url;
        p.image_url = idbPost.image_url;
        p.media_type = idbPost.media_type || p.media_type;
        restored = true;
      }
    } catch(e) { console.warn('Recover post media failed:', e); }
    delete p._pendingMedia;
  }
  if (restored) {
    renderBikerGram();
    retryPendingUploads();
  }
}

// Retry uploading photos/videos/audio that never made it to HeyValue
// (e.g. app was closed before the background upload finished).
async function retryPendingUploads() {
  if (!STATE.user || !HV.user || !HV.pass) return;
  const pending = (STATE.posts || []).filter(p =>
    p.user_id === STATE.user.id && !p.synced &&
    (p.media_url || '').startsWith('data:')
  );
  for (const p of pending) {
    const blob = dataURLtoBlob(p.media_url);
    if (!blob) continue;
    const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
    uploadMediaAsync(p.id, {
      type: p.media_type || 'image',
      blob,
      fileName: 'retry.' + ext,
      mimeType: blob.type
    });
  }
}

// Shows whether a post's media is still uploading to HeyValue or already published
function renderUploadStatusBadge(p) {
  const url = p.media_url || p.image_url;
  const pending = url && (url.startsWith('data:') || url.startsWith('blob:')) && !p.synced;
  if (pending) {
    const st = UPLOAD_STATE[p.id];
    if (st?.failed) {
      return `<span data-upload-badge="${p.id}" onclick="retryUploadNow(${p.id})" style="font-size:9px;padding:1px 6px;background:rgba(239,68,68,0.15);color:#ef4444;border-radius:8px;font-weight:700;white-space:nowrap;cursor:pointer">❌ Fallo — toca para reintentar</span>`;
    }
    const pct = st?.pct != null ? ' ' + st.pct + '%' : '...';
    return `<span data-upload-badge="${p.id}" style="font-size:9px;padding:1px 6px;background:rgba(251,191,36,0.15);color:#fbbf24;border-radius:8px;font-weight:700;white-space:nowrap">⏳ Subiendo${pct}</span>`;
  }
  return `<span style="font-size:9px;padding:1px 6px;background:rgba(34,197,94,0.15);color:#22c55e;border-radius:8px;font-weight:700;white-space:nowrap">✅ Publicado</span>`;
}

// ============================================================
// JUEGOS — DOMINÓ MULTIJUGADOR (2 jugadores, por turnos vía nube)
// La mano de cada jugador se guarda en el doc compartido; el cliente solo
// muestra la tuya. Es un juego amistoso de comunidad, no anti-trampas.
// ============================================================
let GAMES = [];
let CURRENT_GAME = null;
let DOM_VIEW = 'lobby';        // 'lobby' | 'game'
let DOM_SELECTED = null;       // {index, sides} ficha elegida que toca dos extremos
let _gamesPoll = null;
let _lastGameSig = '';

const DOM_PIP = {0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,3,6,2,5,8]};
function dominoFullSet(){ const t=[]; for(let a=0;a<=6;a++) for(let b=a;b<=6;b++) t.push([a,b]); return t; }
function domShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function tilePips(t){ return t[0]+t[1]; }
function domOther(g,pid){ const p=g.players.find(x=>x.id!==pid); return p?p.id:null; }
function domName(g,pid){ const p=g.players.find(x=>x.id===pid); return p?p.username:'?'; }

// ---- Nube (clave 'games' = /biker_v1/games.json, fuera del sync de 14 tablas) ----
async function loadGames(){ const d=await loadFromHV('games'); return Array.isArray(d)?d:[]; }
function pruneGames(arr){
  const now = Date.now();
  return arr.filter(g=>{
    if(g.status!=='finished') return true;
    const age = now - new Date(g.updated_at||g.created_at||now).getTime();
    return age < 2*24*3600*1000;
  }).slice(-50);
}
async function saveGames(arr){ return saveToHV('games', pruneGames(arr)); }

// ---- Lógica ----
function dominoDeal(g){
  const tiles = domShuffle(dominoFullSet());
  const p0=g.players[0].id, p1=g.players[1].id;
  g.hands={}; g.hands[p0]=tiles.slice(0,7); g.hands[p1]=tiles.slice(7,14);
  g.boneyard=tiles.slice(14);
  const best=h=>{ let dbl=-1,top=-1; h.forEach(t=>{ if(t[0]===t[1]) dbl=Math.max(dbl,t[0]); top=Math.max(top,tilePips(t)); }); return {dbl,top}; };
  const b0=best(g.hands[p0]), b1=best(g.hands[p1]);
  const starter = (b0.dbl!==b1.dbl) ? (b0.dbl>b1.dbl?p0:p1) : (b0.top>=b1.top?p0:p1);
  g.board=[]; g.leftEnd=null; g.rightEnd=null; g.turn=starter; g.passCount=0; g.status='playing';
  g.lastAction='¡A jugar! Empieza '+domName(g,starter);
}
function dominoPlayable(hand, leftEnd, rightEnd){
  const res=[];
  (hand||[]).forEach((t,i)=>{
    if(leftEnd===null){ res.push({index:i, sides:['R']}); return; }
    const s=[];
    if(t[0]===leftEnd||t[1]===leftEnd) s.push('L');
    if(t[0]===rightEnd||t[1]===rightEnd) s.push('R');
    if(s.length) res.push({index:i, sides:s});
  });
  return res;
}
function dominoApplyPlay(g, pid, idx, side){
  const hand=g.hands[pid]; const t=hand[idx];
  if(g.leftEnd===null){ g.board=[[t[0],t[1]]]; g.leftEnd=t[0]; g.rightEnd=t[1]; }
  else if(side==='L'){ const l=g.leftEnd; const o=(t[1]===l)?[t[0],t[1]]:[t[1],t[0]]; g.board.unshift(o); g.leftEnd=o[0]; }
  else { const r=g.rightEnd; const o=(t[0]===r)?[t[0],t[1]]:[t[1],t[0]]; g.board.push(o); g.rightEnd=o[1]; }
  hand.splice(idx,1); g.passCount=0;
  g.lastAction=domName(g,pid)+' jugó ['+t[0]+'|'+t[1]+']';
  if(hand.length===0){ g.status='finished'; g.winner=pid; g.winReason='¡'+domName(g,pid)+' colocó todas sus fichas!'; }
  else g.turn=domOther(g,pid);
}
function dominoApplyDraw(g, pid){
  if(!g.boneyard.length) return false;
  g.hands[pid].push(g.boneyard.shift());
  g.lastAction=domName(g,pid)+' robó del pozo';
  return true;
}
function dominoApplyPass(g, pid){
  g.passCount=(g.passCount||0)+1;
  g.lastAction=domName(g,pid)+' pasó';
  if(g.passCount>=2){
    const p0=g.players[0].id, p1=g.players[1].id;
    const s0=g.hands[p0].reduce((a,t)=>a+tilePips(t),0), s1=g.hands[p1].reduce((a,t)=>a+tilePips(t),0);
    g.status='finished';
    g.winner = s0<s1?p0 : (s1<s0?p1:'tie');
    g.winReason = g.winner==='tie' ? ('Trancado — empate ('+s0+' vs '+s1+')') : ('Trancado — gana '+domName(g,g.winner)+' por menos puntos ('+Math.min(s0,s1)+')');
  } else g.turn=domOther(g,pid);
}

// ---- Acciones del jugador (lee fresco, aplica, guarda) ----
async function dominoCreate(){
  if(!STATE.user){ toast('Inicia sesión primero'); return; }
  const games=await loadGames();
  const dup=games.find(g=>g.type==='domino'&&g.status==='waiting'&&g.createdBy===STATE.user.id);
  if(dup){ CURRENT_GAME=dup.id; DOM_VIEW='game'; openDominoGame(dup.id); return; }
  const g={ id:Date.now()%1000000, type:'domino', status:'waiting',
    players:[{id:STATE.user.id, username:STATE.user.username}], createdBy:STATE.user.id,
    hands:{}, boneyard:[], board:[], leftEnd:null, rightEnd:null, turn:null, passCount:0,
    winner:null, winReason:'', created_at:new Date().toISOString(), updated_at:new Date().toISOString(),
    lastAction:'Mesa creada, esperando rival...' };
  games.push(g); await saveGames(games); GAMES=games;
  toast('Mesa creada — espera a que un rider se una');
  openDominoGame(g.id);
}
async function dominoJoin(id){
  if(!STATE.user){ toast('Inicia sesión primero'); return; }
  const games=await loadGames();
  const g=games.find(x=>x.id===id);
  if(!g||g.status!=='waiting'){ toast('Esa mesa ya no está disponible'); renderJuegos(); return; }
  if(g.players.some(p=>p.id===STATE.user.id)){ openDominoGame(id); return; }
  g.players.push({id:STATE.user.id, username:STATE.user.username});
  dominoDeal(g); g.updated_at=new Date().toISOString();
  await saveGames(games); GAMES=games;
  openDominoGame(id);
}
async function dominoMove(action, payload){
  const games=await loadGames();
  const g=games.find(x=>x.id===CURRENT_GAME);
  if(!g){ toast('Mesa no disponible'); dominoToLobby(); return; }
  if(g.status!=='playing'){ paintGame(g); return; }
  if(g.turn!==STATE.user.id){ toast('No es tu turno'); paintGame(g); return; }
  if(action==='play') dominoApplyPlay(g, STATE.user.id, payload.index, payload.side);
  else if(action==='draw'){ if(!dominoApplyDraw(g, STATE.user.id)){ toast('El pozo está vacío'); return; } }
  else if(action==='pass') dominoApplyPass(g, STATE.user.id);
  g.updated_at=new Date().toISOString();
  DOM_SELECTED=null;
  await saveGames(games); GAMES=games;
  paintGame(g);
}
function dominoSelectTile(idx){
  const g=GAMES.find(x=>x.id===CURRENT_GAME);
  if(!g||g.turn!==STATE.user.id) return;
  const m=dominoPlayable(g.hands[STATE.user.id], g.leftEnd, g.rightEnd).find(x=>x.index===idx);
  if(!m){ toast('Esa ficha no encaja'); return; }
  if(m.sides.length===1){ dominoMove('play',{index:idx, side:m.sides[0]}); }
  else { DOM_SELECTED={index:idx, sides:m.sides}; paintGame(g); }
}
function dominoDraw(){ dominoMove('draw'); }
function dominoPass(){ dominoMove('pass'); }
function dominoAwardIfWon(g){
  if(!STATE.user || g.status!=='finished' || g.winner!==STATE.user.id) return;
  const credited=ls('dom_credited')||[];
  if(credited.includes(g.id)) return;
  credited.push(g.id); ls('dom_credited', credited);
  const u=STATE.users.find(x=>x.id===STATE.user.id);
  if(u){ u.points=(u.points||0)+50; STATE.user.points=u.points; }
  saveState();
  toast('🏆 ¡Ganaste el dominó! +50 puntos');
}

// ---- Render: fichas ----
function dominoHalf(n){ let d=''; for(let i=0;i<9;i++) d+=`<span class="dom-dot" style="${DOM_PIP[n].includes(i)?'':'visibility:hidden'}"></span>`; return `<div class="dom-half">${d}</div>`; }
function dominoTile(t, opt){
  opt=opt||{};
  const cls=['dom-tile']; if(opt.small) cls.push('dom-sm'); if(opt.click) cls.push('dom-click'); if(opt.disabled) cls.push('dom-disabled'); if(opt.sel) cls.push('dom-selected');
  const oc=opt.onclick?`onclick="${opt.onclick}"`:'';
  return `<div class="${cls.join(' ')}" ${oc}>${dominoHalf(t[0])}<div class="dom-divider"></div>${dominoHalf(t[1])}</div>`;
}

// ---- Render: lobby ----
function renderJuegos(){
  // Si hay una partida abierta, retómala. Evita que un re-render incidental
  // (p.ej. resumeSync al volver la app al frente, al tocar la pantalla) "cierre"
  // el juego mandándolo al lobby.
  if(DOM_VIEW==='game' && CURRENT_GAME!=null){ openDominoGame(CURRENT_GAME); return; }
  DOM_VIEW='lobby'; CURRENT_GAME=null;
  const el=document.getElementById('page-juegos');
  if(!el) return;
  startGamesPoll();
  el.innerHTML=`<div style="padding:24px;text-align:center;color:var(--text2);font-size:13px">Cargando mesas...</div>`;
  loadGames().then(g=>{ GAMES=g; if(DOM_VIEW==='lobby') paintLobby(); });
}
// Salir explícitamente de una partida al lobby (botón "← Mesas").
function dominoToLobby(){ DOM_VIEW='lobby'; CURRENT_GAME=null; DOM_SELECTED=null; renderJuegos(); }
function paintLobby(){
  const el=document.getElementById('page-juegos'); if(!el) return;
  const me=STATE.user?.id;
  const dom=GAMES.filter(g=>g.type==='domino');
  const mine=dom.filter(g=>g.status!=='finished'&&g.players.some(p=>p.id===me));
  const open=dom.filter(g=>g.status==='waiting'&&!g.players.some(p=>p.id===me));
  const fin=dom.filter(g=>g.status==='finished'&&g.players.some(p=>p.id===me)).slice(-6).reverse();
  const card=(inner,extra)=>`<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;${extra||''}">${inner}</div>`;
  let html=`
    <div style="padding:14px 0">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <span style="font-size:26px">🎲</span>
        <div><div style="font-size:20px;font-weight:900">Dominó</div>
        <div style="font-size:12px;color:var(--text2)">Reta a otro rider · por turnos</div></div>
      </div>
      <button onclick="dominoCreate()" style="width:100%;margin:14px 0;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#00d4ff,#0088cc);color:#06222c;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 16px rgba(0,212,255,0.35)">+ Crear mesa nueva</button>`;
  if(mine.length){
    html+=`<div style="font-size:12px;font-weight:800;color:var(--text2);margin:8px 2px">TUS PARTIDAS</div>`;
    mine.forEach(g=>{
      const opp=g.players.find(p=>p.id!==me);
      const waiting=g.status==='waiting';
      const myTurn=g.status==='playing'&&g.turn===me;
      const badge = waiting?`<span style="color:#fbbf24">⏳ Esperando rival</span>`
        : myTurn?`<span style="color:#22c55e;font-weight:800">● Tu turno</span>`
        : `<span style="color:var(--text2)">Turno de ${opp?opp.username:'?'}</span>`;
      html+=card(`<div onclick="openDominoGame(${g.id})" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer">
        <div><div style="font-weight:700;font-size:14px">vs ${opp?opp.username:'(esperando)'}</div>
        <div style="font-size:12px;margin-top:2px">${badge}</div></div>
        <span style="font-size:18px;color:var(--accent)">▶</span></div>`, myTurn?'border-color:rgba(34,197,94,0.4)':'');
    });
  }
  html+=`<div style="font-size:12px;font-weight:800;color:var(--text2);margin:14px 2px 8px">MESAS ABIERTAS</div>`;
  if(open.length){
    open.forEach(g=>{
      html+=card(`<div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:700;font-size:14px">Mesa de ${g.players[0].username}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px">Esperando un rival</div></div>
        <button onclick="dominoJoin(${g.id})" style="padding:8px 18px;border:none;border-radius:20px;background:linear-gradient(135deg,#00d4ff,#0088cc);color:#06222c;font-weight:800;font-size:13px;cursor:pointer">Unirse</button></div>`);
    });
  } else {
    html+=`<div style="text-align:center;color:var(--text3);font-size:12px;padding:14px">No hay mesas abiertas. ¡Crea una!</div>`;
  }
  if(fin.length){
    html+=`<div style="font-size:12px;font-weight:800;color:var(--text2);margin:14px 2px 8px">RECIENTES</div>`;
    fin.forEach(g=>{
      const opp=g.players.find(p=>p.id!==me);
      const won=g.winner===me;
      html+=card(`<div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:13px">vs ${opp?opp.username:'?'}</div>
        <span style="font-size:12px;font-weight:800;color:${won?'#22c55e':(g.winner==='tie'?'#fbbf24':'#ff6b6b')}">${won?'🏆 Ganaste':(g.winner==='tie'?'Empate':'Perdiste')}</span></div>`);
    });
  }
  html+=`</div>`;
  el.innerHTML=html;
}

// ---- Render: partida ----
function openDominoGame(id){
  CURRENT_GAME=id; DOM_VIEW='game'; DOM_SELECTED=null; _lastGameSig='';
  startGamesPoll();
  const g=GAMES.find(x=>x.id===id);
  if(g) paintGame(g);
  loadGames().then(games=>{ GAMES=games; const fg=games.find(x=>x.id===id);
    if(fg){ if(DOM_VIEW==='game') paintGame(fg); }
    else { dominoToLobby(); } });
}
function paintGame(g){
  const el=document.getElementById('page-juegos');
  if(!el||DOM_VIEW!=='game'||!g) return;
  if(g.status==='finished') dominoAwardIfWon(g);
  const me=STATE.user?.id;
  const opp=g.players.find(p=>p.id!==me);
  const myHand=(g.hands&&g.hands[me])||[];
  const myTurn=g.status==='playing'&&g.turn===me;
  const moves=myTurn?dominoPlayable(myHand,g.leftEnd,g.rightEnd):[];
  const movable=new Set(moves.map(m=>m.index));

  let top=`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:10px">
    <button onclick="dominoToLobby()" style="background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer">← Mesas</button>
    <div style="flex:1"><div style="font-weight:800;font-size:14px">vs ${opp?opp.username:'(esperando rival)'}</div>
    <div style="font-size:11px;color:var(--text2)">${opp?('Fichas del rival: '+((g.hands&&g.hands[opp.id]&&g.hands[opp.id].length)||0)+' · Pozo: '+(g.boneyard?g.boneyard.length:0)):''}</div></div>`;

  if(g.status==='waiting'){
    el.innerHTML=top+`</div><div style="text-align:center;padding:40px 20px;color:var(--text2)">
      <div style="font-size:40px;margin-bottom:12px">⏳</div>
      <div style="font-weight:700;margin-bottom:6px">Esperando que un rider se una</div>
      <div style="font-size:12px">Tu mesa ya aparece en "Mesas abiertas" para los demás.</div></div>`;
    return;
  }

  const turnLabel = g.status==='finished'
    ? `<span style="color:${g.winner===me?'#22c55e':(g.winner==='tie'?'#fbbf24':'#ff6b6b')};font-weight:900">${g.winner===me?'🏆 ¡Ganaste!':(g.winner==='tie'?'🤝 Empate':'Perdiste')}</span>`
    : (myTurn?`<span style="color:#22c55e;font-weight:900">● Tu turno</span>`:`<span style="color:var(--text2)">Turno de ${opp?opp.username:'?'}…</span>`);
  top+=`<div style="font-size:13px">${turnLabel}</div></div>`;

  // Tablero
  let board = (g.board&&g.board.length)
    ? g.board.map(t=>dominoTile(t,{small:true})).join('')
    : `<div style="color:var(--text3);font-size:13px;padding:30px 10px;text-align:center;width:100%">Coloca la primera ficha 👇</div>`;
  const boardBox=`<div style="background:#0c2a1a;border:1px solid rgba(34,197,94,0.25);border-radius:14px;padding:14px;min-height:90px;display:flex;align-items:center;overflow-x:auto;gap:4px">${board}</div>`;
  const ends = g.leftEnd!==null?`<div style="text-align:center;font-size:11px;color:var(--text2);margin:8px 0">Extremos abiertos: <b style="color:var(--accent)">${g.leftEnd}</b> y <b style="color:var(--accent)">${g.rightEnd}</b></div>`:'';

  // Estado / acción
  let status=`<div style="text-align:center;font-size:12px;color:var(--text2);margin:6px 0 10px">${g.status==='finished'?g.winReason:(g.lastAction||'')}</div>`;

  // Selección de extremo
  let sideChooser='';
  if(myTurn && DOM_SELECTED){
    const t=myHand[DOM_SELECTED.index];
    sideChooser=`<div style="display:flex;gap:8px;justify-content:center;align-items:center;margin:8px 0;flex-wrap:wrap">
      <span style="font-size:12px;color:var(--text2)">Ficha [${t[0]}|${t[1]}] — ¿dónde?</span>
      <button onclick="dominoMove('play',{index:${DOM_SELECTED.index},side:'L'})" style="padding:8px 16px;border:none;border-radius:18px;background:var(--accent);color:#06222c;font-weight:800;cursor:pointer">⬅️ Izquierda (${g.leftEnd})</button>
      <button onclick="dominoMove('play',{index:${DOM_SELECTED.index},side:'R'})" style="padding:8px 16px;border:none;border-radius:18px;background:var(--accent);color:#06222c;font-weight:800;cursor:pointer">Derecha (${g.rightEnd}) ➡️</button></div>`;
  }

  // Mano
  let hand='';
  if(g.status!=='finished'){
    hand=`<div style="font-size:12px;font-weight:800;color:var(--text2);margin:6px 2px">TUS FICHAS (${myHand.length})</div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px">`;
    myHand.forEach((t,i)=>{
      const can=movable.has(i);
      hand+=dominoTile(t,{click:myTurn,disabled:myTurn&&!can,sel:DOM_SELECTED&&DOM_SELECTED.index===i,onclick:myTurn?`dominoSelectTile(${i})`:''});
    });
    hand+=`</div>`;
    if(myTurn && moves.length===0){
      hand+= g.boneyard.length
        ? `<button onclick="dominoDraw()" style="width:100%;padding:12px;border:none;border-radius:12px;background:#3b5;color:#04240f;font-weight:800;font-size:14px;cursor:pointer;margin-top:4px">🤚 Robar del pozo (${g.boneyard.length})</button>`
        : `<button onclick="dominoPass()" style="width:100%;padding:12px;border:none;border-radius:12px;background:#a55;color:#fff;font-weight:800;font-size:14px;cursor:pointer;margin-top:4px">⏭️ Pasar (no tienes jugada)</button>`;
    }
  } else {
    hand=`<button onclick="dominoToLobby()" style="width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#00d4ff,#0088cc);color:#06222c;font-weight:900;font-size:15px;cursor:pointer;margin-top:8px">Volver a las mesas</button>`;
  }

  el.innerHTML=`<div style="padding-bottom:20px">${top}${boardBox}${ends}${status}${sideChooser}${hand}</div>`;
}

// ---- Polling ----
function startGamesPoll(){
  if(_gamesPoll) clearInterval(_gamesPoll);
  _gamesPoll=setInterval(async ()=>{
    if(STATE.currentPage!=='juegos'){ clearInterval(_gamesPoll); _gamesPoll=null; return; }
    try{
      const games=await loadGames(); GAMES=games;
      if(DOM_VIEW==='game' && CURRENT_GAME!=null){
        const g=games.find(x=>x.id===CURRENT_GAME);
        if(g){ const sig=g.updated_at+'|'+g.status+'|'+g.turn; if(sig!==_lastGameSig){ _lastGameSig=sig; paintGame(g); } }
      } else if(DOM_VIEW==='lobby'){ paintLobby(); }
    }catch(e){}
  }, 2500);
}

// CSS de las fichas de dominó (inyectado una vez)
(function(){
  if(document.getElementById('domino-css')) return;
  const s=document.createElement('style'); s.id='domino-css';
  s.textContent=`
  .dom-tile{display:inline-flex;align-items:center;background:#f5f3ea;border-radius:8px;padding:6px;gap:5px;box-shadow:0 2px 6px rgba(0,0,0,.45);border:1px solid rgba(0,0,0,.25);flex-shrink:0}
  .dom-half{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:33px;height:33px;gap:2px}
  .dom-sm .dom-half{width:21px;height:21px;gap:1px}
  .dom-dot{width:8px;height:8px;background:#16181d;border-radius:50%;align-self:center;justify-self:center}
  .dom-sm .dom-dot{width:5px;height:5px}
  .dom-divider{width:2px;align-self:stretch;background:rgba(0,0,0,.22);border-radius:2px}
  .dom-click{cursor:pointer;transition:transform .12s}
  .dom-click:hover{transform:translateY(-4px)}
  .dom-disabled{opacity:.38;cursor:not-allowed}
  .dom-disabled:hover{transform:none}
  .dom-selected{outline:3px solid #00d4ff;outline-offset:1px}`;
  document.head.appendChild(s);
})();
</script>
