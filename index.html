<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Biker Society</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ===== MODERNIZED BIKER SOCIETY v2.0 ===== */
/* Dark Racing Pro — Negro profundo + Rojo animado */

:root{
  --bg:#060606;
  --surface:#0f0f0f;
  --surface2:#161616;
  --surface3:#1e1e1e;
  --border:#2a2a2a;
  --border2:#333333;
  --accent:#ff3b3b;
  --accent2:#ff6b35;
  --accent3:#ff8c00;
  --glow:rgba(255,59,59,0.4);
  --glow2:rgba(255,107,53,0.3);
  --text:#f5f5f5;
  --text2:#aaaaaa;
  --text3:#666666;
  --success:#00e676;
  --danger:#ff3b3b;
  --warning:#ffab00;
  --radius:14px;
  --radius-sm:8px;
  --transition:0.25s cubic-bezier(0.4,0,0.2,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}
a{color:inherit;text-decoration:none}

/* ANIMATED BACKGROUND */
.bg-gradient{
  position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:var(--bg);
}
.bg-gradient::before{
  content:'';position:absolute;
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(255,59,59,0.08) 0%,transparent 70%);
  top:-200px;right:-200px;
  animation:bgFloat 12s ease-in-out infinite;
}
.bg-gradient::after{
  content:'';position:absolute;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(255,107,53,0.06) 0%,transparent 70%);
  bottom:-150px;left:-150px;
  animation:bgFloat 18s ease-in-out infinite reverse;
}
@keyframes bgFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-20px) scale(1.05)}
  66%{transform:translate(-20px,20px) scale(0.95)}
}

/* PAGE CONTAINER */
.page{display:none;height:100%;overflow-y:auto;overflow-x:hidden;padding:60px 16px 80px}
.page.active{display:block}

/* VANISH ANIMATIONS */
.vanish{opacity:0;transform:translateY(16px);animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) forwards}
.fadein{animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) forwards}
@keyframes fadeUp{
  to{opacity:1;transform:translateY(0)}
}

/* STAGGERED CARD ENTRANCE */
.card,.post-card,.event-card,.rider-card,.challenge-card,.rank-item{
  opacity:0;transform:translateY(20px);
  animation:cardIn 0.5s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes cardIn{
  to{opacity:1;transform:translateY(0)}
}

/* ===== TOPBAR ===== */
.topbar{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:rgba(6,6,6,0.92);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid rgba(255,59,59,0.15);
  box-shadow:0 0 30px rgba(255,59,59,0.05);
}
.topbar-logo{
  display:flex;align-items:center;gap:10px;
  font-weight:800;font-size:17px;
  background:linear-gradient(135deg,#ff3b3b,#ff6b35,#ff8c00);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradientShift 4s ease infinite;
}
@keyframes gradientShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.topbar-logo img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,59,59,0.5)}
.topbar-actions{display:flex;gap:8px}
.topbar-actions button{
  width:38px;height:38px;border-radius:50%;
  background:var(--surface2);
  color:var(--text);
  font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
  border:1px solid transparent;
}
.topbar-actions button:hover{
  background:var(--surface3);
  border-color:var(--accent);
  box-shadow:0 0 16px var(--glow);
}

/* ===== BOTTOM NAV ===== */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;
  height:72px;
  background:rgba(6,6,6,0.95);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  z-index:1000;
  display:flex;
  border-top:1px solid rgba(255,59,59,0.15);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 30px rgba(0,0,0,0.5);
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;color:var(--text3);font-size:10px;font-weight:600;
  transition:var(--transition);
  cursor:pointer;padding:8px 0;
  border:none;background:none;
  position:relative;
}
.bnav-item::before{
  content:'';position:absolute;
  top:0;left:50%;transform:translateX(-50%);
  width:32px;height:3px;
  background:linear-gradient(90deg,#ff3b3b,#ff6b35);
  border-radius:0 0 3px 3px;
  opacity:0;transition:var(--transition);
}
.bnav-item.active{color:var(--accent)}
.bnav-item.active::before{opacity:1;box-shadow:0 0 12px var(--glow)}
.bnav-item:active{transform:scale(0.95)}
.bnav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:var(--transition)}
.bnav-item.active svg{filter:drop-shadow(0 0 8px var(--glow))}
.bnav-item span{display:block}

/* ===== CARDS ===== */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;
  inset:0;opacity:0;
  background:linear-gradient(135deg,rgba(255,59,59,0.05),rgba(255,107,53,0.03));
  transition:var(--transition);
}
.card:hover{
  border-color:rgba(255,59,59,0.5);
  box-shadow:0 4px 24px rgba(255,59,59,0.15),0 0 0 1px rgba(255,59,59,0.1) inset;
  transform:translateY(-2px);
}
.card:hover::before{opacity:1}
.card-title{font-weight:700;font-size:15px;margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text2)}

/* ===== BADGES ===== */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
  background:var(--surface2);border:1px solid var(--border);
  transition:var(--transition);
}
.badge-gold{
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#000;border:none;
  box-shadow:0 0 12px rgba(251,191,36,0.3);
}
.badge-red{
  background:linear-gradient(135deg,#ff3b3b,#ff6b35);
  color:#fff;border:none;
  box-shadow:0 0 12px var(--glow);
}
.badge-green{
  background:linear-gradient(135deg,#00e676,#00c853);
  color:#000;border:none;
  box-shadow:0 0 12px rgba(0,230,118,0.3);
}
.badge-blue{
  background:linear-gradient(135deg,#2979ff,#1565c0);
  color:#fff;border:none;
  box-shadow:0 0 12px rgba(41,121,255,0.3);
}

/* ===== MAP ===== */
.map-container{position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
#map{height:350px;width:100%;background:var(--surface2)}
.map-label{
  position:absolute;top:12px;left:12px;z-index:500;
  background:rgba(6,6,6,0.9);
  backdrop-filter:blur(12px);
  padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;
  color:var(--text);border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,0.5);
}

/* ===== POI MARKERS ===== */
.poi-pill{
  background:var(--accent);color:#fff;
  padding:7px 16px;border-radius:20px;font-size:12px;font-weight:800;
  white-space:nowrap;
  box-shadow:0 4px 20px var(--glow),0 0 40px rgba(255,59,59,0.2);
  animation:poiPulse 2s ease-in-out infinite;
  position:relative;
}
.poi-pill::before{
  content:'';position:absolute;inset:-4px;
  border-radius:inherit;
  border:2px solid var(--accent);
  animation:poiRing 2s ease-in-out infinite;
}
@keyframes poiPulse{
  0%,100%{transform:scale(1);box-shadow:0 4px 20px var(--glow)}
  50%{transform:scale(1.05);box-shadow:0 6px 30px var(--glow2)}
}
@keyframes poiRing{
  0%{transform:scale(1);opacity:0.8}
  100%{transform:scale(1.8);opacity:0}
}

/* ===== ROUTE ANIMATION ===== */
.route-animated{
  stroke-dasharray:20,12;
  stroke-dashoffset:0;
  animation:dash 1.5s linear infinite;
}
@keyframes dash{to{stroke-dashoffset:-32}}

/* ===== LIKES HEART ===== */
.like-btn{
  background:none;border:none;color:var(--text3);font-size:18px;
  transition:0.2s;cursor:pointer;display:flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:20px;
}
.like-btn:hover{color:var(--danger);background:rgba(255,59,59,0.1)}
.like-btn.liked{
  color:var(--danger);
  animation:heartBeat 0.4s ease;
  filter:drop-shadow(0 0 8px var(--glow));
}
@keyframes heartBeat{
  0%{transform:scale(1)}
  25%{transform:scale(1.3)}
  50%{transform:scale(1)}
  75%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

/* ===== INPUTS ===== */
.input{
  width:100%;padding:13px 16px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);font-size:14px;
  transition:var(--transition);
  margin-bottom:12px;
}
.input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,59,59,0.15),0 0 20px rgba(255,59,59,0.1);
  background:var(--surface3);
}
.input::placeholder{color:var(--text3)}

/* ===== BUTTONS ===== */
.btn{
  padding:13px 26px;border-radius:var(--radius-sm);
  font-weight:700;font-size:14px;
  transition:var(--transition);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  position:relative;overflow:hidden;
}
.btn-primary{
  background:linear-gradient(135deg,#ff3b3b,#ff6b35);
  color:#fff;
  box-shadow:0 4px 16px var(--glow);
}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent);
  opacity:0;transition:var(--transition);
}
.btn-primary:hover::before{opacity:1}
.btn-primary:hover{
  box-shadow:0 6px 24px var(--glow2),0 0 40px rgba(255,59,59,0.2);
  transform:translateY(-1px);
}
.btn-primary:active{transform:scale(0.97) translateY(0)}
.btn-secondary{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border);
}
.btn-secondary:hover{
  border-color:var(--accent);
  background:var(--surface3);
  box-shadow:0 0 12px rgba(255,59,59,0.1);
}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{color:var(--text);background:var(--surface2)}

/* ===== MODAL ===== */
.modal{
  position:fixed;inset:0;z-index:2000;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(12px);
  animation:modalFadeIn 0.2s ease;
}
@keyframes modalFadeIn{from{opacity:0}}
.modal.open{display:flex}
.modal-content{
  max-width:440px;width:calc(100% - 32px);
  max-height:90vh;overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  animation:modalSlideIn 0.3s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 24px 80px rgba(0,0,0,0.8),0 0 60px rgba(255,59,59,0.1);
}
@keyframes modalSlideIn{from{transform:translateY(20px);opacity:0}}
.modal-title{font-size:18px;font-weight:800;margin-bottom:16px;background:linear-gradient(135deg,#ff3b3b,#ff6b35);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* ===== POST CARD ===== */
.post-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
  transition:var(--transition);
}
.post-card:hover{
  border-color:rgba(255,59,59,0.3);
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.post-header{padding:12px 16px;display:flex;align-items:center;gap:10px}
.post-avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#ff3b3b,#ff6b35);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:#fff;flex-shrink:0;
  box-shadow:0 0 16px var(--glow);
}
.post-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.post-name{font-weight:700;font-size:14px}
.post-time{font-size:11px;color:var(--text2)}
.post-content{padding:0 16px 12px;font-size:14px;line-height:1.5}
.post-image{width:100%;max-height:400px;object-fit:cover;display:block}
.post-actions{padding:8px 16px;display:flex;gap:16px;border-top:1px solid var(--border)}

/* ===== EVENT CARD ===== */
.event-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  margin-bottom:16px;
  transition:var(--transition);
}
.event-card:hover{
  border-color:rgba(255,59,59,0.4);
  box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 20px rgba(255,59,59,0.1);
  transform:translateY(-2px);
}
.event-img{width:100%;height:160px;object-fit:cover}
.event-body{padding:16px}
.event-date{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px}
.event-title{font-size:16px;font-weight:800;margin:6px 0 10px}
.event-meta{display:flex;gap:16px;font-size:12px;color:var(--text2)}

/* ===== RIDER CARD ===== */
.rider-card{
  display:flex;align-items:center;gap:12px;
  padding:14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:8px;
  cursor:pointer;
  transition:var(--transition);
}
.rider-card:hover{
  border-color:var(--accent);
  box-shadow:0 0 16px rgba(255,59,59,0.15);
  transform:translateX(4px);
}
.rider-avatar{
  width:50px;height:50px;border-radius:50%;
  background:linear-gradient(135deg,#ff3b3b,#ff6b35);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;color:#fff;flex-shrink:0;
  box-shadow:0 0 20px var(--glow);
  position:relative;
}
.rider-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.rider-avatar::after{
  content:'';position:absolute;inset:-2px;
  border-radius:50%;
  border:2px solid transparent;
  background:linear-gradient(135deg,#ff3b3b,#ff6b35) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite: destination-out;
  mask-composite:exclude;
  animation:avatarRing 3s linear infinite;
}
@keyframes avatarRing{to{transform:rotate(360deg)}}
.rider-info{flex:1;min-width:0}
.rider-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.rider-bike{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rider-points{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--accent)}

/* ===== POINTS BAR ===== */
.points-bar{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:12px;
}
.points-level{flex:1}
.points-label{font-size:11px;color:var(--text2);margin-bottom:6px}
.points-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.points-fill{
  height:100%;
  background:linear-gradient(90deg,#ff3b3b,#ff6b35,#ff8c00);
  background-size:200% 100%;
  border-radius:3px;
  transition:width 1.5s cubic-bezier(0.4,0,0.2,1);
  animation:pointsShimmer 3s ease infinite;
}
@keyframes pointsShimmer{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.points-value{font-weight:900;font-size:18px;color:var(--accent);text-shadow:0 0 16px var(--glow)}

/* ===== CHALLENGE CARD ===== */
.challenge-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:10px;
  position:relative;overflow:hidden;
  transition:var(--transition);
}
.challenge-card::before{
  content:'';position:absolute;top:0;left:0;
  width:4px;height:100%;
  background:linear-gradient(180deg,#ff3b3b,#ff6b35,#ff8c00);
}
.challenge-card:hover{
  border-color:rgba(255,59,59,0.3);
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.challenge-title{font-weight:800;font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.challenge-desc{font-size:12px;color:var(--text2);margin-bottom:12px}
.challenge-progress{display:flex;align-items:center;gap:10px}
.challenge-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.challenge-fill{
  height:100%;
  background:linear-gradient(90deg,#ff3b3b,#ff6b35);
  border-radius:3px;
  transition:width 0.6s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 0 8px var(--glow);
}
.challenge-points{font-size:12px;font-weight:800;color:var(--accent)}

/* ===== BADGE DISPLAY ===== */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 10px;
  text-align:center;
  transition:var(--transition);
}
.badge-item.earned{
  border-color:var(--accent);
  background:linear-gradient(135deg,rgba(255,59,59,0.1),rgba(255,107,53,0.05));
  box-shadow:0 0 20px rgba(255,59,59,0.1);
  animation:badgeEarned 0.5s ease;
}
@keyframes badgeEarned{
  0%{transform:scale(0.8);opacity:0}
  50%{transform:scale(1.1)}
  100%{transform:scale(1);opacity:1}
}
.badge-icon{font-size:32px;margin-bottom:8px}
.badge-name{font-size:11px;font-weight:700;line-height:1.3}

/* ===== RANKING ===== */
.rank-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:6px;
  transition:var(--transition);
}
.rank-item:hover{
  border-color:rgba(255,59,59,0.3);
  transform:translateX(4px);
}

/* ===== NEWS ===== */
.news-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  cursor:pointer;
  transition:border-color 0.2s, transform 0.2s;
  display:block;
  text-decoration:none;
  color:inherit;
}
.news-card:hover{
  border-color:rgba(255,68,68,0.4);
  transform:translateY(-2px);
}
.news-card-title{
  font-size:13px;
  font-weight:600;
  color:var(--text1);
  line-height:1.4;
  margin-bottom:8px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.news-card-meta{
  font-size:11px;
  color:var(--text2);
}
.coord-row{display:flex;gap:6px;align-items:center}
.news-card-img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px 10px 0 0;
  display:block;
}
.news-card-body{padding:12px 14px}
.news-card-desc{
  font-size:12px;
  color:var(--text2);
  line-height:1.4;
  margin:6px 0;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.news-section .news-grid{

  grid-template-columns:1fr;
  gap:10px;
}

.rank-num{

  font-weight:900;font-size:13px;color:var(--text2);
}
.rank-num.gold{
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#000;
  box-shadow:0 0 16px rgba(251,191,36,0.4);
}
.rank-num.silver{
  background:linear-gradient(135deg,#e5e7eb,#9ca3af);
  color:#000;
  box-shadow:0 0 12px rgba(229,231,235,0.3);
}
.rank-num.bronze{
  background:linear-gradient(135deg,#b45309,#92400e);
  color:#fff;
  box-shadow:0 0 12px rgba(180,83,9,0.3);
}

.chat-message{margin-bottom:10px;display:flex;gap:8px;animation:msgIn 0.3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}}
.chat-message.mine{flex-direction:row-reverse}
.chat-bubble{
  max-width:75%;padding:10px 14px;
  border-radius:18px;font-size:13px;line-height:1.4;
  word-break:break-word;
}
.chat-message:not(.mine) .chat-bubble{
  background:var(--surface2);
  border-bottom-left-radius:4px;
}
.chat-message.mine .chat-bubble{
  background:linear-gradient(135deg,#ff3b3b,#ff6b35);
  color:#fff;border-bottom-right-radius:4px;
  box-shadow:0 4px 16px var(--glow);
}
.chat-input-bar{
  position:fixed;bottom:72px;left:0;right:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:10px 12px;
  display:flex;gap:10px;align-items:center;
}
.chat-input-bar input{
  flex:1;padding:10px 16px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);font-size:13px;
  transition:var(--transition);
}
.chat-input-bar input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(255,59,59,0.1);
}
.chat-input-bar button{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#ff3b3b,#ff6b35);
  color:#fff;border:none;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px var(--glow);
  transition:var(--transition);
}
.chat-input-bar button:hover{
  transform:scale(1.05);
  box-shadow:0 6px 24px var(--glow2);
}
.chat-input-bar button:active{transform:scale(0.95)}

/* ===== SPLASH ===== */
.splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
}
.splash-logo{
  width:90px;height:90px;border-radius:50%;
  background:linear-gradient(135deg,#ff3b3b,#ff6b35,#ff8c00);
  background-size:200% 200%;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;font-weight:900;color:#fff;
  animation:splashPulse 1.8s ease-in-out infinite,gradientShift 4s ease infinite;
  box-shadow:0 0 60px var(--glow),0 0 100px rgba(255,59,59,0.2);
}
@keyframes splashPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 60px var(--glow)}
  50%{transform:scale(1.08);box-shadow:0 0 80px var(--glow2)}
}
.splash-text{
  font-size:22px;font-weight:900;
  background:linear-gradient(135deg,#ff3b3b,#ff6b35,#ff8c00);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradientShift 3s ease infinite;
}
.splash-bar{
  width:140px;height:4px;
  background:var(--surface2);
  border-radius:2px;overflow:hidden;
}
.splash-bar::after{
  content:'';display:block;
  width:50%;height:100%;
  background:linear-gradient(90deg,#ff3b3b,#ff6b35,#ff8c00);
  background-size:200% 100%;
  border-radius:2px;
  animation:loadingBar 1.5s ease-in-out infinite;
}
@keyframes loadingBar{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(300%)}
}

/* ===== ADMIN PANEL ===== */
.admin-section{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  margin-bottom:16px;overflow:hidden;
}
.admin-section-header{

  background:var(--surface2);
  border-bottom:1px solid var(--border);

  cursor:pointer;
  transition:var(--transition);
}
.admin-section-header:hover{color:var(--accent)}
.admin-list{padding:8px}
.admin-list-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 8px;border-radius:8px;
  transition:var(--transition);
}
.admin-list-item:hover{background:var(--surface2)}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* ===== TAB BAR ===== */
.tab-bar{
  display:flex;gap:4px;margin-bottom:16px;
  background:var(--surface);
  padding:4px;border-radius:var(--radius);
  border:1px solid var(--border);
}
.tab{
  flex:1;padding:9px;text-align:center;font-size:12px;font-weight:700;

  cursor:pointer;transition:var(--transition);
  border:none;background:none;
}
.tab.active{
  background:linear-gradient(135deg,#ff3b3b,#ff6b35);
  color:#fff;
  box-shadow:0 2px 12px var(--glow);
}

/* ===== STAT ROW ===== */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;text-align:center;
  transition:var(--transition);
}
.stat-box:hover{

}
.stat-val{

}
.stat-lbl{font-size:10px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:60px 24px;color:var(--text2)}
.empty-icon{font-size:56px;margin-bottom:14px;opacity:0.25}
.empty-title{font-size:16px;font-weight:700;color:var(--text2);margin-bottom:6px}

/* ===== LOGIN ===== */

.login-logo{

.login-sub{font-size:13px;color:var(--text2);margin-bottom:32px}

.page-tab{

  color:#fff;border-color:transparent;
  box-shadow:0 2px 12px var(--glow);
}

/* ===== NOTIFICATION TOAST ===== */
.toast{
  position:fixed;bottom:88px;left:50%;
  transform:translateX(-50%) translateY(100px);

  border:1px solid var(--border);
  border-radius:var(--radius);

  z-index:3000;opacity:0;transition:0.4s cubic-bezier(0.4,0,0.2,1);
  pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}
.toast.warning{border-color:var(--warning);color:var(--warning)}

/* ===== FLOATING ACTION ===== */
.fab{

.fab:hover{

.progress-ring{

}
.progress-ring-circle{
  transition:stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1);
  stroke-linecap:round;
}

/* ===== SHIMMER LOADING ===== */
.shimmer{

  animation:shimmer 1.5s ease infinite;
}
@keyframes shimmer{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

/* ===== GLOW TEXT ===== */
.glow-text{

/* ===== PULSE DOT ===== */

@media(max-width:380px){
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .badge-grid{grid-template-columns:repeat(2,1fr)}

// ============================================================
// UTILITIES
// ============================================================
function ls(key, val) {
  if (val === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
  localStorage.setItem(key, JSON.stringify(val));
  return val;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function avatarColor(id) {
  const colors = ['#ff4444','#ff8800','#22c55e','#3b82f6','#a855f7','#ec4899','#14b8a6','#f59e0b'];
  return colors[(id || 0) % colors.length];
}

function avatarText(name) {
  return (name || '?').charAt(0).toUpperCase();
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts.includes(' ') ? ts.replace(' ','T') : ts);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'ahora';
  if (diff < 3600) return Math.floor(diff/60)+'m';
  if (diff < 86400) return Math.floor(diff/3600)+'h';
  return Math.floor(diff/86400)+'d';
}

function levelOf(points) {
  if (points >= 1000) return {name:'Maestro',min:1000,color:'#a855f7'};
  if (points >= 500) return {name:'Experto',min:500,color:'#f59e0b'};
  if (points >= 250) return {name:'Avanzado',min:250,color:'#3b82f6'};
  if (points >= 100) return {name:'Intermedio',min:100,color:'#22c55e'};
  return {name:'Novato',min:0,color:'#888'};
}

function nextLevel(points) {
  const lv = levelOf(points);
  const next = [100,250,500,1000,Infinity].find(n => n > points) || Infinity;
  return next;
}

function levelProgress(points) {
  const lv = levelOf(points);
  const next = nextLevel(points);
  if (next === Infinity) return 100;
  return ((points - lv.min) / (next - lv.min)) * 100;
}

function initials(name) {
  return (name || '').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
}

function timeAgo(ts) {
  if (!ts) return '';
  const d = new Date(ts.replace(' ','T'));
  const now = new Date();
  const s = Math.floor((now - d) / 1000);
  if (s < 60) return 'hace ' + s + 's';
  if (s < 3600) return 'hace ' + Math.floor(s/60) + 'm';
  if (s < 86400) return 'hace ' + Math.floor(s/3600) + 'h';
  return 'hace ' + Math.floor(s/86400) + 'd';
}

// ============================================================
// HEYVALUE SYNC
// ============================================================
async function hvRequest(method, path, body) {
  if (!HV.user || !HV.pass) return null;
  const opts = {
    method,
    headers: { Authorization: 'Basic ' + btoa(HV.user + ':' + HV.pass) }
  };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  try {
    const r = await fetch(HV.url + '/remote.php/dav/files/' + HV.user + path, opts);
    if (r.status === 207) return {ok:true, data: await r.json()};
    if (r.status === 204 || r.status === 201) return {ok:true};
    const t = await r.text();
    return {ok:false, error: t.substring(0,100)};
  } catch(e) { return {ok:false, error: e.message}; }
}

async function ensureHVDir(path) {
  await hvRequest('MKCOL', path);
}

async function saveToHV(key, data) {
  const path = '/' + HV.syncKey + '/' + key + '.json';
  await ensureHVDir('/' + HV.syncKey);
  const parts = path.split('/').filter(Boolean);
  let p = '';
  for (const part of parts.slice(0,-1)) {
    p += '/' + part;
    await ensureHVDir(p);
  }
  return hvRequest('PUT', path, data);
}

async function loadFromHV(key) {
  const r = await hvRequest('GET', '/' + HV.syncKey + '/' + key + '.json');
  if (r && r.ok && r.data) return r.data;
  return null;
}

async function syncToCloud() {
  if (!HV.user) return;
  STATE.syncStatus = 'syncing';
  const tables = ['users','routes','events','posts','badges','challenges','userChallenges','userBadges','chatChannels','chatMessages','notifications','attendance'];
  for (const t of tables) {
    await saveToHV(t, STATE[t] || []);
  }
  await saveToHV('meta', {lastSync: new Date().toISOString(), version: 1});
  STATE.syncStatus = 'synced';
}

async function syncFromCloud() {
  if (!HV.user) return;
  const tables = ['users','routes','events','posts','badges','challenges','userChallenges','userBadges','chatChannels','chatMessages','notifications','attendance'];
  let loaded = false;
  for (const t of tables) {
    const data = await loadFromHV(t);
    if (data && Array.isArray(data)) { STATE[t] = data; loaded = true; }
  }
  if (loaded) {
    STATE.users = STATE.users.length ? STATE.users : [...SEED_USERS];
    STATE.badges = STATE.badges.length ? STATE.badges : [...SEED_BADGES];
    STATE.challenges = STATE.challenges.length ? STATE.challenges : [...SEED_CHALLENGES];
    STATE.events = STATE.events.length ? STATE.events : [...SEED_EVENTS];
    STATE.routes = STATE.routes.length ? STATE.routes : [...SEED_ROUTES];
    STATE.posts = STATE.posts.length ? STATE.posts : [...SEED_POSTS];
    STATE.chatChannels = STATE.chatChannels.length ? STATE.chatChannels : [...SEED_CHANNELS];
    STATE.chatMessages = STATE.chatMessages.length ? STATE.chatMessages : [...SEED_MESSAGES];
    STATE.userChallenges = STATE.userChallenges || [];
    STATE.userBadges = STATE.userBadges || [];
    STATE.notifications = STATE.notifications || [];
    STATE.attendance = STATE.attendance || [];
  }
}

  // Load from localStorage first - USE SEED AS ABSOLUTE FALLBACK
  STATE.users = ls('bs_users') || [...SEED_USERS];
  STATE.routes = ls('bs_routes') || [...SEED_ROUTES];
  STATE.events = ls('bs_events') || [...SEED_EVENTS];
  STATE.posts = ls('bs_posts') || [...SEED_POSTS];
  STATE.badges = ls('bs_badges') || [...SEED_BADGES];
  STATE.challenges = ls('bs_challenges') || [...SEED_CHALLENGES];
  STATE.userChallenges = ls('bs_uc') || [];
  STATE.userBadges = ls('bs_ub') || [];
  STATE.chatChannels = ls('bs_cc') || [...SEED_CHANNELS];
  STATE.chatMessages = ls('bs_cm') || [...SEED_MESSAGES];
  STATE.notifications = ls('bs_notif') || [];
  STATE.attendance = ls('bs_att') || [];
  STATE.user = ls('bs_session');

  // ALWAYS show UI immediately - no waiting for HeyValue
  document.getElementById('splash').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('bottomnav').style.display = 'flex';

  if (STATE.user) {
    navigate('inicio');
    // Sync HeyValue in background - non-blocking
    if (HV.user) {
      syncFromCloud().then(() => { saveState(); });
    }
  } else {
    showLogin();
  }
}

function saveState() {
  ls('bs_users', STATE.users);
  ls('bs_routes', STATE.routes);
  ls('bs_events', STATE.events);
  ls('bs_posts', STATE.posts);
  ls('bs_badges', STATE.badges);
  ls('bs_challenges', STATE.challenges);
  ls('bs_uc', STATE.userChallenges);
  ls('bs_ub', STATE.userBadges);
  ls('bs_cc', STATE.chatChannels);
  ls('bs_cm', STATE.chatMessages);

}

function navigate(page) {
  // Update bottom nav
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.bnav-item[data-page="${page}"]`);
  if (btn) btn.classList.add('active');

  // Hide all pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  STATE.currentPage = page;
  renderPage(page);
}

function renderPage(page) {
  const el = document.getElementById('page-' + page);
  if (!el) return;
  el.classList.add('active');

  switch(page) {
    case 'inicio': renderInicio(); break;
    case 'rutas': renderRutas(); break;
    case 'bikers': renderBikers(); break;
    case 'rider-detail': renderRiderDetail(); break;
    case 'bikergram': renderBikerGram(); break;
    case 'eventos': renderEventos(); break;
    case 'retos': renderRetos(); break;
    case 'insignias': renderInsignias(); break;
    case 'profile': renderProfile(); break;
    case 'admin': renderAdmin(); break;
  }

  // Scroll to top
  el.scrollTop = 0;
}

function initHomeMap() {
  if (STATE.map) { STATE.map.remove(); STATE.map = null; }

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {subdomains:'abcd', maxZoom:19}).addTo(map);

  // My location marker
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const {latitude:lat, longitude:lng} = pos.coords;
      map.setView([lat, lng], 13);
      L.circle([lat, lng], {color:'#ff4444', fillColor:'#ff4444', fillOpacity:0.3, radius:200}).addTo(map);
      L.marker([lat, lng]).addTo(map).bindPopup('Tu ubicacion');
    }, () => {}, {timeout:5000});
  }

  // Event markers
  STATE.events.filter(e => e.latitude && e.longitude).forEach(ev => {
    L.circle([ev.latitude, ev.longitude], {
      color:'#ff8800', fillColor:'#ff8800', fillOpacity:0.4, radius:300
    }).addTo(map).bindPopup(`<b>${ev.title}</b><br>${ev.date}`);
  });

  // Route lines with real-road routing via OSRM
  STATE.routes.forEach(rt => {
    if (!rt.start_lat || !rt.end_lat) return;
    const pts = [[rt.start_lat, rt.start_lng]];
    let stops = [];
    try { stops = JSON.parse(rt.stops || '[]'); } catch(e) {}
    stops.forEach(s => { if (s.lat && s.lng) pts.push([parseFloat(s.lat), parseFloat(s.lng)]); });
    pts.push([rt.end_lat, rt.end_lng]);

    // SALIDA pill
    const startDiv = L.divIcon({className:'', html:`<div style="background:#22c55e;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">SALIDA</div>`});
    L.marker([rt.start_lat, rt.start_lng], {icon:startDiv}).addTo(map);

    // PARADA pills
    stops.forEach(s => {
      if (!s.lat || !s.lng) return;
      const stopDiv = L.divIcon({className:'', html:`<div style="background:#ff8800;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">PARADA</div>`});
      L.marker([parseFloat(s.lat), parseFloat(s.lng)], {icon:stopDiv}).addTo(map);
    });

    // DESTINO pill
    const endDiv = L.divIcon({className:'', html:`<div style="background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5)">DESTINO</div>`});

    // Dashed placeholder while OSRM loads
    const placeholder = L.polyline(pts, {color:'#ff4444', weight:4, opacity:0.4, dashArray:'10,10'}).addTo(map);

    // Real road route via OSRM
    const coords = pts.map(p => `${p[1]},${p[0]}`).join(';');

function openGmapsFor(type) {

  const browserUrl = url;
  // On mobile this opens the Google Maps app
  window.open(browserUrl, '_blank');
  toast('Busca en Google Maps, luego comparte y pega el enlace aqui');
}

function parseGmapsUrl(url) {
  // Handle various Google Maps URL formats
  // Format 1: @lat,lng,z - direct coordinates
  // Format 2: /place/Name/@lat,lng - place with coordinates
  // Format 3: ?query=lat,lng - search query
  // Format 4: !3dlocation=lat,lng!4d - data coordinates
  const patterns = [
    /@(-?\d+\.?\d*),(-?\d+\.?\d*)/,
    /!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/,
    /query=(-?\d+\.?\d*)%2C(-?\d+\.?\d*)/,
    /\?q=(-?\d+\.?\d*),(-?\d+\.?\d*)/,
    /\/place\/[^\/]+\/(-?\d+\.?\d*),(-?\d+\.?\d*)/
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  }
  return null;
}

// Auto-parse on paste into coord fields

addStopField = function() {
  _origAddStopField();
  setTimeout(function() {
    document.querySelectorAll('[id^="stop-"][id$="-lat"]').forEach(function(el) {
      el.removeEventListener('paste', handleStopPaste);
      el.addEventListener('paste', handleStopPaste);

function handleStopPaste(e) {
  setTimeout(function() {
    var latEl = e.target;
    if (!latEl.value.includes('google.com') && !latEl.value.includes('maps')) return;
    var stopId = latEl.id.replace('-lat', '');
    var lngEl = document.getElementById(stopId + '-lng');
    var coords = parseGmapsUrl(latEl.value);
    if (coords) {
      latEl.value = coords.lat;
      if (lngEl) lngEl.value = coords.lng;

    }
  }, 100);
}

    var stopId = el.id.replace('-name', '');
    var stopLat = parseFloat(document.getElementById(stopId + '-lat').value) || 0;
    var stopLng = parseFloat(document.getElementById(stopId + '-lng').value) || 0;
    if (el.value.trim() && stopLat && stopLng) {
      stops.push({name: el.value.trim(), lat: stopLat, lng: stopLng});
    }
  });

  if (!name) { toast('El nombre es obligatorio'); return; }
  const route = {
    id: Date.now() % 100000,
    name,
    description: desc,
    start_lat: startLat,
    start_lng: startLng,
    start_name: startName,
    end_lat: endLat,
    end_lng: endLng,
    end_name: endName,
    difficulty: diff,
    stops: JSON.stringify(stops),
    created_by: STATE.user.id
  };
  STATE.routes.push(route);
  saveState();
  closeModal();
  navigate('rutas');
  toast('Ruta creada!');
}

function deleteRoute(id) {
  if (!confirm('Eliminar esta ruta?')) return;
  STATE.routes = STATE.routes.filter(r => r.id !== id);
  saveState();
  closeModal();
  navigate('rutas');
  toast('Ruta eliminada');
}

function renderBikerGram() {

function renderPost(p) {
  const author = STATE.users.find(u => u.id === p.user_id) || {username:'?', bike_model:'', id:0};
  const likes = p.likes || [];
  const comments = p.comments || [];
  const isLiked = STATE.user && likes.includes(String(STATE.user.id));
  const isMyPost = STATE.user && STATE.user.id === p.user_id;
  return `
    <div class="post-card vanish">
      <div class="post-header">
        <div class="post-avatar" style="background:${avatarColor(author.id)}">${initials(author.username)}</div>
        <div style="flex:1">
          <div class="post-name">${author.username}</div>
          <div class="post-time">${timeAgo(p.created_at)}</div>
        </div>
        ${isMyPost ? `<button class="btn btn-ghost" style="padding:4px 8px;font-size:11px" onclick="deletePost(${p.id})">🗑️</button>` : ''}
      </div>
      <div class="post-content">${p.content}</div>
      ${p.image_url ? `<img class="post-image" src="${p.image_url}" onerror="this.style.display='none'">` : ''}
      <div class="post-actions">
        <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${p.id})">
          ${isLiked ? '❤️' : '🤍'} ${likes.length}
        </button>
        <button class="like-btn" onclick="showComments(${p.id})">
          💬 ${comments.length}
        </button>
      </div>
      <div id="comments-${p.id}" style="padding:0 16px 12px;display:none">
        ${comments.map(c => {
          const cu = STATE.users.find(u => u.id === c.user_id) || {username:'?', id:0};
          return `<div style="margin-top:8px;font-size:12px"><b>${cu.username}:</b> ${c.content}</div>`;
        }).join('')}
        <div style="display:flex;gap:6px;margin-top:8px">
          <input class="input" style="margin:0;flex:1;font-size:12px;padding:8px" id="cmt-${p.id}" placeholder="Escribe un comentario...">
          <button class="btn btn-primary" style="padding:6px 12px;font-size:12px" onclick="addComment(${p.id})">→</button>
        </div>
      </div>
    </div>
  `;
}

function toggleLike(postId) {
  if (!STATE.user) { toast('Inicia sesion para dar like'); return; }
  const p = STATE.posts.find(x => x.id === postId);
  if (!p) return;
  p.likes = p.likes || [];
  const uid = String(STATE.user.id);
  if (p.likes.includes(uid)) {
    p.likes = p.likes.filter(l => l !== uid);
  } else {
    p.likes.push(uid);
    if (p.user_id !== STATE.user.id) {
      STATE.notifications.push({id:Date.now(), user_id:p.user_id, actor_id:STATE.user.id, type:'like', message:STATE.user.username + ' le gusto tu publicacion', link:'/feed', read:false, created_at:new Date().toISOString()});
    }
  }
  saveState();
  renderBikerGram();
}

function showComments(postId) {
  const el = document.getElementById('comments-' + postId);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function addComment(postId) {
  if (!STATE.user) { toast('Inicia sesion para comentar'); return; }
  const input = document.getElementById('cmt-' + postId);
  if (!input || !input.value.trim()) return;
  const p = STATE.posts.find(x => x.id === postId);
  if (!p) return;
  p.comments = p.comments || [];
  p.comments.push({user_id:STATE.user.id, content:input.value.trim(), created_at:new Date().toISOString()});
  if (p.user_id !== STATE.user.id) {
    STATE.notifications.push({id:Date.now(), user_id:p.user_id, actor_id:STATE.user.id, type:'comment', message:STATE.user.username + ' comento en tu publicacion', link:'/feed', read:false, created_at:new Date().toISOString()});
  }
  saveState();
  renderBikerGram();
}

function createPost() {
  if (!STATE.user) { toast('Inicia sesion primero'); return; }
  openModal('Nueva Publicacion', `
    <textarea class="input" id="post-content" rows="4" placeholder="Que estas pensando, ${STATE.user.username}? 🏍️" style="resize:none"></textarea>
    <input class="input" id="post-img" placeholder="URL de imagen (opcional)">
    <button class="btn btn-primary" style="width:100%" onclick="doCreatePost()">Publicar</button>
  `);
}

function doCreatePost() {
  const content = document.getElementById('post-content').value.trim();
  const image_url = document.getElementById('post-img').value.trim();
  if (!content) { toast('Escribe algo'); return; }
  STATE.posts.unshift({id:Date.now()%100000, user_id:STATE.user.id, content, image_url, created_at:new Date().toISOString(), likes:[], comments:[]});
  saveState();
  closeModal();
  navigate('bikergram');
  toast('Publicado!');
}

function deletePost(id) {
  if (!confirm('Eliminar esta publicacion?')) return;
  STATE.posts = STATE.posts.filter(p => p.id !== id);
  saveState();
  renderBikerGram();
  toast('Eliminado');
}

function showEventTab(tab, btn) {

function renderEventCard(ev) {
  const attCount = STATE.attendance.filter(a => a.event_id === ev.id).length;
  const myAtt = STATE.user && STATE.attendance.find(a => a.event_id === ev.id && a.user_id === STATE.user.id);
  return `
    <div class="event-card vanish" onclick="viewEvent(${ev.id})">
      <div style="height:140px;background:linear-gradient(135deg,rgba(255,68,68,0.3),rgba(255,136,0,0.15));display:flex;align-items:center;justify-content:center;font-size:48px">🏍️</div>

        </div>
      </div>
    </div>
  `;
}

function viewEvent(id) {
  const ev = STATE.events.find(x => x.id === id);
  if (!ev) return;
  const attCount = STATE.attendance.filter(a => a.event_id === ev.id).length;
  const attList = STATE.attendance.filter(a => a.event_id === ev.id).map(a => STATE.users.find(u => u.id === a.user_id)).filter(Boolean);
  const myAtt = STATE.user && STATE.attendance.find(a => a.event_id === ev.id && a.user_id === STATE.user.id);

  openModal(ev.title, `
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">
      📅 ${ev.date} · 🕐 ${ev.time}<br>
      📍 ${ev.location || 'N/A'} · ⚡ ${ev.difficulty}
    </div>
    ${ev.description ? `<p style="margin-bottom:16px">${ev.description}</p>` : ''}
    <div style="margin-bottom:16px">
      <div style="font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px">ASISTENTES (${attCount})</div>
      ${attList.length === 0 ? '<div style="font-size:12px;color:var(--text3)">Nadie ha confirmado aun</div>' :
        attList.map(u => `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px">
          <div style="width:28px;height:28px;border-radius:50%;background:${avatarColor(u.id)};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff">${initials(u.username)}</div>

          ${u.is_injured ? '<span class="badge-red" style="font-size:9px">LESIONADO</span>' : ''}

    </div>

      ? '<button class="btn btn-secondary" style="width:100%" onclick="cancelEvent(' + ev.id + ')">Cancelar asistencia</button>'
      : '<button class="btn btn-primary" style="width:100%" onclick="confirmEvent(' + ev.id + ')">Confirmar asistencia</button>'}
    ${STATE.user?.is_admin ? `<button class="btn btn-ghost" style="width:100%;margin-top:8px;color:var(--danger)" onclick="deleteEvent(${ev.id})">Eliminar evento</button>` : ''}
  `);
}

function confirmEvent(id) {
  if (!STATE.user) { toast('Inicia sesion'); return; }
  if (STATE.attendance.find(a => a.event_id === id && a.user_id === STATE.user.id)) {
    toast('Ya confirmaste'); return;
  }
  STATE.attendance.push({id:Date.now(), user_id:STATE.user.id, event_id:id, confirmed_at:new Date().toISOString(), notes:'', status:'confirmed', featured:false});
  saveState();
  closeModal();
  navigate('eventos');
  toast('Asistencia confirmada!');
}

function cancelEvent(id) {
  STATE.attendance = STATE.attendance.filter(a => !(a.event_id === id && a.user_id === STATE.user.id));
  saveState();
  closeModal();
  navigate('eventos');
  toast('Asistencia cancelada');
}

function deleteEvent(id) {
  if (!confirm('Eliminar este evento?')) return;
  STATE.events = STATE.events.filter(e => e.id !== id);
  STATE.attendance = STATE.attendance.filter(a => a.event_id !== id);
  saveState();
  closeModal();
  navigate('eventos');
  toast('Evento eliminado');
}

function renderRetos() {

        <div style="font-size:12px;color:var(--text2);margin-bottom:4px">RETOS SEMANALES</div>
        ${weekly.map(c => renderChallengeCard(c, myChallenges)).join('')}
      </div>
    </div>

    <div style="margin-bottom:16px">
      <div class="card" style="padding:14px">
        <div style="font-size:12px;color:var(--text2);margin-bottom:4px">RETOS ESPECIALES</div>
        ${special.map(c => renderChallengeCard(c, myChallenges)).join('')}

function renderChallengeCard(c, myChallenges) {
  const myProg = myChallenges.find(mc => mc.challenge_id === c.id);
  const progress = myProg ? myProg.progress : 0;
  const pct = Math.min(100, (progress / c.requirement_count) * 100);
  const done = myProg && myProg.completed;
  return `
    <div class="challenge-card ${done ? 'earned' : ''}" style="margin-top:12px">
      <div class="challenge-title">
        <span style="font-size:20px">${c.icon}</span>
        ${c.title}
        ${done ? '<span class="badge-green" style="font-size:10px">COMPLETADO</span>' : ''}
      </div>
      <div class="challenge-desc">${c.description}</div>
      <div class="challenge-progress">
        <div class="challenge-track"><div class="challenge-fill" style="width:${pct}%"></div></div>
        <div class="challenge-points">${progress}/${c.requirement_count}</div>
      </div>
      <div style="margin-top:8px;font-size:12px;color:var(--accent);font-weight:600">+${c.points} pts</div>
    </div>
  `;
}

// ============================================================
// INSIGNIAS PAGE
// ============================================================
function renderInsignias() {
  const earned = STATE.userBadges.filter(ub => ub.user_id === STATE.user?.id).map(ub => ub.badge_id);
  const categories = [...new Set(STATE.badges.map(b => b.category))];

  document.getElementById('page-insignias').innerHTML = `
    <div style="margin-bottom:16px">
      <div style="font-size:18px;font-weight:800;margin-bottom:4px">Insignias</div>
      <div style="font-size:12px;color:var(--text2)">${earned.length} de ${STATE.badges.length} obtenidas</div>
    </div>
    ${categories.map(cat => `
      <div style="margin-bottom:20px">
        <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase">${cat}</div>
        <div class="badge-grid">
          ${STATE.badges.filter(b => b.category === cat).map(b => `
            <div class="badge-item ${earned.includes(b.id) ? 'earned' : ''}" onclick="showBadgeDetail(${b.id})">
              <div class="badge-icon">${b.icon}</div>
              <div class="badge-name">${b.name}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('')}
  `;
}

function showBadgeDetail(id) {
  const b = STATE.badges.find(x => x.id === id);
  if (!b) return;
  const earned = STATE.userBadges.find(ub => ub.badge_id === id && ub.user_id === STATE.user?.id);
  openModal(b.name, `
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:60px;margin-bottom:8px">${b.icon}</div>
      <div style="font-size:16px;font-weight:700">${b.name}</div>
      <div style="color:var(--text2);font-size:13px;margin-top:4px">${b.description}</div>
    </div>
    ${earned
      ? `<div style="text-align:center"><span class="badge-green">✅ Ganada el ${new Date(earned.earned_at).toLocaleDateString()}</span></div>`
      : `<div style="text-align:center;color:var(--text3);font-size:13px">Sigue participando para desbloquear esta insignia</div>`
    }
  `);
}

// ============================================================
// PROFILE PAGE
// ============================================================
function renderProfile() {
  const u = STATE.user;
  if (!u) { showLogin(); return; }
  const lv = levelOf(u.points);
  const progress = levelProgress(u.points);
  const next = nextLevel(u.points);
  const earned = STATE.userBadges.filter(ub => ub.user_id === u.id).map(ub => ub.badge_id);
  const myAtt = STATE.attendance.filter(a => a.user_id === u.id).length;
  const myRoutes = STATE.routes.filter(r => r.created_by === u.id).length;

  document.getElementById('page-profile').innerHTML = `
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,${avatarColor(u.id)},${avatarColor(u.id+1)});display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;margin:0 auto 12px">${initials(u.username)}</div>
      <div style="font-size:20px;font-weight:800">${u.username} ${u.is_admin ? '<span class="badge-gold" style="font-size:11px">ADMIN</span>' : ''}</div>
      <div style="color:var(--text2);font-size:13px">${u.email}</div>
      <div style="color:var(--text2);font-size:13px">${u.bike_model || 'Sin moto'}</div>
      ${u.bio ? `<div style="color:var(--text2);font-size:13px;margin-top:6px;font-style:italic">"${u.bio}"</div>` : ''}
    </div>

    <div class="points-bar" style="margin-bottom:16px">
      <div class="points-level">
        <div class="points-label">Nivel ${lv.name}</div>
        <div class="points-track"><div class="points-fill" style="width:${progress}%"></div></div>
      </div>
      <div class="points-value">${u.points} pts</div>
    </div>

    <div class="stat-row vanish" style="animation-delay:0.05s">
      <div class="stat-box"><div class="stat-val">${myAtt}</div><div class="stat-lbl">Eventos</div></div>
      <div class="stat-box"><div class="stat-val">${myRoutes}</div><div class="stat-lbl">Rutas</div></div>
      <div class="stat-box"><div class="stat-val">${earned.length}</div><div class="stat-lbl">Insignias</div></div>
    </div>

    <div class="vanish" style="animation-delay:0.1s">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text2)">MIS INSIGNIAS</div>
      <div class="badge-grid">
        ${STATE.badges.map(b => `
          <div class="badge-item ${earned.includes(b.id) ? 'earned' : ''}" title="${b.description}">
            <div class="badge-icon">${b.icon}</div>
            <div class="badge-name">${b.name}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div style="margin-top:20px" class="vanish" style="animation-delay:0.15s">
      <button class="btn btn-secondary" style="width:100%;margin-bottom:8px" onclick="editRider(${u.id})">Editar perfil</button>
      <button class="btn btn-secondary" style="width:100%;margin-bottom:8px" onclick="closeModal();navigate('rutas');setTimeout(createRoute,300)">Crear ruta</button>
      <button class="btn btn-ghost" style="width:100%;color:var(--danger)" onclick="logout()">Cerrar sesion</button>
    </div>
  `;
}

// ============================================================
// ADMIN PAGE
// ============================================================
function renderAdmin() {
  if (!STATE.user?.is_admin) { navigate('inicio'); return; }

  document.getElementById('page-admin').innerHTML = `
    <div style="font-size:18px;font-weight:800;margin-bottom:16px">Panel de Admin</div>

    <!-- USERS -->
    <div class="admin-section">
      <div class="admin-section-header" onclick="toggleAdmin('users')">👥 Usuarios (${STATE.users.length}) <span id="arrow-users">▼</span></div>
      <div class="admin-list" id="admin-users" style="display:none">
        ${STATE.users.map(u => `
          <div class="admin-list-item">
            <div style="width:32px;height:32px;border-radius:50%;background:${avatarColor(u.id)};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff">${initials(u.username)}</div>
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600">${u.username}</div>
              <div style="font-size:11px;color:var(--text2)">${u.email}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:12px;color:var(--accent);font-weight:600">${u.points}pts</div>
              ${u.is_admin ? '<span class="badge-gold" style="font-size:9px">ADMIN</span>' : ''}
              ${u.is_injured ? '<span class="badge-red" style="font-size:9px">INJ</span>' : ''}
            </div>
            <button class="btn btn-ghost" style="font-size:11px;padding:4px" onclick="editRider(${u.id})">✏️</button>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- EVENTS -->
    <div class="admin-section">
      <div class="admin-section-header" onclick="toggleAdmin('events')">📅 Eventos (${STATE.events.length}) <span id="arrow-events">▼</span></div>
      <div class="admin-list" id="admin-events" style="display:none">
        ${STATE.events.map(ev => `
          <div class="admin-list-item">
            <div style="flex:1">
              <div style="font-size:13px;font-weight:600">${ev.title}</div>
              <div style="font-size:11px;color:var(--text2)">${ev.date} · ${ev.location}</div>
            </div>
            <span class="badge ${ev.status==='activo'?'badge-green':'badge-red'}" style="font-size:10px">${ev.status}</span>
            <button class="btn btn-ghost" style="font-size:11px;padding:4px" onclick="editEvent(${ev.id})">✏️</button>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- NOTIFICATIONS -->
    <div class="admin-section">
      <div class="admin-section-header" onclick="toggleAdmin('notif')">🔔 Notificaciones (${STATE.notifications.length}) <span id="arrow-notif">▼</span></div>
      <div class="admin-list" id="admin-notif" style="display:none">
        ${STATE.notifications.length === 0 ? '<div style="padding:12px;font-size:12px;color:var(--text3)">Sin notificaciones</div>' :
          STATE.notifications.map(n => `
            <div class="admin-list-item" style="flex-direction:column;align-items:flex-start;gap:4px">
              <div style="font-size:12px">${n.message}</div>
              <div style="font-size:10px;color:var(--text3)">${timeAgo(n.created_at)}</div>
            </div>
          `).join('')}
        <button class="btn btn-ghost" style="width:100%;margin-top:8px;color:var(--danger);font-size:12px" onclick="STATE.notifications=[];saveState();renderAdmin();toast('Notificaciones borradas')">Borrar todas</button>
      </div>
    </div>

    <!-- SYNC -->
    <div class="admin-section">
      <div class="admin-section-header" onclick="toggleAdmin('sync')">☁️ HeyValue Sync <span id="arrow-sync">▼</span></div>
      <div class="admin-list" id="admin-sync" style="display:none">
        <div style="padding:12px;font-size:12px">
          <div>Estado: <b>${STATE.syncStatus}</b></div>
          <div style="margin-top:8px">Usuario: <b>${HV.user || 'No configurado'}</b></div>
          <button class="btn btn-primary" style="margin-top:10px;width:100%" onclick="syncToCloud();toast('Sincronizando...')">Forzar sincronizacion</button>
          <button class="btn btn-secondary" style="margin-top:6px;width:100%" onclick="showHVSetup()">Configurar HeyValue</button>
        </div>
      </div>
    </div>

    <!-- DANGER -->
    <div style="margin-top:24px;padding:16px;border:1px solid var(--danger);border-radius:var(--radius)">
      <div style="font-size:13px;font-weight:700;color:var(--danger);margin-bottom:8px">Zona de peligro</div>
      <button class="btn btn-ghost" style="width:100%;color:var(--danger);border:1px solid var(--danger);margin-bottom:8px" onclick="if(confirm('Resetear TODOS los datos?')){localStorage.clear();location.reload()}">Resetear todos los datos</button>
    </div>
  `;
}

function toggleAdmin(section) {
  const el = document.getElementById('admin-' + section);
  if (!el) return;
  const isHidden = el.style.display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  const arrow = document.getElementById('arrow-' + section);
  if (arrow) arrow.textContent = isHidden ? '▲' : '▼';
}

function editEvent(id) {
  const ev = STATE.events.find(x => x.id === id);
  if (!ev) return;
  openModal('Editar Evento', `
    <input class="input" id="ev-title" value="${ev.title}" placeholder="Titulo">
    <input class="input" id="ev-desc" value="${ev.description}" placeholder="Descripcion">
    <input class="input" id="ev-date" type="date" value="${ev.date}" class="input">
    <input class="input" id="ev-time" type="time" value="${ev.time}" class="input">
    <input class="input" id="ev-location" value="${ev.location}" placeholder="Ubicacion">
    <select class="input" id="ev-diff">
      <option value="facil" ${ev.difficulty==='facil'?'selected':''}>Facil</option>
      <option value="intermedia" ${ev.difficulty==='intermedia'?'selected':''}>Intermedia</option>
      <option value="alta" ${ev.difficulty==='alta'?'selected':''}>Alta</option>
    </select>
    <select class="input" id="ev-status">
      <option value="activo" ${ev.status==='activo'?'selected':''}>Activo</option>
      <option value="cancelado" ${ev.status==='cancelado'?'selected':''}>Cancelado</option>
      <option value="completado" ${ev.status==='completado'?'selected':''}>Completado</option>
    </select>
    <button class="btn btn-primary" style="width:100%" onclick="doEditEvent(${id})">Guardar</button>
  `);
}

function doEditEvent(id) {
  const ev = STATE.events.find(x => x.id === id);
  if (!ev) return;
  ev.title = document.getElementById('ev-title').value.trim() || ev.title;
  ev.description = document.getElementById('ev-desc').value.trim();
  ev.date = document.getElementById('ev-date').value || ev.date;
  ev.time = document.getElementById('ev-time').value || ev.time;
  ev.location = document.getElementById('ev-location').value.trim();
  ev.difficulty = document.getElementById('ev-diff').value;
  ev.status = document.getElementById('ev-status').value;
  saveState();
  closeModal();
  navigate('admin');
  toast('Evento actualizado');
}

// ============================================================
// NOTIFICATIONS
// ============================================================
function showNotifications() {
  const myNotifs = STATE.notifications.filter(n => n.user_id === STATE.user?.id).reverse().slice(0,20);
  const unread = myNotifs.filter(n => !n.read).length;
  openModal(`Notificaciones ${unread > 0 ? `(${unread} nuevas)` : ''}`, `
    ${myNotifs.length === 0 ? '<div style="text-align:center;padding:24px;color:var(--text3)">No hay notificaciones</div>' :
      myNotifs.map(n => `
        <div style="padding:10px 0;border-bottom:1px solid var(--border);${!n.read ? 'background:rgba(255,68,68,0.05);padding:10px;border-radius:8px;margin-bottom:4px' : ''}">
          <div style="font-size:13px">${n.message}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">${timeAgo(n.created_at)}</div>
        </div>
      `).join('')}
    <button class="btn btn-ghost" style="width:100%;margin-top:8px;font-size:12px" onclick="STATE.notifications=STATE.notifications.map(n=>({...n,read:true}));saveState();closeModal();toast('Notificaciones marcadas como leidas')">Marcar todas como leidas</button>
  `);
  STATE.notifications = STATE.notifications.map(n => ({...n, read: true}));
  saveState();
}

// ============================================================
// MODAL
// ============================================================
function openModal(title, content) {
  document.getElementById('modal-content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:16px;font-weight:700">${title}</div>
      <button class="btn btn-ghost" style="padding:4px 8px;font-size:16px" onclick="closeModal()">✕</button>
    </div>
    ${content}
  `;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', initApp);

</script>
</html>
